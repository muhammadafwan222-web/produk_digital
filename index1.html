const SQL_SETUP=`-- SHARETOSHARE COMPATIBLE SECURE SCHEMA
-- Nama tabel & kolom SAMA dengan script lama: creator, products, links, blog_posts,
-- subscribers, broadcast_logs, app_settings. Hanya kebijakan akses (RLS) yang diperbaiki.

create table if not exists public.subscribers (
  id text primary key, name text default '', email text default '', raw_email text default '',
  whatsapp text default '', source text default 'manual', tags text default '', status text default 'aktif',
  notes text default '', last_campaign text default '', last_status text default '',
  last_sent_at timestamptz, created_at timestamptz default now()
);
create table if not exists public.broadcast_logs (
  id text primary key, name text default '', email text default '', whatsapp text default '',
  channel text default '', campaign text default '', status text default '',
  note text default '', message text default '', created_at timestamptz default now()
);
create table if not exists public.app_settings (
  id int primary key default 1, settings jsonb default '{}'::jsonb, updated_at timestamptz default now()
);

alter table public.creator enable row level security;
alter table public.products enable row level security;
alter table public.links enable row level security;
alter table public.blog_posts enable row level security;
alter table public.subscribers enable row level security;
alter table public.broadcast_logs enable row level security;
alter table public.app_settings enable row level security;

-- Hapus semua policy lama (termasuk policy "subscribers_all" yang membocorkan data)
do $$ declare r record; begin
  for r in select policyname, tablename from pg_policies
    where schemaname='public' and tablename in ('creator','products','links','blog_posts','subscribers','broadcast_logs','app_settings')
  loop execute format('drop policy if exists %I on public.%I', r.policyname, r.tablename); end loop;
end $$;

create policy "creator_read_public" on public.creator for select to anon, authenticated using (true);
create policy "creator_admin_all" on public.creator for all to authenticated using (true) with check (true);

create policy "products_admin_all" on public.products for all to authenticated using (true) with check (true);
create policy "links_read_public" on public.links for select to anon, authenticated using (true);

-- Verifikasi "Sudah Daftar" tanpa membocorkan isi database
create or replace function public.verify_subscriber(contact text)
returns boolean language plpgsql security definer set search_path=public as $$
declare w text; begin
  w := regexp_replace(coalesce(contact,''), '\\D', '', 'g');
  if left(w,1)='0' then w := '62'||substring(w from 2); end if;
  return exists(select 1 from subscribers where status is distinct from 'nonaktif'
    and (lower(email)=lower(trim(contact)) or lower(raw_email)=lower(trim(contact)) or (length(w)>=9 and whatsapp=w)));
end $$;
grant execute on function public.verify_subscriber(text) to anon, authenticated;

-- Counter aman (pengunjung tidak bisa mengubah tabel creator)
create or replace function public.increment_visitor() returns void
language sql security definer set search_path=public as $$ update creator set "visitorCount"=coalesce("visitorCount",0)+1 where id=1 $$;
create or replace function public.increment_share() returns void
language sql security definer set search_path=public as $$ update creator set "shareCount"=coalesce("shareCount",0)+1 where id=1 $$;
grant execute on function public.increment_visitor() to anon, authenticated;
grant execute on function public.increment_share() to anon, authenticated;`;

{adminTab==='leads'&&<div className="space-y-5"><div className="flex gap-2 flex-wrap">{[['data','Database Kontak','fa-table'],['kirim','Kirim Broadcast','fa-paper-plane'],['otomatis','Otomatisasi','fa-robot'],['pengaturan','Pengaturan','fa-sliders'],['log','Log Pengiriman','fa-clipboard-list']].map(([k,l,i])=><button key={k} onClick={()=>setLeadsTab(k)} className={'tab-btn '+(leadsTab===k?'bg-gradient-to-r from-emerald-500 to-cyan-500 text-white':'glass-soft text-slate-300')}><i className={'fa-solid '+i+' mr-1.5'}/>{l}</button>)}</div>

-solid fa-bookmark mr-1"/>Simpan View</button>{selectedLeads.length>0&&<><button onClick={()=>runBroadcast({targets:subsRef.current.filter(s=>selectedLeads.includes(s.id)),campaignName:'Kirim Terpilih'})} className="btn-success px-4 py-2.5 rounded-xl text-xs font-bold"><i className="fa-solid fa-paper-plane mr-1"/>Kirim ({selectedLeads.length})</button><button onClick={bulkDeleteLeads} className="btn-danger px-4 py-2.5 rounded-xl text-xs font-bold"><i className="fa-solid fa-trash mr-1"/>Hapus ({selectedLeads.length})</button></>}</div>{savedViews.length>0&&<div className="flex flex-wrap gap-2 pt-1">{savedViews.map(v=><span key={v.name} className="chip-var flex items-center gap-1" onClick={()=>{setLeadsSearch(v.q||'');setLeadsSource(v.src||'Semua');setLeadsStatus(v.status||'Semua');setLeadsTag(v.tag||'')}}><i className="fa-solid fa-bookmark text-[8px]"/>{v.name}<button className="ml-1 opacity-60 hover:opacity-100" onClick={e=>{e.stopPropagation();const n=savedViews.filter(x=>x.name!==v.name);setSavedViews(n);LS.set('sts_saved_views',n)}}><i className="fa-solid fa-xmark"/></button></span>)}</div>}</div>

{leadsTab==='kirim'&&<div className="grid lg:grid-cols-[1fr_360px] gap-5 items-start"><div className="glass p-6 rounded-2xl space-y-4"><div><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-paper-plane text-emerald-400 mr-2"/>Compose Broadcast</h3><p className="text-[10px] text-slate-500 mt-1">Pesan lengkap dengan nama, produk, harga & link — ke semua kontak terpilih.</p></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3"><Field label="Kanal"><select value={compose.channel} onChange={e=>setCompose({...compose,channel:e.target.value})} className="input-premium"><option value="wa">WhatsApp</option><option value="email">Email</option><option value="both">Keduanya</option></select></Field><Field label="Mode"><select value={compose.sendMode} onChange={e=>setCompose({...compose,sendMode:e.target.value})} className="input-premium"><option value="auto">Otomatis berurutan</option><option value="link">Buat daftar link</option></select></Field><Field label="Jeda (detik)"><input type="number" min="1" max="60" value={compose.delaySeconds} onChange={e=>setCompose({...compose,delaySeconds:Number(e.target.value)||1})} className="input-premium"/></Field><Field label="Nama Kampanye"><input value={compose.campaignName} onChange={e=>setCompose({...compose,campaignName:e.target.value})} placeholder="Promo November" className="input-premium"/></Field></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3"><Field label="Sumber"><select value={compose.targetSource} onChange={e=>setCompose({...compose,targetSource:e.target.value})} className="input-premium"><option>Semua</option>{leadSources.filter(s=>s!=='Semua').map(s=><option key={s}>{s}</option>)}</select></Field><Field label="Status"><select value={compose.targetStatus} onChange={e=>setCompose({...compose,targetStatus:e.target.value})} className="input-premium"><option>Semua</option><option value="aktif">aktif</option><option value="nonaktif">nonaktif</option></select></Field><Field label="Filter Tag"><input value={compose.targetTag} onChange={e=>setCompose({...compose,targetTag:e.target.value})} placeholder="pelanggan" className="input-premium"/></Field><Field label="Produk"><select value={compose.productId} onChange={e=>setCompose({...compose,productId:e.target.value})} className="input-premium"><option value="">— Pilih produk —</option>{products.map(p=><option key={p.id} value={p.id}>{p.title} ({formatIDR(p.price)})</option>)}</select></Field></div><Field label="Link Tujuan"><input value={compose.link} onChange={e=>setCompose({...compose,link:e.target.value})} placeholder={storeUrl()} className="input-premium"/></Field><Field label="Subjek Email"><input value={compose.subject} onChange={e=>setCompose({...compose,subject:e.target.value})} className="input-premium"/></Field><div><label className="field-label">Isi Pesan</label><textarea ref={msgAreaRef} rows="9" value={compose.message} onChange={e=>setCompose({...compose,message:e.target.value})} className="input-premium font-mono text-[11px]"/><div className="flex flex-wrap gap-1.5 mt-2">{['{{nama}}','{{email}}','{{wa}}','{{produk}}','{{harga}}','{{link}}','{{bonus}}','{{bonus_link}}','{{toko}}','{{tanggal}}','{{footer}}'].map(v=><button key={v} onClick={()=>insertVariable(v)} className="chip-var">{v}</button>)}</div></div><div className="flex items-center gap-3 glass-dark rounded-xl p-3"><Toggle checked={settings.simulateMode} onChange={v=>persistSettings({...settingsRef.current,simulateMode:v})}/><span className="text-[11px] text-slate-300"><b>Mode Simulasi</b> — proses kirim dicatat sebagai terkirim tanpa membuka popup (untuk uji coba).</span></div><div className="flex flex-wrap gap-2 pt-1"><button disabled={sending} onClick={()=>runBroadcast({onlyIds:selectedLeads.length?selectedLeads:undefined})} className="btn-premium px-5 py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-bolt mr-1"/>{sending?'Mengirim...':`${compose.sendMode==='link'?'Buat Link':'Kirim'} (${selectedLeads.length||getTargets().length} kontak)`}</button><button disabled={!gsConfig.webAppUrl||gsBroadcastRunning} onClick={broadcastViaWAWeb} className="px-5 py-3 rounded-xl text-xs font-bold text-white border-none" style={{background:'linear-gradient(135deg,#25D366,#128C7E)',boxShadow:'0 8px 25px rgba(37,211,102,.3)'}}><i className="fa-brands fa-whatsapp mr-1"/>{gsBroadcastRunning?'Membuka...':`WA Web (${selectedLeads.length||subscribers.filter(s=>s.whatsapp).length})`}</button><button disabled={!sending} onClick={()=>{cancelRef.current=true}} className="btn-danger px-5 py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-stop mr-1"/>Hentikan</button></div>{(sending||lastResult)&&<div className="glass-dark rounded-2xl p-4 space-y-3"><div className="flex items-center justify-between text-[11px]"><span className="font-bold flex items-center gap-2">{sending&&<span className="status-dot dot-live"/>}{sending?`Mengirim ke ${sendProgress.current}`:'Pengiriman terakhir'}</span><span className="text-slate-400">{sendProgress.done}/{sendProgress.total} · ✅ {sendProgress.ok} · ❌ {sendProgress.fail}</span></div><div className="progress-track"><div className="progress-fill" style={{width:`${sendProgress.total?Math.round(sendProgress.done/sendProgress.total*100):0}%`}}/></div>{lastResult?.links?.length>0&&<div className="space-y-1.5 max-h-48 overflow-y-auto pt-1">{lastResult.links.map((l,i)=><div key={i} className="flex items-center gap-2 text-[10px] glass-soft rounded-lg px-2.5 py-2"><span className="font-bold flex-1 truncate">{l.name} · {l.ch}</span><a href={l.url} target="_blank" rel="noreferrer" className="text-cyan-300 font-bold">Buka</a><button onClick={()=>copyText(l.url,'Link')} className="text-slate-400 hover:text-white"><i className="fa-solid fa-copy"/></button></div>)}<button onClick={()=>copyText(lastResult.links.map(l=>l.url).join('\n'),'Semua link')} className="w-full btn-ghost py-2 rounded-lg text-[10px] font-bold mt-1"><i className="fa-solid fa-copy mr-1"/>Salin Semua Link</butt {leadsTab==='otomatis'&&<div className="grid md:grid-cols-2 gap-5"><div className="glass p-6 rounded-2xl space-y-4"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-robot text-cyan-400 mr-2"/>Pemicu Broadcast Otomatis</h3>{[['autoBroadcastLead','Pesan selamat datang saat lead baru','Setiap pendaftar langsung menerima pesan WA + email berisi bonus & perkenalan.'],['autoBroadcastProduct','Broadcast saat produk baru terbit','Produk baru dikirim lengkap (nama, harga, link) ke semua kontak aktif.'],['autoBroadcastArticle','Broadcast saat artikel baru terbit','Judul + link artikel terkirim ke semua kontak aktif.'],['contentGateEnabled','Gerbang leads: kunci konten','Pengunjung wajib daftar sebelum membuka blog atau detail produk.'],['gateBlog','Kunci artikel / blog','Artikel hanya bisa dibaca setelah terdaftar.'],['gateProducts','Kunci detail produk','Detail & tombol beli hanya bisa diakses setelah terdaftar.']].map(([k,t,d])=><div key={k} className="flex items-start gap-3 glass-dark rounded-xl p-3"><span className="mt-0.5"><Toggle checked={settingsForm[k]} onChange={v=>setSettingsForm({...settingsForm,[k]:v})}/></span><div><div className="text-xs font-bold">{t}</div><div className="text-[10px] text-slate-400 mt-1">{d}</div></div></div>)}<Field label="Template: Produk Baru"><textarea rows="4" value={settingsForm.autoTemplateProduct} onChange={e=>setSettingsForm({...settingsForm,autoTemplateProduct:e.target.value})} className="input-premium font-mono text-[11px]"/></Field><Field label="Template: Artikel Baru"><textarea rows="3" value={settingsForm.autoTemplateArticle} onChange={e=>setSettingsForm({...settingsForm,autoTemplateArticle:e.target.value})} className="input-premium font-mono text-[11px]"/></Field><Field label="Template: Selamat Datang"><textarea rows="4" value={settingsForm.welcomeMessage} onChange={e=>setSettingsForm({...settingsForm,welcomeMessage:e.target.value})} className="input-premium font-mono text-[11px]"/></Field><button onClick={handleSaveSettings} className="w-full btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-floppy-disk mr-2"/>Simpan Otomatisasi</button></div><div className="glass p-6 rounded-2xl space-y-4"><h3 className="font-display font-extrabold text-sm"><i className="fa-regular fa-clock text-amber-400 mr-2"/>Jadwal Kirim Otomatis</h3><p className="text-[10px] text-slate-400">Tentukan tanggal & jam. Broadcast berjalan otomatis selama halaman admin terbuka.</p><input type="datetime-local" value={settingsForm.scheduledAt||''} onChange={e=>setSettingsForm({...settingsForm,scheduledAt:e.target.value})} className="input-premium"/><button onClick={handleSaveSettings} className="w-full btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-calendar-check mr-2"/>Aktifkan Jadwal</button>{settings.scheduledAt&&<div className="glass-dark rounded-xl p-3 text-[10px] text-amber-200"><i className="fa-solid fa-hourglass-half mr-1"/>Terjadwal: <b>{fmtDateTime(settings.scheduledAt)}</b></div>}<div className="glass-dark rounded-xl p-4 text-[10px] text-slate-400 leading-relaxed"><i className="fa-solid fa-lightbulb text-amber-300 mr-1"/>Tips: kirim maksimal 2–3× seminggu. Sertakan cara berhenti berlangganan (balas STOP) di setiap pesan.</div></div></div>}

{leadsTab==='pengaturan'&&<form onSubmit={handleSaveSettings} className="grid md:grid-cols-2 gap-5"><div className="glass p-6 rounded-2xl space-y-3"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-envelope-circle-check text-indigo-400 mr-2"/>EmailJS</h3><p className="text-[10px] text-slate-400">Gratis di emailjs.com → buat service & template, tempel 3 kode.</p><Field label="Public Key"><input value={settingsForm.emailjsPublicKey} onChange={e=>setSettingsForm({...settingsForm,emailjsPublicKey:e.target.value})} className="input-premium"/></Field><Field label="Service ID"><input value={settingsForm.emailjsServiceId} onChange={e=>setSettingsForm({...settingsForm,emailjsServiceId:e.target.value})} className="input-premium"/></Field><Field label="Template ID"><input value={settingsForm.emailjsTemplateId} onChange={e=>setSettingsForm({...settingsForm,emailjsTemplateId:e.target.value})} className="input-premium"/></Field><Field label="Email Tujuan Tes"><input value={settingsForm.testEmail||''} onChange={e=>setSettingsForm({...settingsForm,testEmail:e.target.value})} placeholder="admin@email.com" className="input-premium"/></Field><button type="button" onClick={testEmailConfig} className="w-full btn-ghost py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-vial mr-2"/>Uji Email</button></div><div className="glass p-6 rounded-2xl space-y-3"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-magnet text-pink-400 mr-2"/>Lead Magnet</h3><Field label="Judul Ajakan"><input value={settingsForm.leadTitle} onChange={e=>setSettingsForm({...settingsForm,leadTitle:e.target.value})} className="input-premium"/></Field><Field label="Deskripsi"><textarea rows="3" value={settingsForm.leadDescription} onChange={e=>setSettingsForm({...settingsForm,leadDescription:e.target.value})} className="input-premium"/></Field><Field label="Teks Bonus"><input value={settingsForm.leadBonusText} onChange={e=>setSettingsForm({...settingsForm,leadBonusText:e.target.value})} className="input-premium"/></Field><Field label="Link Bonus"><input value={settingsForm.bonusUrl||creator.bonusUrl} onChange={e=>setSettingsForm({...settingsForm,bonusUrl:e.target.value})} className="input-premium"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Popup Delay (detik)"><input type="number" min="3" max="120" value={settingsForm.leadPopupDelay} onChange={e=>setSettingsForm({...settingsForm,leadPopupDelay:Number(e.target.value)||12})} className="input-premium"/></Field><Field label="Aktifkan Popup"><span className="block mt-2"><Toggle checked={settingsForm.leadPopupEnabled} onChange={v=>setSettingsForm({...settingsForm,leadPopupEnabled:v})}/></span></Field></div></div><div className="glass p-6 rounded-2xl space-y-3 md:col-span-2"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-message text-cyan-400 mr-2"/>Template Utama</h3><div className="grid md:grid-cols-2 gap-3"><Field label="Subjek Email"><input value={settingsForm.emailSubject} onChange={e=>setSettingsForm({...settingsForm,emailSubject:e.target.value})} className="input-premium"/></Field><Field label="Footer Pesan"><input value={settingsForm.waFooter} onChange={e=>setSettingsForm({...settingsForm,waFooter:e.target.value})} className="input-premium"/></Field></div><Field label="Isi Pesan Broadcast"><textarea rows="5" value={settingsForm.messageTemplate} onChange={e=>setSettingsForm({...settingsForm,messageTemplate:e.target.value})} className="input-premium font-mono text-[11px]"/></Field></div><div className="md:col-span-2"><button type="submit" className="w-full btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-floppy-disk mr-2"/>Simpan Semua Pengaturan</button></div></form>}

{leadsTab==='log'&&<div className="glass p-6 rounded-2xl space-y-4"><div className="flex items-center justify-between flex-wrap gap-2"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-clipboard-list text-cyan-400 mr-2"/>Log Pengiriman ({broadcastLogs.length})</h3><div className="flex gap-2"><button onClick={exportLogsExcel} className="btn-ghost px-4 py-2 rounded-xl text-xs font-bold"><i className="fa-solid fa-file-excel mr-1"/>Export Excel</button><button onClick={clearLogs} className="btn-danger px-4 py-2 rounded-xl text-xs font-bold"><i className="fa-solid fa-trash mr-1"/>Bersihkan</button></div></div><div className="table-wrap max-h-[520px]"><table className="admin-table"><thead><tr><th>Waktu</th><th>Kontak</th><th>Kanal</th><th>Kampanye</th><th>Status</th><th>Keterangan</th></tr></thead><tbody>{broadcastLogs.slice(0,200).map(l=><tr key={l.id}><td className="whitespace-nowrap text-slate-400 text-[10px]">{fmtDateTime(l.created_at)}</td><td><div className="font-bold">{l.name||'-'}</div><div className="text-[9px] text-slate-500">{l.email||''} {l.whatsapp?'· '+l.whatsapp:''}</div></td><td className="uppercase text-[9px] text-slate-400">{l.channel}</td><td>{l.campaign||'-'}</td><td><span className={'badge-'+(l.status==='terkirim'?'emerald':l.status==='gagal'?'rose':'amber')+' px-2 py-0.5 rounded-full text-[9px]'}>{l.status}</span></td><td className="text-[10px] text-slate-400 max-w-[260px]">{l.note||'-'}</td></tr>)}{!broadcastLogs.length&&<tr><td colSpan="6" className="text-center py-8 text-slate-500">Belum ada aktivitas pengiriman.</td></tr>}</tbody></table></div></div>}
</div>}

{adminTab==='products'&&<div className="space-y-3">{products.length?products.map((p,i)=><div key={p.id} draggable onDragStart={()=>{dragRef.current=i;setDragIdx(i)}} onDragOver={e=>e.preventDefault()} onDrop={()=>{if(dragRef.current!==null&&dragRef.current!==i)reorder('products',dragRef.current,i);dragRef.current=null;setDragIdx(null)}} className={'glass p-4 rounded-2xl flex items-center justify-between gap-3 '+(dragIdx===i?'opacity-50':'')}><div className="flex items-center gap-3 min-w-0"><i className="fa-solid fa-grip-vertical text-slate-600 cursor-grab"/><img src={p.coverUrl||coverArt(p.title,'📦')} className="w-14 h-14 rounded-xl object-cover" alt=""/><div className="min-w-0"><div className="font-bold truncate">{p.title}</div><div className="text-emerald-300 text-xs">{formatIDR(p.price)} · {p.category} · {p.salesCount||0} terjual</div></div></div><div className="flex gap-2 shrink-0"><button onClick={()=>setEditProduct({...p})} className="btn-ghost px-3 py-2 rounded-xl text-xs font-bold">Edit</button><button onClick={()=>handleDeleteProduct(p.id)} className="btn-danger px-3 py-2 rounded-xl text-xs font-bold">Hapus</button></div></div>):<Empty icon="fa-box-open" title="Belum ada produk" sub="Tambahkan produk pertama Anda."><button onClick={()=>setEditProduct({title:'',category:'E-Book',price:'',description:'',details:'',coverUrl:''})} className="btn-premium px-5 py-3 rounded-xl text-xs font-bold">Tambah Produk</button></Empty>}</div>}

{adminTab==='blog'&&<div className="space-y-3">{blogPosts.length?blogPosts.map(p=><div key={p.id} className="glass p-4 rounded-2xl flex items-center justify-between gap-3"><div className="flex items-center gap-3 min-w-0"><img src={p.cover_url||coverArt(p.title,'📝')} className="w-14 h-14 rounded-xl object-cover" alt=""/><div className="min-w-0"><div className="font-bold truncate">{p.title}</div><div className="text-cyan-300 text-xs">{(p.labels||[]).join(', ')||'-'} · {fmtDate(p.published_at)}</div></div></div><div className="flex gap-2 shrink-0"><button onClick={()=>setEditBlogPost({...p,labels:(p.labels||[]).join(', ')})} className="btn-ghost px-3 py-2 rounded-xl text-xs font-bold">Edit</button><button onClick={()=>handleDeleteBlogPost(p.id)} className="btn-danger px-3 py-2 rounded-xl text-xs font-bold">Hapus</button></div></div>):<Empty icon="fa-newspaper" title="Belum ada artikel" sub="Tulis artikel pertama Anda."><button onClick={()=>setEditBlogPost({title:'',slug:'',content_html:'',excerpt:'',cover_url:'',labels:[],status:'published'})} className="btn-premium px-5 py-3 rounded-xl text-xs font-bold">Tulis Artikel</button></Empty>}</div>}

{adminTab==='links'&&<div className="space-y-3"><button onClick={()=>setEditLink({title:'',url:''})} className="btn-premium px-4 py-2.5 rounded-xl text-xs font-bold"><i className="fa-solid fa-plus mr-1"/>Tambah Link</button>{links.length?links.map((l,i)=><div key={l.id} draggable onDragStart={()=>{dragRef.current=i;setDragIdx(i)}} onDragOver={e=>e.preventDefault()} onDrop={()=>{if(dragRef.current!==null&&dragRef.current!==i)reorder('links',dragRef.current,i);dragRef.current=null;setDragIdx(null)}} className="glass p-4 rounded-2xl flex items-center justify-between gap-3"><div className="flex items-center gap-3 min-w-0"><i className="fa-solid fa-grip-vertical text-slate-600 cursor-grab"/><div className="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-cyan-300"><i className={l.icon||'fa-solid fa-link'}/></div><div className="min-w-0"><div className="font-bold truncate">{l.title}</div><div className="text-slate-400 text-[10px] truncate">{l.url}</div></div></div><div className="flex gap-2 shrink-0"><button onClick={()=>setEditLink({...l})} className="btn-ghost px-3 py-2 rounded-xl text-xs font-bold">Edit</button><button onClick={()=>handleDeleteLink(l.id)} className="btn-danger px-3 py-2 rounded-xl text-xs font-bold">Hapus</button></div></div>):<p className="text-center py-6 text-slate-500 text-xs">Belum ada link cepat.</p>}</div>}

{adminTab==='gsheets'&&<div className="space-y-5"><div className="glass p-6 rounded-2xl space-y-4"><div className="flex items-center gap-3"><div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-green-600 flex items-center justify-center shadow-lg"><i className="fa-solid fa-file-excel text-white text-xl"/></div><div><h3 className="font-display font-extrabold text-lg">Integrasi Google Sheets</h3><p className="text-[11px] text-slate-400">Database cadangan & jembatan broadcast WA Web (konfigurasi lama tetap dipakai).</p></div></div><Field label="Google Apps Script Web App URL"><input value={gsConfig.webAppUrl} onChange={e=>setGsConfig({...gsConfig,webAppUrl:e.target.value})} placeholder="https://script.google.com/macros/s/AKfycb.../exec" className="input-premium font-mono text-[11px]"/></Field><div className="grid grid-cols-2 gap-3"><div className="glass-dark rounded-xl p-3"><div className="text-[10px] uppercase text-slate-400 font-bold mb-2">Auto Sync Lead Baru</div><Toggle checked={gsConfig.autoSync||gsConfig.enabled} onChange={v=>setGsConfig({...gsConfig,autoSync:v,enabled:v})}/><div className="text-[9px] text-slate-500 mt-2">Kirim setiap lead baru ke Sheets</div></div><div className="glass-dark rounded-xl p-3"><div className="text-[10px] uppercase text-slate-400 font-bold mb-2">Delay WA Web (detik)</div><input type="number" min="3" max="30" value={gsConfig.broadcastDelay||5} onChange={e=>setGsConfig({...gsConfig,broadcastDelay:Number(e.target.value)||5})} className="input-premium"/></div></div><div className="flex flex-wrap gap-2"><button onClick={()=>{LS.set(KEY_GS,gsConfig);showToast('✅ Konfigurasi Sheets tersimpan.')}} className="btn-premium px-4 py-2.5 rounded-xl text-xs font-bold"><i className="fa-solid fa-floppy-disk mr-1"/>Simpan Config</button><button onClick={()=>syncToGoogleSheets('sync_all',{leads:subsRef.current})} disabled={gsStatus.syncing} className="btn-success px-4 py-2.5 rounded-xl text-xs font-bold"><i className={'fa-solid '+(gsStatus.syncing?'fa-spinner fa-spin':'fa-cloud-arrow-up')+' mr-1'}/>{gsStatus.syncing?'Syncing...':'Sync Semua Leads'}</button><button onClick={importFromGoogleSheets} className="btn-ghost px-4 py-2.5 rounded-xl text-xs font-bold"><i className="fa-solid fa-cloud-arrow-down mr-1"/>Import dari Sheets</button><button onClick={broadcastViaWAWeb} disabled={gsBroadcastRunning||!gsConfig.webAppUrl} className="px-4 py-2.5 rounded-xl text-xs font-bold text-white border-none" style={{background:'linear-gradient(135deg,#25D366,#128C7E)'}}><i className="fa-brands fa-whatsapp mr-1"/>{gsBroadcastRunning?'Membuka...':'Broadcast via WA Web'}</button></div>{gsStatus.lastSync&&<div className="glass-dark rounded-xl p-3 text-[11px] text-emerald-300"><i className="fa-solid fa-circle-check mr-1"/>Terakhir sync: {fmtDateTime(gsStatus.lastSync)} · {subscribers.length} leads</div>}{gsStatus.error&&<div className="glass-dark rounded-xl p-3 text-[11px] text-rose-300"><i className="fa-solid fa-circle-exclamation mr-1"/>Error: {gsStatus.error}</div>}</div><div className="glass p-6 rounded-2xl space-y-3"><div className="flex items-center justify-between"><h4 className="font-display font-extrabold text-sm"><i className="fa-solid fa-code text-amber-400 mr-2"/>Kode Apps Script (salin & deploy)</h4><button onClick={()=>copyText(GAS_CODE,'Kode Apps Script')} className="btn-ghost px-3 py-2 rounded-xl text-xs font-bold"><i className="fa-solid fa-copy mr-1"/>Salin Kode</button></div><pre className="sql-box">{GAS_CODE}</pre><ol className="text-[11px] text-slate-300 space-y-1.5 leading-relaxed"><li><b className="text-cyan-300">1.</b> Buat spreadsheet → Extensions → Apps Script → tempel kode di atas.</li><li><b className="text-cyan-300">2.</b> Deploy → New deployment → Web app → Execute as: <b>Me</b>, Access: <b>Anyone</b>.</li><li><b className="text-cyan-300">3.</b> Salin URL deployment ke kolom di atas → Simpan → Sync.</li></ol></div></div>}

{adminTab==='profile'&&<form onSubmit={handleSaveCreator} className="glass p-6 rounded-2xl space-y-4 max-w-2xl"><h3 className="font-display font-extrabold text-sm">Informasi Profil & Bonus</h3><div className="grid grid-cols-2 gap-3"><Field label="Nama Toko"><input value={creator.name} onChange={e=>setCreator({...creator,name:e.target.value})} className="input-premium" required/></Field><Field label="Username (@)"><input value={creator.username} onChange={e=>setCreator({...creator,username:e.target.value})} className="input-premium" required/></Field></div><Field label="Bio"><textarea rows="2" value={creator.bio} onChange={e=>setCreator({...creator,bio:e.target.value})} className="input-premium"/></Field><Field label="Nomor WhatsApp"><input value={creator.whatsapp} onChange={e=>setCreator({...creator,whatsapp:e.target.value})} className="input-premium" required/></Field><div className="grid grid-cols-3 gap-3"><Field label="Instagram URL"><input value={creator.instagram||''} onChange={e=>setCreator({...creator,instagram:e.target.value})} className="input-premium"/></Field><Field label="TikTok URL"><input value={creator.tiktok||''} onChange={e=>setCreator({...creator,tiktok:e.target.value})} className="input-premium"/></Field><Field label="YouTube URL"><input value={creator.youtube||''} onChange={e=>setCreator({...creator,youtube:e.target.value})} className="input-premium"/></Field></div><Field label="Judul Bonus"><input value={creator.bonusTitle||''} onChange={e=>setCreator({...creator,bonusTitle:e.target.value})} className="input-premium"/></Field><Field label="Deskripsi Bonus"><textarea rows="2" value={creator.bonusDescription||''} onChange={e=>setCreator({...creator,bonusDescription:e.target.value})} className="input-premium"/></Field><Field label="Link Bonus"><input value={creator.bonusUrl||''} onChange={e=>setCreator({...creator,bonusUrl:e.target.value})} className="input-premium"/></Field><button type="submit" className="w-full btn-premium py-3 rounded-xl text-xs font-bold">Simpan Profil</button></form>}

{adminTab==='setup'&&<div className="glass p-6 rounded-2xl space-y-4"><h3 className="font-display font-extrabold text-sm"><i className="fa-solid fa-database text-cyan-400 mr-2"/>Setup Database Supabase (Skema Lama, Keamanan Baru)</h3><p className="text-xs text-slate-400">Tabel & kolom tetap sama: <span className="font-mono text-cyan-300">creator, products, links, blog_posts, subscribers, broadcast_logs, app_settings</span>. SQL ini hanya memperbaiki hak akses agar data leads tidak bisa dibaca publik.</p><div className="grid sm:grid-cols-3 gap-2"><button onClick={copySetupSql} className="btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-copy mr-1"/>1. Salin SQL</button><button onClick={()=>window.open(SQL_EDITOR_URL,'_blank')} className="btn-ghost py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-arrow-up-right-from-square mr-1"/>2. Buka SQL Editor</button><button onClick={checkTables} disabled={checkingTables} className="btn-success py-3 rounded-xl text-xs font-bold"><i className={'fa-solid '+(checkingTables?'fa-spinner fa-spin':'fa-circle-check')+' mr-1'}/>3. Verifikasi</button></div>{tableStatus&&<div className="glass-dark rounded-2xl p-4 space-y-2">{Object.keys(tableStatus).map(n=><div key={n} className="flex items-center justify-between text-xs"><span className="font-mono">{n}</span><span className={tableStatus[n]?'text-emerald-300 font-bold':'text-rose-300 font-bold'}>{tableStatus[n]?'✅ SUDAH ADA':'❌ BELUM ADA'}</span></div>)}</div>}<button onClick={()=>setShowSql(!showSql)} className="btn-ghost py-2.5 rounded-xl text-xs font-bold w-full">{showSql?'Tutup SQL':'Lihat isi SQL'}</button>{showSql&&<pre className="sql-box">{SQL_SETUP}</pre>}</div>}
</section>}
</main>

<footer className="border-t border-white/5 py-7"><div className="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4"><div className="text-xs text-slate-500">© {new Date().getFullYear()} {creator.name}. Powered by ShareToShare Mega Professional.</div><div className="flex items-center gap-3">{creator.instagram&&<a href={creator.instagram} target="_blank" rel="noreferrer" className="btn-ghost w-9 h-9 rounded-xl"><i className="fa-brands fa-instagram"/></a>}{creator.tiktok&&<a href={creator.tiktok} target="_blank" rel="noreferrer" className="btn-ghost w-9 h-9 rounded-xl"><i className="fa-brands fa-tiktok"/></a>}{creator.youtube&&<a href={creator.youtube} target="_blank" rel="noreferrer" className="btn-ghost w-9 h-9 rounded-xl"><i className="fa-brands fa-youtube"/></a>}{creator.whatsapp&&<a href={'https://wa.me/'+formatWANumber(creator.whatsapp)} target="_blank" rel="noreferrer" className="btn-ghost w-9 h-9 rounded-xl text-emerald-300"><i className="fa-brands fa-whatsapp"/></a>}</div></div></footer>

oduct,pl)} className="btn-ghost rounded-xl py-2.5 text-xs font-bold"><i className={`fa-brands ${ic} ${cl} mr-1`}/>{lb}</button>)}</div><button onClick={()=>buyProduct(selectedProduct)} className="w-full btn-premium py-3.5 rounded-xl text-sm font-bold"><i className="fa-brands fa-whatsapp mr-2"/>Beli via WhatsApp</button></div></div></div>}

{shareOpen&&<Modal title="Bagikan & Buka Bonus" sub="Share To Share" onClose={()=>setShareOpen(false)} w="max-w-lg"><p className="text-xs text-slate-300 leading-relaxed mb-4">Salin link unik kamu atau bagikan ke sosial media. Setelah membagikan, klik konfirmasi dan bonus terbuka.</p><div className="glass-soft rounded-2xl p-4 mb-4"><div className="text-[9px] uppercase tracking-widest text-slate-400 mb-2">Link Unik Kamu</div><div className="flex items-center gap-2"><input readOnly value={shareLink} className="flex-1 bg-transparent text-xs text-cyan-200 outline-none truncate"/><button onClick={()=>openShare('copy-link')} className="btn-ghost px-3 py-2 rounded-xl text-[10px] font-bold">Salin</button></div></div><div className="grid grid-cols-2 gap-2 mb-4">{[['wa','fa-whatsapp','WhatsApp','text-emerald-400'],['telegram','fa-telegram','Telegram','text-sky-400'],['facebook','fa-facebook','Facebook','text-blue-400'],['x','fa-x-twitter','X / Twitter','']].map(([p,i,l,c])=><button key={p} onClick={()=>openShare(p)} className="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold"><i className={`fa-brands ${i} mr-2 ${c}`}/>{l}</button>)}<button onClick={()=>openShare('copy-caption')} className="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold col-span-2"><i className="fa-solid fa-copy text-indigo-300 mr-2"/>Salin Caption Viral</button></div>{bonusUnlocked?<a href={creator.bonusUrl||'#'} target="_blank" rel="noopener noreferrer" className="block w-full text-center btn-premium rounded-2xl px-5 py-4 text-sm font-black"><i className="fa-solid fa-gift mr-2"/>Bonus Terbuka — Akses Sekarang</a>:shareClicked?<button onClick={confirmShare} className="w-full btn-premium rounded-2xl px-5 py-4 text-sm font-black"><i className="fa-solid fa-circle-check mr-2"/>Saya Sudah Membagikan — Buka Bonus</button>:<p className="text-center text-[10px] text-slate-500">Pilih salah satu platform di atas untuk mulai membagikan.</p>}</Modal>}

{leadOpen&&<div className="modal-overlay" onClick={()=>setLeadOpen(false)}><form onSubmit={submitLead} onClick={e=>e.stopPropagation()} className="glass modal-card max-w-md p-6 md:p-8 space-y-4"><div className="flex items-start justify-between gap-4"><div><div className="text-[10px] uppercase tracking-[.22em] text-emerald-300 font-black">Lead Magnet</div><h3 className="font-display text-2xl font-extrabold mt-1">Dapatkan Update & Bonus</h3></div><button type="button" onClick={()=>setLeadOpen(false)} className="btn-ghost w-10 h-10 rounded-xl"><i className="fa-solid fa-xmark"/></button></div><p className="text-xs text-slate-300 leading-relaxed">{settings.leadDescription}</p><input value={leadForm.name} onChange={e=>setLeadForm({...leadForm,name:e.target.value})} placeholder="Nama lengkap" className="input-premium"/><input type="email" value={leadForm.email} onChange={e=>setLeadForm({...leadForm,email:e.target.value})} placeholder="Email aktif" className="input-premium"/><input value={leadForm.whatsapp} onChange={e=>setLeadForm({...leadForm,whatsapp:e.target.value})} placeholder="Nomor WhatsApp (08xx)" className="input-premium"/><button type="submit" disabled={leadBusy} className="w-full btn-premium rounded-2xl px-5 py-4 text-sm font-black">{leadBusy?<><i className="fa-solid fa-spinner fa-spin mr-2"/>Menyimpan...</>:<><i className="fa-solid fa-paper-plane mr-2"/>Daftar & Ambil Bonus</>}</button><p className="text-[9px] text-slate-500 leading-relaxed">Dengan mendaftar, kamu menyetujui menerima informasi produk, promo, dan penawaran melalui email & WhatsApp.</p></form></div>}

{showLeadPopup&&!leadOptedIn&&<div className="modal-overlay" onClick={()=>setShowLeadPopup(false)}><div className="glass modal-card max-w-md" onClick={e=>e.stopPropagation()}><div className="relative"><div className="lead-magnet-art h-36"><div className="lm-grid"/><div className="absolute inset-0 flex items-center justify-center"><i className="fa-solid fa-gift text-5xl text-white/85"/></div><i className="fa-solid fa-envelope lm-icon text-cyan-300" style={{top:'18%',left:'14%'}}/><i className="fa-brands fa-whatsapp lm-icon text-emerald-300" style={{top:'24%',right:'14%'}}/><i className="fa-solid fa-bolt lm-icon text-indigo-300" style={{bottom:'18%',right:'20%'}}/></div><button onClick={()=>setShowLeadPopup(false)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-950/70 text-slate-300 hover:text-white"><i className="fa-solid fa-xmark"/></button></div><div className="p-6 space-y-4"><div><h3 className="font-display text-xl font-extrabold">{settings.leadTitle}</h3><p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{settings.leadDescription}</p></div><LeadFormInline onSuccess={d=>handleLeadSubmit(d,'popup')} submitLabel="Ambil Bonus & Kirim ke Email/WA Saya"/></div></div></div>}

{leadGateOpen&&!leadOptedIn&&<div className="modal-overlay" onClick={()=>{setLeadGateOpen(false);setGateTarget(null)}}><div className="glass modal-card max-w-md" onClick={e=>e.stopPropagation()}><div className="relative"><div className="lead-magnet-art h-32"><div className="lm-grid"/><div className="absolute inset-0 flex items-center justify-center"><i className="fa-solid fa-lock text-4xl text-white/85"/></div></div><button onClick={()=>{setLeadGateOpen(false);setGateTarget(null)}} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-950/70 text-slate-300 hover:text-white"><i className="fa-solid fa-xmark"/></button></div><div className="p-6 space-y-4"><div><h3 className="font-display text-lg font-extrabold">{settings.gateTitle}</h3><p className="text-[11px] text-slate-400 mt-1.5 leading-relaxed">{settings.gateDescription}</p></div>{gateTarget&&<div className="glass-dark rounded-2xl p-3"><div className="text-[9px] uppercase tracking-widest text-slate-500 font-bold mb-1">{gateTarget.type==='blog'?'Artikel yang akan dibuka':'Produk yang akan dibuka'}</div><div className="text-xs font-extrabold line-clamp-2">{gateTarget.item?.title}</div></div>}<div className="grid grid-cols-2 gap-2"><button onClick={()=>{setGateMode('register');setGateError('')}} className={'tab-btn '+(gateMode==='register'?'bg-gradient-to-r from-emerald-500 to-cyan-500 text-white':'glass-soft text-slate-300')}>Daftar Baru</button><button onClick={()=>{setGateMode('verify');setGateError('')}} className={'tab-btn '+(gateMode==='verify'?'bg-gradient-to-r from-indigo-500 to-fuchsia-500 text-white':'glass-soft text-slate-300')}>Sudah Daftar</button></div>{gateMode==='register'?<LeadFormInline onSuccess={async d=>{await handleLeadSubmit(d,gateTarget?.type==='blog'?'gate-blog':'gate-produk');setLeadGateOpen(false)}} submitLabel={settings.gateButtonText||'Buka Akses Gratis'}/>:<form onSubmit={verifyLeadAccess} className="space-y-2"><input value={gateVerify.contact} onChange={e=>setGateVerify({contact:e.target.value})} placeholder="Email atau nomor WhatsApp terdaftar" className="input-premium"/>{gateError&&<div className="text-[10px] text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-lg px-2.5 py-2"><i className="fa-solid fa-circle-exclamation mr-1"/>{gateError}</div>}<button className="w-full btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-key mr-2"/>Cek & Buka Akses</button></form>}</div></div></div>}

{importOpen&&<Modal title="Import Data dari Excel / CSV" sub={`${importFileName} · ${importRows.length} baris`} onClose={()=>{setImportOpen(false);setImportError('')}} w="max-w-3xl">{importError&&<div className="rounded-xl border border-rose-500/25 bg-rose-500/10 p-3 text-[11px] text-rose-200 mb-3"><i className="fa-solid fa-circle-exclamation mr-1"/>{importError}</div>}{importColumns.length>0&&<><div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">{['name','email','whatsapp','tags','source'].map(f=><Field key={f} label={f}><select value={importMap[f]} onChange={e=>setImportMap({...importMap,[f]:e.target.value})} className="input-premium text-xs"><option value="">— kosong —</option>{importColumns.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>)}</div><div className="table-wrap max-h-64 mb-4"><table className="admin-table"><thead><tr>{importColumns.map(c=><th key={c}>{c}</th>)}</tr></thead><tbody>{importPreview.map((r,i)=><tr key={i}>{importColumns.map(c=><td key={c}>{String(r[c]??'')}</td>)}</tr>)}</tbody></table></div><div className="flex gap-2"><button disabled={importBusy} onClick={confirmImport} className="flex-1 btn-premium py-3 rounded-xl text-xs font-bold"><i className={'fa-solid '+(importBusy?'fa-spinner fa-spin':'fa-file-import')+' mr-2'}/>{importBusy?'Mengimpor...':`Import ${importRows.length} Data`}</button><button onClick={()=>setImportOpen(false)} className="btn-ghost px-5 py-3 rounded-xl text-xs font-bold">Batal</button></div></>}</Modal>}

{leadDrawer&&<><div className="fixed inset-0 z-[84] bg-black/50" onClick={()=>setLeadDrawer(null)}/><div className="drawer"><div className="p-6 space-y-5"><div className="flex items-start justify-between"><div className="flex items-center gap-3"><div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center font-extrabold text-white">{(leadDrawer.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('')}</div><div><h3 className="font-display font-extrabold">{leadDrawer.name}</h3><span className={'badge-'+(leadDrawer.status==='nonaktif'?'rose':'emerald')+' px-2 py-0.5 rounded-full text-[9px]'}>{leadDrawer.status||'aktif'}</span></div></div><button onClick={()=>setLeadDrawer(null)} className="btn-ghost w-9 h-9 rounded-xl"><i className="fa-solid fa-xmark"/></button></div><div className="space-y-2 text-xs"><div className="glass-soft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-envelope text-cyan-300 w-4"/><span className="flex-1 truncate">{leadDrawer.email||leadDrawer.raw_email||'-'}</span><button onClick={()=>copyText(leadDrawer.email||leadDrawer.raw_email||'','Email')} className="text-slate-400 hover:text-white"><i className="fa-solid fa-copy"/></button></div><div className="glass-soft rounded-xl p-3 flex items-center gap-3"><i className="fa-brands fa-whatsapp text-emerald-300 w-4"/><span className="flex-1 font-mono">{leadDrawer.whatsapp||'-'}</span><button onClick={()=>copyText(leadDrawer.whatsapp||'','Nomor WA')} className="text-slate-400 hover:text-white"><i className="fa-solid fa-copy"/></button></div><div className="glass-soft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-tag text-indigo-300 w-4"/><span className="flex-1">{leadDrawer.tags||'-'}</span></div><div className="glass-soft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-arrow-right-to-bracket text-fuchsia-300 w-4"/><span className="flex-1">{leadDrawer.source||'manual'} · {fmtDateTime(leadDrawer.created_at)}</span></div></div><Field label="Catatan"><textarea rows="3" value={leadDrawer.notes||''} onChange={e=>{const v=e.target.value;setLeadDrawer({...leadDrawer,notes:v});updateSubscriber({...leadDrawer,notes:v})}} className="input-premium" placeholder="Tambah catatan…"/></Field><div className="glass-dark rounded-xl p-3 text-[11px]"><div className="text-slate-500 text-[9px] uppercase font-bold mb-1">Kampanye Terakhir</div>{leadDrawer.last_campaign?<span>{leadDrawer.last_campaign} · <b className={leadDrawer.last_status==='terkirim'?'text-emerald-300':'text-rose-300'}>{leadDrawer.last_status}</b> · {fmtDateTime(leadDrawer.last_sent_at)}</span>:<span className="text-slate-500">Belum pernah dikirim</span>}</div><div className="grid grid-cols-2 gap-2"><button onClick={()=>quickSendLead(leadDrawer)} className="btn-premium py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-paper-plane mr-1"/>Kirim Pesan</button><button onClick={()=>setEditLead({...leadDrawer})} className="btn-ghost py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-pen mr-1"/>Edit</button><button onClick={()=>{const s=leadDrawer.status==='nonaktif'?'aktif':'nonaktif';setLeadDrawer({...leadDrawer,status:s});updateSubscriber({...leadDrawer,status:s})}} className="btn-ghost py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-toggle-on mr-1"/>{leadDrawer.status==='nonaktif'?'Aktifkan':'Nonaktifkan'}</button><button onClick={()=>{deleteSubscriber(leadDrawer.id);setLeadDrawer(null)}} className="btn-danger py-3 rounded-xl text-xs font-bold"><i className="fa-solid fa-trash mr-1"/>Hapus</button></div></div></div></>}

{saveViewOpen&&<Modal title="Simpan Tampilan Filter" sub="Saved View" onClose={()=>setSaveViewOpen(false)}><div className="space-y-3"><Field label="Nama View"><input value={savedViewName} onChange={e=>setSavedViewName(e.target.value)} placeholder="Pelanggan aktif bulan ini" className="input-premium" autoFocus/></Field><div className="glass-dark rounded-xl p-3 text-[10px] text-slate-400">Filter saat ini: {leadsSearch||'tanpa pencarian'} · {leadsSource} · {leadsStatus} · {leadsTag||'semua tag'}</div><button onClick={saveCurrentView} className="w-full btn-premium py-3 rounded-xl text-xs font-bold">Simpan View</button></div></Modal>}

{editLead&&<Modal title={editLead.id?'Edit Kontak':'Tambah Kontak Manual'} sub="Database Leads" onClose={()=>setEditLead(null)}><form onSubmit={async e=>{e.preventDefault();if(editLead.id){await updateSubscriber(editLead);showToast('✅ Data diperbarui.')}else{const r=await saveSubscriber({...editLead,source:editLead.source||'manual'});if(r?.ok)showToast('✅ Kontak ditambahkan.')}setEditLead(null)}} className="space-y-3"><Field label="Nama"><input value={editLead.name||''} onChange={e=>setEditLead({...editLead,name:e.target.value})} className="input-premium"/></Field><Field label="Email"><input value={editLead.email||editLead.raw_email||''} onChange={e=>setEditLead({...editLead,email:e.target.value})} className="input-premium"/></Field><Field label="WhatsApp"><input value={editLead.whatsapp||''} onChange={e=>setEditLead({...editLead,whatsapp:e.target.value})} placeholder="08xx / 62xx" className="input-premium"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Sumber"><input value={editLead.source||''} onChange={e=>setEditLead({...editLead,source:e.target.value})} className="input-premium"/></Field><Field label="Status"><select value={editLead.status||'aktif'} onChange={e=>setEditLead({...editLead,status:e.target.value})} className="input-premium"><option value="aktif">aktif</option><option value="nonaktif">nonaktif</option></select></Field></div><Field label="Tag"><input value={editLead.tags||''} onChange={e=>setEditLead({...editLead,tags:e.target.value})} placeholder="pelanggan, reseller" className="input-premium"/></Field><Field label="Catatan"><textarea rows="2" value={editLead.notes||''} onChange={e=>setEditLead({...editLead,notes:e.target.value})} className="input-premium"/></Field><div className="flex gap-2 pt-2"><button type="button" onClick={()=>setEditLead(null)} className="flex-1 btn-ghost py-3 rounded-xl text-xs font-bold">Batal</button><button type="submit" className="flex-[2] btn-premium py-3 rounded-xl text-xs font-bold">Simpan Kontak</button></div></form></Modal>}

{editProduct&&<Modal title={editProduct.id?'Edit Produk':'Tambah Produk'} sub="Katalog" onClose={()=>setEditProduct(null)}><form onSubmit={handleSaveProduct} className="space-y-3"><Field label="Judul Produk"><input required value={editProduct.title} onChange={e=>setEditProduct({...editProduct,title:e.target.value})} className="input-premium"/></Field><div className="grid grid-cols-2 gap-2"><Field label="Kategori"><select value={editProduct.category} onChange={e=>setEditProduct({...editProduct,category:e.target.value})} className="input-premium">{['E-Book','Template','Kursus/Video','Preset & LUTs','Aset Desain','Software & Plugin','Audio & Musik','Photo Asset','Printable Kids','Template PPT','Template Notion','Video Asset','Membership'].map(c=><option key={c} value={c}>{c}</option>)}</select></Field><Field label="Harga (IDR)"><input type="number" required value={editProduct.price} onChange={e=>setEditProduct({...editProduct,price:parseFloat(e.target.value)||0})} className="input-premium"/></Field></div><Field label="URL Cover"><input value={editProduct.coverUrl||''} onChange={e=>setEditProduct({...editProduct,coverUrl:e.target.value})} className="input-premium"/></Field><Field label="Deskripsi"><textarea rows="2" value={editProduct.description||''} onChange={e=>setEditProduct({...editProduct,description:e.target.value})} className="input-premium"/></Field><Field label="Detail Isi"><textarea rows="4" value={editProduct.details||''} onChange={e=>setEditProduct({...editProduct,details:e.target.value})} className="input-premium"/></Field><div className="flex items-center gap-3 glass-dark rounded-xl p-3"><Toggle checked={settings.autoBroadcastProduct} onChange={v=>persistSettings({...settingsRef.current,autoBroadcastProduct:v})}/><span className="text-[10px] text-slate-300">Otomatis broadcast produk baru ke semua kontak aktif.</span></div><div className="flex gap-2 pt-2"><button type="button" onClick={()=>setEditProduct(null)} className="flex-1 btn-ghost py-3 rounded-xl text-xs font-bold">Batal</button><button type="submit" className="flex-[2] btn-premium py-3 rounded-xl text-xs font-bold">Simpan Produk</button></div></form></Modal>}

{editBlogPost&&<Modal title={editBlogPost.id?'Edit Artikel':'Tulis Artikel Baru'} sub="Blog" onClose={()=>setEditBlogPost(null)} w="max-w-2xl"><form onSubmit={handleSaveBlogPost} className="space-y-3"><Field label="Judul *"><input required value={editBlogPost.title||''} onChange={e=>setEditBlogPost({...editBlogPost,title:e.target.value})} className="input-premium"/></Field><div className="grid grid-cols-2 gap-2"><Field label="Slug"><input value={editBlogPost.slug||''} onChange={e=>setEditBlogPost({...editBlogPost,slug:e.target.value})} placeholder={slugify(editBlogPost.title)||'otomatis-dari-judul'} className="input-premium"/></Field><Field label="Label (koma)"><input value={Array.isArray(editBlogPost.labels)?editBlogPost.labels.join(', '):(editBlogPost.labels||'')} onChange={e=>setEditBlogPost({...editBlogPost,labels:e.target.value})} className="input-premium"/></Field></div><Field label="URL Cover"><input value={editBlogPost.cover_url||''} onChange={e=>setEditBlogPost({...editBlogPost,cover_url:e.target.value})} className="input-premium"/></Field><Field label="Ringkasan"><textarea rows="2" value={editBlogPost.excerpt||''} onChange={e=>setEditBlogPost({...editBlogPost,excerpt:e.target.value})} className="input-premium"/></Field><Field label="Isi Konten (HTML) *"><textarea rows="8" required value={editBlogPost.content_html||''} onChange={e=>setEditBlogPost({...editBlogPost,content_html:e.target.value})} className="input-premium font-mono text-[11px]"/></Field><div className="flex items-center gap-3 glass-dark rounded-xl p-3"><Toggle checked={settings.autoBroadcastArticle} onChange={v=>persistSettings({...settingsRef.current,autoBroadcastArticle:v})}/><span className="text-[10px] text-slate-300">Otomatis broadcast artikel ini setelah disimpan.</span></div><div className="flex gap-2 pt-2"><button type="button" onClick={()=>setEditBlogPost(null)} className="flex-1 btn-ghost py-3 rounded-xl text-xs font-bold">Batal</button><button type="submit" className="flex-[2] btn-premium py-3 rounded-xl text-xs font-bold">Terbitkan Artikel</button></div></form></Modal>}

{editLink&&<Modal title={editLink.id?'Edit Link':'Tambah Link'} sub="Link Cepat" onClose={()=>setEditLink(null)}><form onSubmit={handleSaveLink} className="space-y-3"><Field label="Judul"><input required value={editLink.title} onChange={e=>setEditLink({...editLink,title:e.target.value})} className="input-premium"/></Field><Field label="URL Tujuan"><input type="url" required value={editLink.url} onChange={e=>setEditLink({...editLink,url:e.target.value})} className="input-premium"/></Field><Field label="Ikon (Font Awesome)"><select value={editLink.icon||'fa-solid fa-link'} onChange={e=>setEditLink({...editLink,icon:e.target.value})} className="input-premium">{['fa-solid fa-link','fa-brands fa-whatsapp','fa-brands fa-instagram','fa-brands fa-telegram','fa-brands fa-tiktok','fa-brands fa-youtube','fa-solid fa-folder-open','fa-solid fa-cart-shopping','fa-solid fa-globe'].map(i=><option key={i} value={i}>{i}</option>)}</select></Field><div className="flex gap-2 pt-2"><button type="button" onClick={()=>setEditLink(null)} className="flex-1 btn-ghost py-3 rounded-xl text-xs font-bold">Batal</button><button type="submit" className="flex-[2] btn-premium py-3 rounded-xl text-xs font-bold">Simpan Link</button></div></form></Modal>}
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
