    function BlogCanvasModal({ article, profile, onClose, showToast }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Dimensions: 1080 x 1350 (4:5 ratio)
        canvas.width = 1080;
        canvas.height = 1350;

        // Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.5, '#020617');
        grad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);

        // Header Title Tag
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('BLOG & ARTIKEL PILIHAN', 80, 120);

        // Profile Watermark Top Right
        ctx.fillStyle = '#94a3b8';
        ctx.font = '28px sans-serif';
        ctx.fillText(profile.handle, 750, 120);

        // Article Title (Auto-wrap)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 54px sans-serif';
        
        const wrapText = (text, x, y, maxWidth, lineHeight) => {
          const words = text.split(' ');
          let line = '';
          let currentY = y;

          for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
              ctx.fillText(line, x, currentY);
              line = words[n] + ' ';
              currentY += lineHeight;
            } else {
              line = testLine;
            }
          }
          ctx.fillText(line, x, currentY);
          return currentY;
        };

        let lastY = wrapText(article.title, 80, 240, 920, 70);

        // Divider Line
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(80, lastY + 50);
        ctx.lineTo(1000, lastY + 50);
        ctx.stroke();

        // Excerpt
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '36px sans-serif';
        wrapText(article.excerpt, 80, lastY + 130, 920, 52);

        // Footer Card Call To Action
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(80, 1100, 920, 150, 24);
        ctx.fill();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('Baca Selengkapnya di Link Bio Instagram / WA', 120, 1180);
      }, [article, profile]);

      const handleDownload = () => {
        const canvas = canvasRef.current;
        const link = document.createElement('a');
        link.download = `blog-status-${article.slug}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Gambar berhasil diunduh!');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4 animate-fadeIn">
          <div className="glass-card w-full max-w-sm rounded-3xl p-4 text-center space-y-4 border border-cyan-500/30">
            <div className="flex items-center justify-between">
              <h3 className="text-xs font-bold text-white">Preview Gambar Status WA (4:5)</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>

            <canvas ref={canvasRef} className="w-full rounded-2xl border border-slate-800 shadow-xl"></canvas>

            <button 
              onClick={handleDownload}
              className="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold shadow-lg shadow-cyan-600/30 flex items-center justify-center space-x-2"
            >
              <i className="fa-solid fa-download"></i>
              <span>Download PNG Status WA</span>
            </button>
          </div>
        </div>
      );
    }

              <button 
                onClick={handleShareWA}
                className="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 text-xs font-bold flex items-center justify-center space-x-1.5"
              >
                <i className="fa-brands fa-whatsapp"></i>
                <span>Bagikan WA</span>
              </button>
              <button 
                onClick={handleCopyCaption}
                className="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold flex items-center justify-center space-x-1.5 col-span-2 md:col-span-1"
              >
                <i className="fa-regular fa-copy"></i>
                <span>Salin Caption</span>
              </button>
            </div>
          </div>

          {/* QUOTE LIST SELECTOR */}
          <div className="space-y-3">
            <h3 className="text-xs font-bold uppercase text-slate-400 tracking-wider">Koleksi Kutipan Motivasi</h3>

            <div className="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1">
              {categories.map(cat => (
                <button 
                  key={cat}
                  onClick={() => setSelectedCat(cat)}
                  className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${
                    selectedCat === cat 
                      ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' 
                      : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="space-y-2">
              {filteredQuotes.map(q => (
                <div 
                  key={q.id}
                  onClick={() => {
                    setActiveQuote(q);
                    setCustomQuoteText(q.text);
                  }}
                  className={`glass-card p-3.5 rounded-xl cursor-pointer transition-all ${
                    activeQuote.id === q.id ? 'ring-2 ring-emerald-500/80 bg-emerald-950/20' : 'hover:border-slate-700'
                  }`}
                >
                  <p className="text-xs text-white font-medium italic">“{q.text}”</p>
                  <div className="flex items-center justify-between text-[10px] text-slate-400 mt-2">
                    <span className="text-emerald-400 font-bold">— {q.author}</span>
                    <span className="bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700">{q.category}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboard({ profile, setProfile, bioLinks, setBioLinks, products, setProducts, blogPosts, setBlogPosts, quotes, setQuotes, affiliate, setAffiliate, transactions, setTransactions, comments, setComments, visitorCount, shareCount, showToast, formatIDR }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [adminTab, setAdminTab] = useState('overview'); // 'overview' | 'profile' | 'products' | 'links' | 'blog' | 'affiliate'

      // Profile Form
      const [editProfile, setEditProfile] = useState(profile);

      // XML Import State
      const [xmlFile, setXmlFile] = useState(null);

      // Handle Pin Auth (Default PIN: 123456)
      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '123456' || pinInput === 'admin') {
          setIsAuthenticated(true);
          showToast('Login Admin berhasil!');
        } else {
          showToast('PIN Admin salah. Coba: 123456');
        }
      };

      const totalRevenue = useMemo(() => {
        return transactions
          .filter(t => t.status === 'Selesai')
          .reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [transactions]);

      // Blogger XML Parser Logic
      const handleBloggerXmlUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const xmlText = event.target.result;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
            const entries = xmlDoc.getElementsByTagName('entry');

            const importedPosts = [];
            for (let i = 0; i < entries.length; i++) {
              const entry = entries[i];
              const titleNode = entry.getElementsByTagName('title')[0];
              const contentNode = entry.getElementsByTagName('content')[0];
              const publishedNode = entry.getElementsByTagName('published')[0];

              const title = titleNode ? titleNode.textContent : 'Tanpa Judul';
              const content = contentNode ? contentNode.textContent : '';
              const dateStr = publishedNode ? new Date(publishedNode.textContent).toLocaleDateString('id-ID') : 'Hari ini';

              // Ignore templates or pages, keep post entry
              if (title && content && !title.includes('Settings')) {
                importedPosts.push({
                  id: 'xml-' + Date.now() + '-' + i,
                  slug: title.toLowerCase().replace(/[^a-z0-9]/g, '-').slice(0, 30),
                  title: title,
                  category: 'Blogger Import',
                  author: profile.name,
                  date: dateStr,
                  readTime: '3 mnt',
                  image: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=600&q=80',
                  excerpt: content.replace(/<[^>]+>/g, '').slice(0, 120) + '...',
                  content: content
                });
              }
            }

            if (importedPosts.length > 0) {
              setBlogPosts(prev => [...importedPosts, ...prev]);
              showToast(`Berhasil mengimpor ${importedPosts.length} artikel dari XML Blogger!`);
            } else {
              showToast('Tidak ada artikel valid ditemukan dalam file XML.');
            }
          } catch (err) {
            showToast('Gagal memproses file XML Blogger.');
          }
        };
        reader.readAsText(file);
      };

      if (!isAuthenticated) {
        return (
          <div className="glass-card p-6 rounded-3xl text-center max-w-sm mx-auto my-10 space-y-4 border border-amber-500/30">
            <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-xl">
              <i className="fa-solid fa-lock"></i>
            </div>
            <h2 className="text-base font-extrabold text-white">Login Admin Dashboard</h2>
            <p className="text-xs text-slate-400">Masukkan PIN Admin untuk mengelola produk & konten (PIN Bawaan: <code className="text-amber-400 font-mono">123456</code>)</p>

            <form onSubmit={handleLogin} className="space-y-3">
              <input 
                type="password" 
                placeholder="PIN Admin (123456)"
                value={pinInput}
                onChange={e => setPinInput(e.target.value)}
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-center text-sm font-mono tracking-widest text-white focus:outline-none focus:border-amber-500"
              />
              <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs shadow-lg shadow-amber-500/20">
                Masuk ke Admin
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-5 animate-fadeIn">
          {/* ADMIN HEADER */}
          <div className="flex items-center justify-between glass-card p-4 rounded-2xl border border-amber-500/30">
            <div>
              <h2 className="text-sm font-extrabold text-white flex items-center space-x-2">
                <i className="fa-solid fa-user-shield text-amber-400"></i>
                <span>Admin Management Pro</span>
              </h2>
              <p className="text-[10px] text-slate-400">Supabase & LocalStorage Sync Active</p>
            </div>
            <button onClick={() => setIsAuthenticated(false)} className="py-1 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px]">
              Logout
            </button>
          </div>

          {/* ADMIN TAB NAVIGATION */}
          <div className="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1">
            {[
              { id: 'overview', label: 'Overview', icon: 'fa-chart-pie' },
              { id: 'profile', label: 'Profil & Rekening', icon: 'fa-id-card' },
              { id: 'products', label: 'Produk Digital', icon: 'fa-box' },
              { id: 'links', label: 'Link in Bio', icon: 'fa-link' },
              { id: 'blog', label: 'Blog & XML Blogger', icon: 'fa-newspaper' },
              { id: 'affiliate', label: 'Affiliate Links', icon: 'fa-tags' }
            ].map(tab => (
              <button 
                key={tab.id}
                onClick={() => setAdminTab(tab.id)}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center space-x-1.5 transition-colors ${
                  adminTab === tab.id ? 'bg-amber-500 text-slate-950 font-extrabold shadow-md shadow-amber-500/20' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'
                }`}
              >
                <i className={`fa-solid ${tab.icon}`}></i>
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* TAB 1: OVERVIEW STATS & TRANSACTIONS */}
          {adminTab === 'overview' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-emerald-400">
                  <span className="text-[10px] text-slate-400 uppercase font-bold block">Total Omzet</span>
                  <span className="text-sm font-extrabold text-emerald-400">{formatIDR(totalRevenue)}</span>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-indigo-400">
                  <span className="text-[10px] text-slate-400 uppercase font-bold block">Total Transaksi</span>
                  <span className="text-sm font-extrabold text-indigo-300">{transactions.length} Pesanan</span>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-cyan-400">
                  <span className="text-[10px] text-slate-400 uppercase font-bold block">Pengunjung</span>
                  <span className="text-sm font-extrabold text-cyan-300">{visitorCount} Hits</span>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-amber-400">
                  <span className="text-[10px] text-slate-400 uppercase font-bold block">Pembagian Share</span>
                  <span className="text-sm font-extrabold text-amber-300">{shareCount} Kali</span>
                </div>
              </div>

              {/* TRANSACTIONS TABLE */}
              <div className="glass-card p-4 rounded-2xl space-y-3">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider">Daftar Transaksi Terbaru</h3>
                {transactions.length === 0 ? (
                  <p className="text-xs text-slate-500 italic text-center py-4">Belum ada transaksi tercatat.</p>
                ) : (
                  <div className="space-y-2">
                    {transactions.map(tx => (
                      <div key={tx.id} className="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-white">{tx.buyerName}</span>
                            <span className="text-[10px] text-slate-400">({tx.paymentMethod})</span>
                          </div>
                          <p className="text-[11px] text-slate-400">{tx.productTitle}</p>
                          <span className="text-emerald-400 font-bold text-[11px]">{formatIDR(tx.amount)}</span>
                        </div>

                        <div className="text-right space-y-1">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold block ${
                            tx.status === 'Selesai' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'
                          }`}>
                            {tx.status}
                          </span>
                          {tx.status !== 'Selesai' && (
                            <button 
                              onClick={() => {
                                setTransactions(prev => prev.map(t => t.id === tx.id ? { ...t, status: 'Selesai' } : t));
                                showToast('Transaksi berhasil dikonfirmasi Selesai!');
                              }}
                              className="py-1 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold"
                            >
                              Konfirmasi
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: PROFILE & PAYMENT REKENING EDIT */}
          {adminTab === 'profile' && (
            <div className="glass-card p-5 rounded-2xl space-y-3">
              <h3 className="text-xs font-bold text-white uppercase tracking-wider">Edit Profil Creator & Rekening</h3>

              <div className="space-y-2.5 text-xs">
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Nama Tampilan</label>
                  <input type="text" value={editProfile.name} onChange={e => setEditProfile({...editProfile, name: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Bio Ringkas</label>
                  <textarea rows="2" value={editProfile.bio} onChange={e => setEditProfile({...editProfile, bio: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white"></textarea>
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Nomor WhatsApp Admin (Format 62...)</label>
                  <input type="text" value={editProfile.waNumber} onChange={e => setEditProfile({...editProfile, waNumber: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Rekening Bank BRI</label>
                  <input type="text" value={editProfile.briAccount} onChange={e => setEditProfile({...editProfile, briAccount: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Nomor DANA</label>
                  <input type="text" value={editProfile.danaAccount} onChange={e => setEditProfile({...editProfile, danaAccount: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">URL Foto QRIS</label>
                  <input type="text" value={editProfile.qrisUrl} onChange={e => setEditProfile({...editProfile, qrisUrl: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>

                <button 
                  onClick={() => {
                    setProfile(editProfile);
                    showToast('Profil & rekening berhasil diperbarui!');
                  }}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold shadow-lg"
                >
                  Simpan Perubahan
                </button>
              </div>
            </div>
          )}

          {/* TAB 3: PRODUCTS CRUD */}
          {adminTab === 'products' && (
            <div className="space-y-4">
              <div className="glass-card p-4 rounded-2xl space-y-3">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider">Tambah / Kelola Produk Digital</h3>
                <button 
                  onClick={() => {
                    const newProd = {
                      id: 'p-' + Date.now(),
                      title: 'Produk Digital Baru 2026',
                      category: 'E-Book',
                      price: 50000,
                      originalPrice: 150000,
                      rating: 5.0,
                      soldCount: 0,
                      image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
                      description: 'Deskripsi lengkap produk digital baru.',
                      features: ['Akses File Instan', 'Panduan Pemakaian']
                    };
                    setProducts(prev => [newProd, ...prev]);
                    showToast('Produk sampel baru berhasil ditambahkan!');
                  }}
                  className="py-2 px-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center space-x-1.5"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Tambah Produk Baru</span>
                </button>
              </div>

              <div className="space-y-2">
                {products.map(p => (
                  <div key={p.id} className="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                    <div>
                      <h4 className="font-bold text-white">{p.title}</h4>
                      <p className="text-[11px] text-emerald-400 font-bold">{formatIDR(p.price)}</p>
                    </div>
                    <button 
                      onClick={() => {
                        setProducts(prev => prev.filter(item => item.id !== p.id));
                        showToast('Produk dihapus.');
                      }}
                      className="p-2 text-red-400 hover:text-red-300"
                    >
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 4: BLOG & BLOGGER XML IMPORT */}
          {adminTab === 'blog' && (
            <div className="space-y-4">
              {/* XML BLOGGER IMPORT BOX */}
              <div className="glass-card p-4 rounded-2xl space-y-3 border border-cyan-500/30">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center space-x-2">
                  <i className="fa-solid fa-file-code text-cyan-400"></i>
                  <span>Impor Backup XML Blogger (Blogspot)</span>
                </h3>
                <p className="text-xs text-slate-400">Unggah file backup `.xml` dari Blogspot untuk mengimpor seluruh postingan otomatis ke sistem.</p>
                
                <input 
                  type="file" 
                  accept=".xml" 
                  onChange={handleBloggerXmlUpload}
                  className="text-xs text-slate-300 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-cyan-600 file:text-white file:font-bold hover:file:bg-cyan-500"
                />
              </div>

              {/* COMMENTS MODERATION */}
              <div className="glass-card p-4 rounded-2xl space-y-3">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider">Moderasi Komentar Masuk</h3>
                {comments.filter(c => c.status === 'pending').length === 0 ? (
                  <p className="text-xs text-slate-500 italic">Tidak ada komentar baru menunggu moderasi.</p>
                ) : (
                  <div className="space-y-2">
                    {comments.filter(c => c.status === 'pending').map(c => (
                      <div key={c.id} className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2 text-xs">
                        <div>
                          <span className="font-bold text-white">{c.name}</span>
                          <p className="text-slate-300">{c.text}</p>
                        </div>
                        <div className="flex items-center space-x-2">
                          <button 
                            onClick={() => {
                              setComments(prev => prev.map(item => item.id === c.id ? { ...item, status: 'approved' } : item));
                              showToast('Komentar disetujui!');
                            }}
                            className="py-1 px-3 bg-emerald-600 text-white rounded-lg text-[10px] font-bold"
                          >
                            Setujui
                          </button>
                          <button 
                            onClick={() => {
                              setComments(prev => prev.filter(item => item.id !== c.id));
                              showToast('Komentar dihapus.');
                            }}
                            className="py-1 px-3 bg-red-600 text-white rounded-lg text-[10px] font-bold"
                          >
                            Hapus
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 5: AFFILIATE LINKS */}
          {adminTab === 'affiliate' && (
            <div className="glass-card p-5 rounded-2xl space-y-3">
              <h3 className="text-xs font-bold text-white uppercase tracking-wider">Pengaturan Banner Pop-up Affiliate</h3>

              <div className="space-y-2.5 text-xs">
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Judul Pop-up Affiliate</label>
                  <input type="text" value={affiliate.title} onChange={e => setAffiliate({...affiliate, title: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">URL Affiliate Shopee</label>
                  <input type="text" value={affiliate.shopeeUrl} onChange={e => setAffiliate({...affiliate, shopeeUrl: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">URL Affiliate TikTok Shop</label>
                  <input type="text" value={affiliate.tokopediaUrl} onChange={e => setAffiliate({...affiliate, tokopediaUrl: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>

                <button 
                  onClick={() => showToast('Pengaturan affiliate diperbarui!')}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold"
                >
                  Simpan Affiliate
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
