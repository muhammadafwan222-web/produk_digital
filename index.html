const formatIDR = (v) => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const formatWANumber = (num) => { if(!num) return ""; let f=String(num).replace(/\D/g,''); if(f.startsWith('0')) f='62'+f.substring(1); if(f.startsWith('620')) f='62'+f.substring(3); return f; };
const storeUrl = () => window.location.origin + window.location.pathname;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const nowISO = () => new Date().toISOString();
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
const slugify = (t='') => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,90);
const plainTextFromHtml = (html='') => { const el=document.createElement('div'); el.innerHTML=html; return (el.textContent||el.innerText||'').replace(/\s+/g,' ').trim(); };
const getFirstImage = (html='') => { const m=String(html).match(/<img[^>]+src=["']([^"']+)["']/i); return m?m[1]:''; };
const sanitizeHtml = (html='') => {
  const doc = new DOMParser().parseFromString('<div id="safe-root">'+html+'</div>','text/html');
  doc.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form,input,textarea,button').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const n=attr.name.toLowerCase(), v=attr.value||'';
      if(n.startsWith('on')||n==='srcdoc'||((n==='href'||n==='src')&&/^\s*javascript:/i.test(v))) el.removeAttribute(attr.name);
    });
    if(el.tagName==='A'){ const href=el.getAttribute('href')||''; if(href&&!/^(https?:|mailto:|tel:|\/|#)/i.test(href)) el.removeAttribute('href'); el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer nofollow'); }
  });
  return doc.querySelector('#safe-root')?.innerHTML || '';
};
const normalizeSubscriber = (raw = {}) => {
  const email = String(raw.email || '').trim().toLowerCase();
  const whatsapp = formatWANumber(raw.whatsapp || raw.wa || raw.phone || raw.hp || raw.nomor || '');
  const tags = Array.isArray(raw.tags) ? raw.tags.join(',') : String(raw.tags || '').trim();
  return {
    name: String(raw.name || raw.nama || '').trim().slice(0,120),
    email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : '',
    raw_email: email,
    whatsapp,
    source: String(raw.source || 'toko').trim().slice(0,60),
    tags: tags.slice(0,160),
    status: raw.status === 'nonaktif' ? 'nonaktif' : 'aktif',
    notes: String(raw.notes || '').trim().slice(0,500),
    last_campaign: String(raw.last_campaign || '').slice(0,160),
    last_status: String(raw.last_status || '').slice(0,40),
    last_sent_at: raw.last_sent_at || null
  };
};
const normalizeAffiliateLinks = (rows=[]) => (Array.isArray(rows)?rows:[]).filter(x=>x&&x.platform).map((x,i)=>({
  ...x, platform:String(x.platform||'').trim(), title:String(x.title||x.platform||'').trim(),
  description:String(x.description||'').trim(), url:String(x.url||'').trim(),
  icon:String(x.icon||'fa-solid fa-link').trim(), tone:String(x.tone||'tiktok').trim(),
  enabled:x.enabled!==false, sort_order:Number.isFinite(Number(x.sort_order))?Number(x.sort_order):(i+1)
})).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
const getStoredAffiliateLinks = () => { const s = LS.get('bisniku7_affiliate_settings', null); return Array.isArray(s)&&s.length?normalizeAffiliateLinks(s):null; };
const trackAffiliateClick = (item, post) => { try { const d=LS.get('bisniku7_affiliate_clicks',[]); d.unshift({platform:item.platform,url:item.url,postTitle:post?.title||'',at:nowISO()}); LS.set('bisniku7_affiliate_clicks', d.slice(0,500)); } catch(e){} };

const extractBloggerEntries = (xmlText) => {
  const xml = new DOMParser().parseFromString(xmlText,'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('File XML tidak valid.');
  const entries = [...xml.getElementsByTagName('entry')]; const posts = [];
  entries.forEach((entry,index)=>{
    const title = entry.getElementsByTagName('title')[0]?.textContent?.trim()||'';
    const content = entry.getElementsByTagName('content')[0]?.textContent||'';
    if(!title && !content) return;
    const legacyId = entry.getElementsByTagName('id')[0]?.textContent?.trim()||`xml-${index}`;
    const published = entry.getElementsByTagName('published')[0]?.textContent?.trim()||entry.getElementsByTagName('updated')[0]?.textContent?.trim()||nowISO();
    const updated = entry.getElementsByTagName('updated')[0]?.textContent?.trim()||published;
    const author = entry.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent?.trim()||'Admin';
    const labels = [...entry.getElementsByTagName('category')].map(c=>c.getAttribute('term')).filter(Boolean).filter(t=>!t.includes('#'));
    const clean = sanitizeHtml(content);
    posts.push({ legacy_id:legacyId, title:title||'Tanpa Judul', slug:slugify(title)||`artikel-${index+1}`,
      content_html:clean, excerpt:plainTextFromHtml(clean).slice(0,220), cover_url:getFirstImage(clean),
      author_name:author, published_at:new Date(published).toISOString(), updated_at:new Date(updated).toISOString(),
      status:'published', labels });
  });
  return posts;
};

  const saveSubscriber = async (raw) => {
    const payload = normalizeSubscriber(raw);
    if (!payload.email && !payload.whatsapp) return { ok:false, reason:'Email & WhatsApp kosong' };
    const list = subsRef.current || [];
    const existing = list.find(s => (payload.email && String(s.email||'').toLowerCase() === payload.email) ||
                                    (payload.whatsapp && String(s.whatsapp||'') === payload.whatsapp));
    if (existing) {
      const merged = { ...existing, ...payload, id: existing.id, name: payload.name || existing.name, tags: payload.tags || existing.tags };
      const { error } = await supabaseClient.from('subscribers').update(merged).eq('id', existing.id);
      let next;
      if (error) { const local = LS.get(KEY_SUBS, list).map(s => s.id === existing.id ? merged : s); LS.set(KEY_SUBS, local); next = local; setSubsFallback(true); }
      else next = list.map(s => s.id === existing.id ? merged : s);
      subsRef.current = next; setSubscribers(next);
      return { ok:true, record: merged, duplicate:true };
    }
    const row = { ...payload, id: `sub-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, created_at: nowISO() };
    const { data, error } = await supabaseClient.from('subscribers').insert([row]).select();
    let saved = row, next;
    if (!error && data && data[0]) { saved = data[0]; next = [saved, ...list]; }
    else { const local = LS.get(KEY_SUBS, list); next = [row, ...local]; LS.set(KEY_SUBS, next); setSubsFallback(true); }
    subsRef.current = next; setSubscribers(next);
    return { ok:true, record: saved, duplicate:false };
  };

    setImportFileName(file.name); setImportError(''); setImportRows([]); setImportPreview([]);
    try {
      let wb;
      if (/\.(xlsx|xls|xlsm|xlsb)$/i.test(file.name)) { const buf = await file.arrayBuffer(); wb = XLSX.read(buf,{type:'array'}); }
      else if (/\.(csv|txt|tsv)$/i.test(file.name)) { const txt = await file.text(); wb = XLSX.read(txt,{type:'string'}); }
      else throw new Error('Format file harus .xlsx / .xls / .csv');
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws,{defval:''});
      if (!rows.length) throw new Error('Sheet pertama kosong atau tidak punya baris header.');
      const cols = Object.keys(rows[0]);
      const find = (keys) => cols.find(c => { const n = String(c).toLowerCase().replace(/[\s_\-.]/g,''); return keys.some(k => n.includes(k)); }) || '';
      setImportColumns(cols); setImportRows(rows); setImportPreview(rows.slice(0,6));

        name: find(['nama','name','fullname','kontak']),
        email: find(['email','surel','mail']),
        whatsapp: find(['whatsapp','wa','phone','ponsel','hp','telepon','telp','mobile','nomor','number']),
        tags: find(['tag','label','kategori']),
        source: find(['source','sumber','asal'])
      });
      setImportOpen(true);
    } catch (e) { setImportError(e.message || 'Gagal membaca file.'); setImportOpen(true); }

  /* ============ BROADCAST ============ */
  const buildMessage = (tpl, lead, ctx = {}) => {
    const prod = ctx.product || productsRef.current.find(p => String(p.id) === String(ctx.productId || composeRef.current.productId || settingsRef.current.defaultProductId));
    const bonusUrl = ctx.bonusUrl || creatorRef.current.bonusUrl || settingsRef.current.bonusUrl || storeUrl();
    const link = ctx.link || composeRef.current.link || (prod ? storeUrl() : (settingsRef.current.defaultLink || storeUrl()));
    return String(tpl || '')
      .replace(/\{\{nama\}\}/gi, lead?.name || 'Kak')
      .replace(/\{\{email\}\}/gi, lead?.email || '')
      .replace(/\{\{wa\}\}/gi, lead?.whatsapp || '')
      .replace(/\{\{toko\}\}/gi, creatorRef.current.name || '')
      .replace(/\{\{tanggal\}\}/gi, new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}))
      .replace(/\{\{produk\}\}/gi, ctx.productTitle || prod?.title || 'Produk Digital Terbaru')
      .replace(/\{\{harga\}\}/gi, ctx.price ? formatIDR(ctx.price) : (prod ? formatIDR(prod.price) : 'Hubungi admin'))
      .replace(/\{\{bonus_link\}\}/gi, bonusUrl)
      .replace(/\{\{bonus\}\}/gi, settingsRef.current.leadBonusText ? `🎁 ${settingsRef.current.leadBonusText}: ${bonusUrl}` : '')
      .replace(/\{\{link\}\}/gi, link)
      .replace(/\{\{footer\}\}/gi, settingsRef.current.waFooter || '');
  };

  const sendWhatsAppTo = (lead, message) => {
    const num = formatWANumber(lead.whatsapp);
    if (!num) return { status:'gagal', note:'Nomor WA kosong' };
    const url = `https://wa.me/${num}?text=${encodeURIComponent(message)}`;
    if (composeRef.current.sendMode === 'link') return { status:'link siap', url };
    const w = window.open(url, '_blank', 'noopener,noreferrer');
    return w ? { status:'terkirim', url } : { status:'gagal', note:'Popup diblokir browser', url };
  };

  const sendEmailTo = async (lead, subject, message) => {
    const to = lead.email;
    if (!to) return { status:'gagal', note:'Email kosong' };
    const cfg = settingsRef.current;
    if (cfg.emailjsPublicKey && cfg.emailjsServiceId && cfg.emailjsTemplateId && window.emailjs) {
      try {
        if (!window.emailjs.__inited) { window.emailjs.init({ publicKey: cfg.emailjsPublicKey }); window.emailjs.__inited = true; }
        await window.emailjs.send(cfg.emailjsServiceId, cfg.emailjsTemplateId, {
          to_email: to, to_name: lead.name || '', from_name: creatorRef.current.name || '',
          subject, message, store_name: creatorRef.current.name || ''
        });
        return { status:'terkirim' };
      } catch (e) { return { status:'gagal', note:String(e?.text || e?.message || e).slice(0,120) }; }
    }
    const mailto = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
    if (composeRef.current.sendMode === 'link') return { status:'link siap', url:mailto };
    const w = window.open(mailto, '_blank');
    return w ? { status:'terkirim', note:'via aplikasi email' } : { status:'gagal', note:'Popup diblokir', url:mailto };
  };

  const getTargets = (opts = {}) => {
    const channel = opts.channel || composeRef.current.channel;
    const src = opts.targetSource ?? composeRef.current.targetSource;
    const stat = opts.targetStatus ?? composeRef.current.targetStatus;
    const tag = String((opts.targetTag ?? composeRef.current.targetTag) || '').trim().toLowerCase();
    const onlyIds = opts.onlyIds;
    return (subsRef.current || []).filter(s => {
      if (onlyIds && !onlyIds.includes(s.id)) return false;
      if (stat !== 'Semua' && (s.status || 'aktif') !== stat) return false;
      if (src !== 'Semua' && (s.source || '') !== src) return false;
      if (tag && !String(s.tags || '').toLowerCase().includes(tag)) return false;
      if (channel === 'wa' && !s.whatsapp) return false;
      if (channel === 'email' && !s.email) return false;
      if (channel === 'both' && !s.whatsapp && !s.email) return false;
      return true;
    });
  };

  const runBroadcast = async (opts = {}) => {
    if (sendingRef.current) { showToast('⚠️ Sedang ada pengiriman berjalan.'); return; }
    const channel = opts.channel || compose.channel;
    const targets = opts.targets || getTargets(opts);
    if (!targets.length) { showToast('❌ Tidak ada target yang memenuhi filter.'); return; }
    const tpl = opts.template || compose.message || settings.messageTemplate;
    const subjectTpl = opts.subject || compose.subject || settings.emailSubject;
    const campaign = opts.campaignName || compose.campaignName || `Kampanye ${new Date().toLocaleDateString('id-ID')}`;
    const ctx = opts.context || { productId: compose.productId, link: compose.link };
    const delay = Math.max(1, Number(opts.delaySeconds || compose.delaySeconds || settings.delaySeconds || 4)) * 1000;

    sendingRef.current = true; cancelRef.current = false; setSending(true);
    setSendProgress({ done:0, total:targets.length, ok:0, fail:0, current:'' });
    let ok = 0, fail = 0;
    const touched = [];

    for (let i = 0; i < targets.length; i++) {
      if (cancelRef.current) break;
      const lead = targets[i];
      const message = buildMessage(tpl, lead, ctx);
      const subject = buildMessage(subjectTpl, lead, ctx);
      setSendProgress(p => ({ ...p, current: `${lead.name || lead.email || lead.whatsapp}`, done:i }));
      const results = [];
      if (channel === 'wa' || channel === 'both') { if (lead.whatsapp) results.push({ ch:'WhatsApp', ...sendWhatsAppTo(lead, message) }); }
      if (channel === 'email' || channel === 'both') { if (lead.email) results.push({ ch:'Email', ...(await sendEmailTo(lead, subject, message)) }); }
      const allOk = results.length > 0 && results.every(r => r.status !== 'gagal');
      const anyFail = results.some(r => r.status === 'gagal');
      if (allOk) ok++; else if (anyFail) fail++;
      const statusLabel = allOk ? 'terkirim' : (anyFail ? 'gagal' : 'dilewati');
      touched.push({ ...lead, last_campaign: campaign, last_status: statusLabel, last_sent_at: nowISO() });
      await pushLog({ name: lead.name || '', email: lead.email || '', whatsapp: lead.whatsapp || '',
        channel, campaign, status: statusLabel, note: results.map(r=>`${r.ch}: ${r.status}${r.note?` (${r.note})`:''}`).join(' | '),
        message: message.slice(0,600) });
      if (i < targets.length - 1 && !cancelRef.current) await sleep(channel !== 'email' && composeRef.current.sendMode === 'auto' ? delay : Math.min(delay, 600));
    }

    let merged = subsRef.current.map(s => { const t = touched.find(x => x.id === s.id); return t ? { ...s, last_campaign:t.last_campaign, last_status:t.last_status, last_sent_at:t.last_sent_at } : s; });
    subsRef.current = merged; setSubscribers(merged); persistLocalSubs(merged);
    if (touched.length) await supabaseClient.from('subscribers').upsert(touched.map(t=>({ id:t.id, last_campaign:t.last_campaign, last_status:t.last_status, last_sent_at:t.last_sent_at })), { onConflict:'id' });

    setSendProgress({ done: targets.length, total: targets.length, ok, fail, current: cancelRef.current ? 'Dihentikan' : 'Selesai' });
    setLastResult({ total: targets.length, ok, fail, campaign, at: nowISO(), stopped: cancelRef.current });
    sendingRef.current = false; setSending(false);
    showToast(cancelRef.current ? `⏹️ Dihentikan. ${ok} terkirim, ${fail} gagal.` : `✅ Broadcast selesai: ${ok} terkirim, ${fail} gagal dari ${targets.length} target.`);
  };

            <div className="flex gap-2 pt-1">
              <button type="button" onClick={()=>setEditLead(null)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button type="submit" className="btn flex-1 bg-emerald-600 hover:bg-emerald-500 text-white">Simpan Kontak</button>
            </div>
          </form>
        </div>
      )}

      {blogSharePost && (
        <div className="fixed inset-0 z-[60] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-cyan-500/30 rounded-3xl w-full max-w-4xl max-h-[92vh] overflow-y-auto p-5 md:p-7 shadow-2xl">
            <div className="flex items-start justify-between gap-4 mb-5">
              <div>
                <div className="text-[10px] text-cyan-300 uppercase tracking-[0.18em] font-black">Share Card Artikel</div>
                <h3 className="text-lg md:text-xl font-black text-white mt-1">Bagikan ke Status WhatsApp</h3>
              </div>
              <button onClick={()=>{setBlogSharePost(null);setBlogSharePreviewUrl('');}} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div className="grid md:grid-cols-[360px_1fr] gap-6 items-start">
              <div className="flex justify-center">
                {blogSharePreviewUrl ? <img src={blogSharePreviewUrl} alt="Preview" className="share-card-preview object-cover" /> :
                  <div className="share-card-preview flex items-center justify-center"><div className="text-center text-slate-500 text-xs px-8"><i className="fa-solid fa-wand-magic-sparkles text-3xl mb-3"></i><div>{blogShareBusy?'Membuat kartu share…':'Preview belum tersedia'}</div></div></div>}
              </div>
              <div className="space-y-4">
                <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-4">
                  <div className="text-[10px] uppercase tracking-wider font-bold text-slate-500 mb-2">Judul yang dibagikan</div>
                  <div className="text-base font-extrabold text-white leading-snug">{blogSharePost.title}</div>
                  <div className="mt-3 text-xs text-slate-400 whitespace-pre-line leading-relaxed">{getBlogShareCaption(blogSharePost)}</div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <button disabled={blogShareBusy} onClick={()=>shareBlogToWhatsAppStatus(blogSharePost)} className="btn bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white"><i className="fa-brands fa-whatsapp"></i>Bagikan ke WhatsApp</button>
                  <button disabled={blogShareBusy} onClick={()=>downloadBlogShareCard(blogSharePost)} className="btn bg-cyan-600 hover:bg-cyan-500 disabled:opacity-60 text-white"><i className="fa-solid fa-image"></i>Simpan Kartu</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showShareModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl text-center">
            <div className="w-12 h-12 bg-pink-500/20 text-pink-400 rounded-full flex items-center justify-center mx-auto text-xl"><i className="fa-solid fa-paper-plane"></i></div>
            <h3 className="font-bold text-base text-white">Langkah Terakhir: Konfirmasi Share</h3>
            <p className="text-xs text-slate-300">Bagikan pesan di bawah ini ke sosial media kamu agar bonus terbuka.</p>
            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-left text-[11px] text-slate-300">
              <pre className="whitespace-pre-wrap font-sans leading-relaxed">{getViralCaption()}</pre>
              <button onClick={async()=>{await navigator.clipboard.writeText(getViralCaption());showToast('📋 Caption disalin!');}} className="mt-2 btn bg-slate-800 hover:bg-slate-700 text-indigo-300"><i className="fa-solid fa-copy"></i> Salin Caption</button>
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={()=>setShowShareModal(false)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button onClick={handleConfirmShare} className="btn flex-[2] bg-gradient-to-r from-emerald-600 to-teal-500 text-white"><i className="fa-solid fa-check"></i> Saya Sudah Membagikan</button>
            </div>
          </div>
        </div>
      )}

      {selectedDetailProduct && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-slate-800 pb-2 sticky top-0 bg-slate-900 z-10">
              <span className="text-xs font-bold uppercase text-indigo-400 tracking-wider"><i className="fa-solid fa-book-open mr-1.5"></i> Detail Produk</span>
              <button onClick={()=>setSelectedDetailProduct(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            {selectedDetailProduct.coverUrl && <img src={selectedDetailProduct.coverUrl} className="w-full h-48 object-cover rounded-xl border border-slate-800" alt="" />}
            <div className="flex items-center justify-between">
              <span className="badge-soft bg-indigo-500/20 text-indigo-300 border-indigo-500/30">{selectedDetailProduct.category}</span>
              <span className="text-lg font-extrabold text-emerald-400">{formatIDR(selectedDetailProduct.price)}</span>
            </div>
            <h2 className="text-base font-bold text-white">{selectedDetailProduct.title}</h2>
            <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs"><p className="text-slate-400 leading-relaxed">{selectedDetailProduct.description||'Tidak ada deskripsi.'}</p></div>
            <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs">
              <h4 className="font-semibold text-slate-300 mb-2"><i className="fa-solid fa-list-check text-emerald-400 mr-1"></i> Isi & Materi</h4>
              <div className="text-slate-300 whitespace-pre-line leading-relaxed bg-slate-900/80 p-3 rounded-lg border border-slate-800/80">{selectedDetailProduct.details||'• Bab 1: Pengenalan\n• Bab 2: Implementasi\n• Bab 3: Studi Kasus\n• Bonus: Template'}</div>
            </div>
            <button onClick={()=>{setCheckoutProduct(selectedDetailProduct);setCheckoutStep(1);setSelectedDetailProduct(null);}} className="btn w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3"><i className="fa-solid fa-cart-shopping"></i> Lanjut ke Pembelian</button>
          </div>
        </div>
      )}

      {checkoutProduct && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-slate-800 pb-2">
              <h3 className="font-bold text-sm text-white truncate max-w-[250px]">Beli: {checkoutProduct.title}</h3>
              <button onClick={()=>setCheckoutProduct(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            {checkoutStep===1 && (
              <div className="space-y-3">
                <div className="bg-emerald-950/40 border border-emerald-500/20 p-2.5 rounded-xl text-[11px] text-emerald-300"><i className="fa-solid fa-circle-info mr-1"></i> Data pembeli otomatis tersimpan ke database leads, dan invoice + link produk otomatis terkirim ke email & WhatsApp kamu.</div>
                <div><label className="field-label">Nama Lengkap *</label><input value={buyerName} onChange={e=>setBuyerName(e.target.value)} className="inp" /></div>
                <div><label className="field-label">Email Aktif *</label><input type="email" value={buyerEmail} onChange={e=>setBuyerEmail(e.target.value)} className="inp" /></div>
                <div><label className="field-label">Nomor WhatsApp</label><input value={buyerPhone} onChange={e=>setBuyerPhone(e.target.value)} placeholder="08xx" className="inp" /></div>
                <button onClick={()=>{ if(!buyerName||!buyerEmail) return showToast('⚠️ Isi nama dan email pembeli!'); setCheckoutStep(2); }} className="btn w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3">Lanjut ke Pembayaran</button>
              </div>
            )}
            {checkoutStep===2 && (
              <div className="space-y-3 text-xs">
                <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer"><input type="radio" checked={selectedPayment==='bank'} onChange={()=>setSelectedPayment('bank')} className="accent-indigo-500" /><div><strong>Transfer Bank BRI</strong></div></label>
                <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer"><input type="radio" checked={selectedPayment==='dana'} onChange={()=>setSelectedPayment('dana')} className="accent-indigo-500" /><div><strong>Transfer DANA</strong></div></label>
                <div className="flex gap-2">
                  <button onClick={()=>setCheckoutStep(1)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Kembali</button>
                  <button onClick={()=>setCheckoutStep(3)} className="btn flex-[2] bg-indigo-600 hover:bg-indigo-500 text-white">Lihat Rekening</button>
                </div>
              </div>
            )}
            {checkoutStep===3 && (
              <div className="text-center space-y-4 text-xs">
                <div className="bg-amber-500/10 p-2.5 rounded-xl text-amber-300 font-bold border border-amber-500/20">Total Tagihan: {formatIDR(checkoutProduct.price)}</div>
                {selectedPayment==='bank' ? (
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left"><div className="text-[10px] text-slate-400">Transfer Bank BRI:</div><div className="font-mono text-lg font-bold text-indigo-400">{creator.bankBriNorek}</div><div>a/n {creator.bankBriNama}</div></div>
                ) : (
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left"><div className="text-[10px] text-slate-400">Transfer DANA:</div><div className="font-mono text-lg font-bold text-blue-400">{creator.danaNomor}</div><div>a/n {creator.danaNama}</div></div>
                )}
                <button onClick={handleCheckoutWhatsApp} className="btn w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3"><i className="fa-brands fa-whatsapp"></i> Konfirmasi Pembayaran (WhatsApp)</button>
              </div>
            )}
          </div>
        </div>
      )}

      {editAffiliate && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSaveAffiliate} className="bg-slate-900 border border-emerald-500/20 rounded-2xl w-full max-w-md p-5 space-y-3 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
              <h3 className="font-bold text-white text-sm"><i className="fa-solid fa-bullhorn text-emerald-400 mr-2"></i>Kelola Affiliate</h3>
              <button type="button" onClick={()=>setEditAffiliate(null)} className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>
            <div><label className="field-label">Platform</label><input required value={editAffiliate.platform||''} onChange={e=>setEditAffiliate({...editAffiliate,platform:e.target.value})} className="inp" /></div>
            <div><label className="field-label">Judul</label><input required value={editAffiliate.title||''} onChange={e=>setEditAffiliate({...editAffiliate,title:e.target.value})} className="inp" /></div>
            <div><label className="field-label">Deskripsi</label><textarea rows="2" value={editAffiliate.description||''} onChange={e=>setEditAffiliate({...editAffiliate,description:e.target.value})} className="inp"></textarea></div>
            <div><label className="field-label">URL</label><input type="url" required value={editAffiliate.url||''} onChange={e=>setEditAffiliate({...editAffiliate,url:e.target.value})} className="inp" /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="field-label">Ikon</label><input value={editAffiliate.icon||''} onChange={e=>setEditAffiliate({...editAffiliate,icon:e.target.value})} className="inp" /></div>
              <div><label className="field-label">Tema</label><select value={editAffiliate.tone||'tiktok'} onChange={e=>setEditAffiliate({...editAffiliate,tone:e.target.value})} className="inp"><option value="shopee">Shopee</option><option value="tiktok">TikTok</option></select></div>
              <div><label className="field-label">Urutan</label><input type="number" min="1" value={editAffiliate.sort_order||1} onChange={e=>setEditAffiliate({...editAffiliate,sort_order:Number(e.target.value)||1})} className="inp" /></div>
              <label className="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 mt-5 cursor-pointer"><input type="checkbox" className="accent-emerald-500" checked={editAffiliate.enabled!==false} onChange={e=>setEditAffiliate({...editAffiliate,enabled:e.target.checked})} /><span className="text-[11px] text-slate-300">Tampilkan</span></label>
            </div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={()=>setEditAffiliate(null)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button type="submit" className="btn flex-[2] bg-emerald-600 hover:bg-emerald-500 text-white">Simpan</button>
            </div>
          </form>
        </div>
      )}

      {editBlogPost && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSaveBlogPost} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
              <h3 className="font-bold text-white text-sm">{editBlogPost.id?'Edit Artikel':'Tulis Artikel Baru'}</h3>
              <button type="button" onClick={()=>setEditBlogPost(null)} className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>
            <div><label className="field-label">Judul *</label><input required value={editBlogPost.title||''} onChange={e=>setEditBlogPost({...editBlogPost,title:e.target.value})} className="inp" /></div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="field-label">Slug</label><input value={editBlogPost.slug||''} onChange={e=>setEditBlogPost({...editBlogPost,slug:e.target.value})} className="inp" /></div>
              <div><label className="field-label">Label (pisahkan koma)</label><input value={Array.isArray(editBlogPost.labels)?editBlogPost.labels.join(', '):(editBlogPost.labels||'')} onChange={e=>setEditBlogPost({...editBlogPost,labels:e.target.value})} className="inp" /></div>
            </div>
            <div><label className="field-label">URL Cover</label><input value={editBlogPost.cover_url||''} onChange={e=>setEditBlogPost({...editBlogPost,cover_url:e.target.value})} className="inp" /></div>
            <div><label className="field-label">Ringkasan</label><textarea rows="2" value={editBlogPost.excerpt||''} onChange={e=>setEditBlogPost({...editBlogPost,excerpt:e.target.value})} className="inp"></textarea></div>
            <div><label className="field-label">Isi Konten (HTML) *</label><textarea rows="8" required value={editBlogPost.content_html||''} onChange={e=>setEditBlogPost({...editBlogPost,content_html:e.target.value})} className="inp font-mono text-[11px]"></textarea></div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={()=>setEditBlogPost(null)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button type="submit" className="btn flex-[2] bg-cyan-600 hover:bg-cyan-500 text-white">Simpan Artikel</button>
            </div>
          </form>
        </div>
      )}

      {editProduct && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSaveProduct} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 max-h-[90vh] overflow-y-auto">
            <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Produk Digital</h3>
            <div><label className="field-label">Judul Produk</label><input required value={editProduct.title} onChange={e=>setEditProduct({...editProduct,title:e.target.value})} className="inp" /></div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="field-label">Kategori</label>
                <select value={editProduct.category} onChange={e=>setEditProduct({...editProduct,category:e.target.value})} className="inp">
                  {['E-Book','Template','Kursus/Video','Preset & LUTs','Aset Desain','Software & Plugin','Audio & Musik','Font & Tipografi','Notion / Planner','Membership','Photo Asset','Printable Kids','Template PPT','Template Notion','Video Asset','Website/Plugin/JSON','Bank Konten Affiliate'].map(c=><option key={c} value={c}>{c}</option>)}
                </select></div>
              <div><label className="field-label">Harga (IDR)</label><input type="number" required value={editProduct.price} onChange={e=>setEditProduct({...editProduct,price:parseFloat(e.target.value)||0})} className="inp" /></div>
            </div>
            <div><label className="field-label">Link Akses File</label><input required value={editProduct.downloadUrl} onChange={e=>setEditProduct({...editProduct,downloadUrl:e.target.value})} className="inp" /></div>
            <div><label className="field-label">URL Cover</label><input value={editProduct.coverUrl} onChange={e=>setEditProduct({...editProduct,coverUrl:e.target.value})} className="inp" /></div>
            <div><label className="field-label">Deskripsi Singkat</label><textarea rows="2" value={editProduct.description} onChange={e=>setEditProduct({...editProduct,description:e.target.value})} className="inp"></textarea></div>
            <div><label className="field-label">Detail Isi</label><textarea rows="4" value={editProduct.details||''} onChange={e=>setEditProduct({...editProduct,details:e.target.value})} className="inp"></textarea></div>
            <label className="flex items-center gap-2 rounded-xl border border-emerald-500/25 bg-emerald-950/20 p-3 cursor-pointer">
              <input type="checkbox" className="accent-emerald-500" checked={!!settings.autoBroadcastProduct} onChange={e=>persistSettings({...settingsRef.current, autoBroadcastProduct:e.target.checked})} />
              <span className="text-[10px] text-emerald-200 leading-relaxed">Otomatis broadcast produk ini ke semua email & WhatsApp yang terkumpul setelah disimpan.</span>
            </label>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={()=>setEditProduct(null)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button type="submit" className="btn flex-[2] bg-indigo-600 hover:bg-indigo-500 text-white">Simpan Produk</button>
            </div>
          </form>
        </div>
      )}

      {editLink && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSaveLink} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3">
            <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Tautan Bio</h3>
            <div><label className="field-label">Judul Tautan</label><input required value={editLink.title} onChange={e=>setEditLink({...editLink,title:e.target.value})} className="inp" /></div>
            <div><label className="field-label">URL Tujuan</label><input type="url" required value={editLink.url} onChange={e=>setEditLink({...editLink,url:e.target.value})} className="inp" /></div>
            <div><label className="field-label">Badge</label><input value={editLink.badge} onChange={e=>setEditLink({...editLink,badge:e.target.value})} className="inp" /></div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={()=>setEditLink(null)} className="btn flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300">Batal</button>
              <button type="submit" className="btn flex-[2] bg-purple-600 hover:bg-purple-500 text-white">Simpan Tautan</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
