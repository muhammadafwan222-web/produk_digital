        // ===== BLOG ENGINE: Blogger/Blogspot XML compatible =====
        const escapeHtml = (value = '') => String(value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

        const slugify = (text = '') => String(text).toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-')
            .replace(/-+/g, '-').slice(0, 90);

        const plainTextFromHtml = (html = '') => {
            const el = document.createElement('div');
            el.innerHTML = html;
            return (el.textContent || el.innerText || '').replace(/\s+/g, ' ').trim();
        };

        const getFirstImage = (html = '') => {
            const m = String(html).match(/<img[^>]+src=["']([^"']+)["']/i);
            return m ? m[1] : '';
        };

        const sanitizeHtml = (html = '') => {
            const doc = new DOMParser().parseFromString(`<div id="safe-root">${html}</div>`, 'text/html');
            doc.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form,input,textarea,button').forEach(n => n.remove());
            doc.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    const n = attr.name.toLowerCase();
                    const v = attr.value || '';
                    if (n.startsWith('on') || n === 'srcdoc' || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(v))) {
                        el.removeAttribute(attr.name);
                    }
                });
                if (el.tagName === 'A') {
                    const href = el.getAttribute('href') || '';
                    if (href && !/^(https?:|mailto:|tel:|\/|#)/i.test(href)) el.removeAttribute('href');
                    el.setAttribute('target','_blank');
                    el.setAttribute('rel','noopener noreferrer nofollow');
                }
            });
            return doc.querySelector('#safe-root')?.innerHTML || '';
        };

        const extractBloggerEntries = (xmlText) => {
            const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
            const parserError = xml.querySelector('parsererror');
            if (parserError) throw new Error('File XML tidak valid.');
            const entries = [...xml.getElementsByTagName('entry')];
            const posts = [];
            entries.forEach((entry, index) => {
                const title = entry.getElementsByTagName('title')[0]?.textContent?.trim() || '';
                const contentNode = entry.getElementsByTagName('content')[0];
                const content = contentNode?.textContent || '';
                const typeNode = [...entry.getElementsByTagName('category')].find(c => (c.getAttribute('scheme') || '').includes('kind') && c.getAttribute('term')?.includes('#post'));
                const hasPostCategory = !!typeNode;
                if (!title && !content) return;
                if (entries.length > 0 && !hasPostCategory && !content) return;
                const legacyId = entry.getElementsByTagName('id')[0]?.textContent?.trim() || `xml-${index}`;
                const published = entry.getElementsByTagName('published')[0]?.textContent?.trim() || entry.getElementsByTagName('updated')[0]?.textContent?.trim() || new Date().toISOString();
                const updated = entry.getElementsByTagName('updated')[0]?.textContent?.trim() || published;
                const author = entry.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent?.trim() || 'Admin';
                const labels = [...entry.getElementsByTagName('category')].map(c => c.getAttribute('term')).filter(Boolean).filter(term => !term.includes('#'));
                const clean = sanitizeHtml(content);
                posts.push({
                    legacy_id: legacyId,
                    title: title || 'Tanpa Judul',
                    slug: slugify(title) || `artikel-${index + 1}`,
                    content_html: clean,
                    excerpt: plainTextFromHtml(clean).slice(0, 220),
                    cover_url: getFirstImage(clean),
                    author_name: author,
                    published_at: new Date(published).toISOString(),
                    updated_at: new Date(updated).toISOString(),
                    status: (() => {
                        const draftNode = entry.getElementsByTagName('app:draft')[0] || entry.getElementsByTagName('draft')[0];
                        return draftNode?.textContent?.trim().toLowerCase() === 'yes' ? 'draft' : 'published';
                    })(),
                    labels,
                });
            });
            return posts;

            const roundRectPath = (ctx, x, y, w, h, r) => {
                const rr = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + rr, y);
                ctx.arcTo(x + w, y, x + w, y + h, rr);
                ctx.arcTo(x + w, y + h, x, y + h, rr);
                ctx.arcTo(x, y + h, x, y, rr);
                ctx.arcTo(x, y, x + w, y, rr);
                ctx.closePath();
            };

            const drawWrappedText = (ctx, text, x, y, maxWidth, lineHeight, maxLines) => {
                const words = String(text || '').split(/\s+/).filter(Boolean);
                const lines = [];
                let line = '';
                for (const word of words) {
                    const test = line ? `${line} ${word}` : word;
                    if (ctx.measureText(test).width <= maxWidth) {
                        line = test;
                    } else {
                        if (line) lines.push(line);
                        line = word;
                        if (lines.length >= maxLines) break;
                    }
                }
                if (lines.length < maxLines && line) lines.push(line);
                if (lines.length === maxLines && words.length > 0) {
                    const visible = lines[lines.length - 1] || '';
                    lines[lines.length - 1] = visible.replace(/[.,;:!?-]?$/, '') + '…';
                }
                lines.forEach((ln, i) => ctx.fillText(ln, x, y + (i * lineHeight)));
                return lines.length;
            };

            const createBlogShareCard = async (post) => {
                await (document.fonts?.ready || Promise.resolve());
                const canvas = document.createElement('canvas');
                canvas.width = 1080;
                canvas.height = 1350;
                const ctx = canvas.getContext('2d');
                if (!ctx) throw new Error('Canvas tidak tersedia.');

                const bg = ctx.createLinearGradient(0, 0, 1080, 1350);
                bg.addColorStop(0, '#0b1220');
                bg.addColorStop(.58, '#0f172a');
                bg.addColorStop(1, '#052e2b');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, 1080, 1350);

                const glow1 = ctx.createRadialGradient(120, 90, 10, 120, 90, 430);
                glow1.addColorStop(0, 'rgba(34,211,238,.36)');
                glow1.addColorStop(1, 'rgba(34,211,238,0)');
                ctx.fillStyle = glow1;
                ctx.fillRect(0, 0, 600, 520);

                const glow2 = ctx.createRadialGradient(940, 1220, 20, 940, 1220, 460);
                glow2.addColorStop(0, 'rgba(20,184,166,.25)');
                glow2.addColorStop(1, 'rgba(20,184,166,0)');
                ctx.fillStyle = glow2;
                ctx.fillRect(580, 900, 500, 450);

                const coverH = 610;
                const cover = await loadImageForCanvas(post.cover_url || '');
                if (cover) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, 1080, coverH);
                    ctx.clip();
                    const scale = Math.max(1080 / cover.width, coverH / cover.height);
                    const dw = cover.width * scale;
                    const dh = cover.height * scale;
                    const dx = (1080 - dw) / 2;
                    const dy = (coverH - dh) / 2;
                    ctx.globalAlpha = .96;
                    ctx.drawImage(cover, dx, dy, dw, dh);
                    ctx.restore();
                } else {
                    const top = ctx.createLinearGradient(0, 0, 1080, coverH);
                    top.addColorStop(0, 'rgba(15,23,42,.2)');
                    top.addColorStop(1, 'rgba(6,78,59,.78)');
                    ctx.fillStyle = top;
                    ctx.fillRect(0, 0, 1080, coverH);
                    ctx.fillStyle = 'rgba(255,255,255,.06)';
                    ctx.font = '900 150px Inter, Arial, sans-serif';
                    ctx.fillText('BLOG', 72, 320);
                }

                const overlay = ctx.createLinearGradient(0, 200, 0, 720);
                overlay.addColorStop(0, 'rgba(2,6,23,0)');
                overlay.addColorStop(1, 'rgba(2,6,23,.97)');
                ctx.fillStyle = overlay;
                ctx.fillRect(0, 120, 1080, 600);

                roundRectPath(ctx, 62, 58, 350, 54, 27);
                ctx.fillStyle = 'rgba(2,6,23,.62)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(165,243,252,.32)';
                ctx.stroke();
                ctx.fillStyle = '#a5f3fc';
                ctx.font = '800 24px Inter, Arial, sans-serif';
                ctx.fillText('✦ ' + String(creator.name || 'BLOG').toUpperCase().slice(0, 26), 84, 94);

                const label = (post.labels || [])[0] || 'INFORMASI';
                ctx.fillStyle = '#67e8f9';
                ctx.font = '800 22px Inter, Arial, sans-serif';
                ctx.fillText('#' + String(label).slice(0, 24), 68, 682);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 58px Inter, Arial, sans-serif';
                const titleLines = drawWrappedText(ctx, String(post.title || 'Artikel Blog'), 68, 755, 944, 68, 3);

                const bodyTop = 755 + (titleLines * 68) + 26;
                ctx.fillStyle = '#cbd5e1';
                ctx.font = '500 24px Inter, Arial, sans-serif';
                const excerpt = plainTextFromHtml(post.excerpt || post.content_html || '').slice(0, 210);
                drawWrappedText(ctx, excerpt, 68, bodyTop, 920, 35, 3);

                roundRectPath(ctx, 68, 1168, 944, 106, 24);
                const cta = ctx.createLinearGradient(68, 1168, 1012, 1274);
                cta.addColorStop(0, '#0891b2');
                cta.addColorStop(1, '#059669');
                ctx.fillStyle = cta;
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 26px Inter, Arial, sans-serif';
                ctx.fillText('Baca selengkapnya di website', 102, 1212);
                ctx.font = '600 21px Inter, Arial, sans-serif';
                ctx.fillText(window.location.host || 'website Anda', 102, 1248);
                ctx.font = '900 23px Inter, Arial, sans-serif';
                ctx.fillText('↗', 944, 1228);

                return canvas;
            };

            const prepareBlogShare = async (post) => {
                setBlogSharePost(post);
                setBlogShareBusy(true);
                try {
                    const canvas = await createBlogShareCard(post);
                    setBlogSharePreviewUrl(canvas.toDataURL('image/png', 1.0));
                } catch (e) {
                    console.warn('Share card preview:', e);
                    setBlogSharePreviewUrl('');
                } finally {
                    setBlogShareBusy(false);
                }
            };

            const downloadBlogShareCard = async (post = blogSharePost) => {
                if (!post) return;
                try {
                    const canvas = await createBlogShareCard(post);
                    canvas.toBlob((blob) => {
                        if (!blob) return;
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${slugify(post.title || 'artikel')}-status-wa.png`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1500);
                    }, 'image/png');
                } catch (e) {
                    showToast('❌ Kartu share gagal dibuat.');
                }
            };

            const shareBlogToWhatsAppStatus = async (post) => {
                if (!post) return;
                setBlogShareBusy(true);
                try {
                    const canvas = await createBlogShareCard(post);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
                    const caption = getBlogShareCaption(post);
                    if (blob && navigator.share && navigator.canShare) {
                        const file = new File([blob], `${slugify(post.title || 'artikel')}-status-wa.png`, { type: 'image/png' });
                        if (navigator.canShare({ files: [file] })) {
                            await navigator.share({ files: [file], title: post.title, text: caption });
                            showToast('✅ Pilih WhatsApp → Status Saya untuk mempublikasikan.');
                            return;
                        }
                    }
                    const waUrl = `https://wa.me/?text=${encodeURIComponent(caption)}`;
                    window.open(waUrl, '_blank', 'noopener,noreferrer');
                    showToast('✅ WhatsApp dibuka dengan judul dan link artikel. Simpan kartu gambar untuk Status.');
                } catch (e) {
                    if (e?.name !== 'AbortError') showToast('⚠️ Pembagian dibatalkan atau browser tidak mendukung.');
                } finally {
                    setBlogShareBusy(false);

            // ===== BLOG ACTIONS =====

                try {
                    const { data } = await supabaseClient.from('blog_comments').select('*').eq('post_slug', post.slug).eq('is_approved', true).order('created_at', { ascending: false });
                    setBlogComments(data || []);
                } catch (e) { setBlogComments([]); }
            };

            const backToBlog = () => {

            const submitBlogComment = async (e) => {
                e.preventDefault();
                if (!selectedBlogPost || !commentName.trim() || !commentText.trim()) return;
                if (commentText.length > 1000) { showToast('❌ Komentar maksimal 1000 karakter.'); return; }
                const payload = { post_slug: selectedBlogPost.slug, name: commentName.trim().slice(0, 80), comment: commentText.trim().slice(0, 1000) };
                const { data, error } = await supabaseClient.from('blog_comments').insert(payload).select().single();
                if (!error) {
                    setBlogComments(prev => [{...data, is_approved:false}, ...prev]);
                    setCommentName(''); setCommentText('');
                    showToast('✅ Komentar terkirim dan menunggu moderasi.');
                } else showToast('❌ Komentar gagal dikirim.');
            };

            const importBlogXml = async () => {
                if (!blogXmlFile) { showToast('❌ Pilih file XML terlebih dahulu.'); return; }
                setBlogImporting(true);
                try {
                    const text = await blogXmlFile.text();
                    const imported = extractBloggerEntries(text);
                    if (!imported.length) throw new Error('Tidak menemukan posting artikel dalam XML.');
                    const used = new Set();
                    const posts = imported.map((p, i) => {
                        let s = p.slug || `artikel-${i+1}`;
                        while (used.has(s)) s = `${p.slug}-${i+1}`;
                        used.add(s);
                        return {...p, slug:s};
                    });
                    const { error } = await supabaseClient.from('blog_posts').upsert(posts, { onConflict:'legacy_id' });
                    if (error) throw error;
                    const { data: fresh } = await supabaseClient.from('blog_posts').select('*').eq('status','published').order('published_at',{ascending:false});
                    setBlogPosts(fresh || []);
                    setBlogXmlFile(null);
                    showToast(`✅ ${posts.length} artikel berhasil diimpor dari XML.`);
                } catch (err) {
                    console.error(err);
                    showToast(`❌ Import XML gagal: ${err.message || 'format tidak dikenali.'}`);
                } finally { setBlogImporting(false); }

                const entries = blogPosts.map(p => `\n<entry>\n<title>${esc(p.title)}</title>\n<id>${esc(p.legacy_id || `urn:custom:${p.id}`)}</id>\n<published>${new Date(p.published_at || Date.now()).toISOString()}</published>\n<updated>${new Date(p.updated_at || p.published_at || Date.now()).toISOString()}</updated>\n<author><name>${esc(p.author_name || creator.name)}</name></author>\n<content type="html">${esc(p.content_html || '')}</content>\n${(p.labels || []).map(l=>`<category scheme="http://www.blogger.com/atom/ns#" term="${esc(l)}"/>`).join('')}\n</entry>`).join('');
                const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<feed xmlns="http://www.w3.org/2005/Atom">${entries}\n</feed>`;

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto relative">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 sticky top-0 bg-slate-900 z-10 pt-2">
                                    <span className="text-xs font-bold uppercase text-indigo-400 tracking-wider"><i className="fa-solid fa-book-open mr-1.5"></i> Detail Produk</span>
                                    <button onClick={() => setSelectedDetailProduct(null)} className="text-slate-400 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <div className="space-y-3">
                                    <img src={selectedDetailProduct.coverUrl} className="w-full h-48 object-cover rounded-xl border border-slate-800" alt={selectedDetailProduct.title} />
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full font-bold">{selectedDetailProduct.category}</span>
                                        <span className="text-lg font-extrabold text-emerald-400">{formatIDR(selectedDetailProduct.price)}</span>
                                    </div>
                                    <h2 className="text-base font-bold text-white">{selectedDetailProduct.title}</h2>
                                    
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs">
                                        <h4 className="font-semibold text-slate-300 mb-1"><i className="fa-solid fa-circle-info text-indigo-400 mr-1"></i> Penjelasan Produk</h4>
                                        <p className="text-slate-400 leading-relaxed">{selectedDetailProduct.description || 'Tidak ada deskripsi singkat.'}</p>
                                    </div>

                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs">
                                        <h4 className="font-semibold text-slate-300 mb-2"><i className="fa-solid fa-list-check text-emerald-400 mr-1"></i> Isi & Materi Pembelajaran</h4>
                                        <div className="text-slate-300 whitespace-pre-line leading-relaxed bg-slate-900/80 p-3 rounded-lg border border-slate-800/80 font-sans">
                                            {selectedDetailProduct.details || "• Bab 1: Pengenalan & Konsep Dasar\n• Bab 2: Langkah Strategis & Implementasi\n• Bab 3: Studi Kasus & Template Praktis\n• Bab 4: Panduan Optimasi Akhir\n• Bonus: Modul Tambahan & Resources"}
                                        </div>
                                    </div>

                                    <div className="bg-indigo-950/40 border border-indigo-500/30 p-3.5 rounded-xl flex items-center justify-between">
                                        <div>
                                            <span className="text-[10px] text-indigo-300 block uppercase font-bold">Keranjang Pembelian</span>
                                            <span className="text-xs text-slate-300">1 Item: <strong>{selectedDetailProduct.title}</strong></span>
                                        </div>
                                        <span className="text-sm font-extrabold text-emerald-400">{formatIDR(selectedDetailProduct.price)}</span>
                                    </div>

                                    <button 
                                        onClick={() => {
                                            setCheckoutProduct(selectedDetailProduct);
                                            setCheckoutStep(1);
                                            setSelectedDetailProduct(null);
                                        }} 
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-cart-shopping"></i> Lanjut ke Pembelian
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CHECKOUT & PEMBELIAN */}
                    {checkoutProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="font-bold text-sm text-white truncate max-w-[250px]">Beli: {checkoutProduct.title}</h3>
                                    <button onClick={() => setCheckoutProduct(null)} className="text-slate-400 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                {checkoutStep === 1 && (
                                    <div className="space-y-3">
                                        <div className="bg-indigo-950/30 border border-indigo-500/20 p-2.5 rounded-xl text-xs text-indigo-300">
                                            Isi data pembeli di bawah ini untuk menerima akses e-book/produk digital Anda.
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-300 mb-1">Nama Lengkap *</label>
                                            <input type="text" placeholder="Masukkan nama lengkap" value={buyerName} onChange={e => setBuyerName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" required />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-300 mb-1">Email Aktif *</label>
                                            <input type="email" placeholder="contoh@email.com" value={buyerEmail} onChange={e => setBuyerEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" required />
                                        </div>
                                        <button onClick={() => { if(!buyerName || !buyerEmail) return showToast("⚠️ Isi nama dan email pembeli terlebih dahulu!"); setCheckoutStep(2); }} className="w-full bg-indigo-600 font-bold text-xs py-3 rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-500/20">Lanjut ke Pembayaran</button>
                                    </div>
                                )}

                                {checkoutStep === 2 && (
                                    <div className="space-y-3 text-xs">
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-indigo-500/50 transition">
                                            <input type="radio" checked={selectedPayment === 'bank'} onChange={() => setSelectedPayment('bank')} className="accent-indigo-500" />
                                            <div><strong>Transfer Bank BRI</strong></div>
                                        </label>
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-indigo-500/50 transition">
                                            <input type="radio" checked={selectedPayment === 'dana'} onChange={() => setSelectedPayment('dana')} className="accent-indigo-500" />
                                            <div><strong>Transfer DANA</strong></div>
                                        </label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCheckoutStep(1)} className="w-1/3 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl transition">Kembali</button>
                                            <button onClick={() => setCheckoutStep(3)} className="w-2/3 bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl transition">Lihat Rekening Pembayaran</button>
                                        </div>
                                    </div>
                                )}

                                {checkoutStep === 3 && (
                                    <div className="text-center space-y-4 text-xs">
                                        <div className="bg-amber-500/10 p-2.5 rounded-xl text-amber-300 font-bold border border-amber-500/20">Total Tagihan: {formatIDR(checkoutProduct.price)}</div>
                                        
                                        {selectedPayment === 'bank' ? (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left shadow-inner">
                                                <div className="text-[10px] text-slate-400">Transfer Bank BRI:</div>
                                                <div className="font-mono text-lg font-bold text-indigo-400 tracking-wider">{creator.bankBriNorek}</div>
                                                <div>a/n {creator.bankBriNama}</div>
                                            </div>
                                        ) : (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left shadow-inner">
                                                <div className="text-[10px] text-slate-400">Transfer DANA:</div>
                                                <div className="font-mono text-lg font-bold text-blue-400 tracking-wider">{creator.danaNomor}</div>
                                                <div>a/n {creator.danaNama}</div>
                                            </div>
                                        )}

                                       <button onClick={handleCheckoutWhatsApp} className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                                            <i className="fa-brands fa-whatsapp mr-1"></i> Konfirmasi Pembayaran (WhatsApp)
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT PRODUK */}
                    {editProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveProduct} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Produk Digital</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Produk</label>
                                    <input type="text" required value={editProduct.title} onChange={e => setEditProduct({...editProduct, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-slate-300 mb-1">Kategori</label>
                                        <select value={editProduct.category} onChange={e => setEditProduct({...editProduct, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500">
                                            <option value="E-Book">E-Book</option>
                                            <option value="Template">Template</option>
                                            <option value="Kursus/Video">Kursus/Video</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1">Harga (IDR)</label>
                                        <input type="number" required value={editProduct.price} onChange={e => setEditProduct({...editProduct, price: parseFloat(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Link Akses File (Drive/Notion)</label>
                                    <input type="url" required value={editProduct.downloadUrl} onChange={e => setEditProduct({...editProduct, downloadUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Cover Gambar</label>
                                    <input type="url" value={editProduct.coverUrl} onChange={e => setEditProduct({...editProduct, coverUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Deskripsi Singkat</label>
                                    <textarea rows="2" value={editProduct.description} onChange={e => setEditProduct({...editProduct, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Penjelasan Detail & Isi E-Book</label>
                                    <textarea rows="4" placeholder="• Bab 1: ...&#10;• Bab 2: ..." value={editProduct.details || ''} onChange={e => setEditProduct({...editProduct, details: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditProduct(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-indigo-600 hover:bg-indigo-500 transition font-bold py-2 rounded-xl">Simpan Produk</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL EDIT LINK BIO */}
                    {editLink && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveLink} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Tautan Bio</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Tautan</label>
                                    <input type="text" required value={editLink.title} onChange={e => setEditLink({...editLink, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Tujuan</label>
                                    <input type="url" required value={editLink.url} onChange={e => setEditLink({...editLink, url: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Teks Badge (Opsional)</label>
                                    <input type="text" value={editLink.badge} onChange={e => setEditLink({...editLink, badge: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" placeholder="Misal: BARU" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditLink(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-purple-600 hover:bg-purple-500 transition font-bold py-2 rounded-xl">Simpan Tautan</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
