<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk Digital - Link in Bio & Digital Storefront</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Konfigurasi Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff', 100: '#e5edff', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 900: '#312e81',
                        },
                        emerald: {
                            400: '#34d399', 500: '#10b981', 600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .glass-card-hover:hover { 
            background: rgba(30, 41, 59, 0.9); 
            border-color: rgba(99, 102, 241, 0.4); 
            transform: translateY(-2px); 
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        
        .loader {
            border-top-color: #6366f1;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // === INISIALISASI SUPABASE ===
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://cjwbrmolzxnhvigolcfk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqd2JybW9senhuaHZpZ29sY2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODQzMjYsImV4cCI6MjEwNTE2MDMyNn0.mbsRC05ibE0cbQrm2WpCbwOltcjy2aF1aguWRru9JSY'; 
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const DEFAULT_CREATOR = {
            id: 1,
            name: "Produk Digital",
            username: "agusdigital",
            verified: true,
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300",
            bio: "Berbagi template, e-book, dan kursus praktis untuk optimasi bisnis digital & creator economy.",
            whatsapp: "6282351544347",
            instagram: "https://instagram.com",
            tiktok: "https://tiktok.com",
            youtube: "https://youtube.com",
            bankBriNorek: "8801288293019",
            bankBriNama: "Agust Tommy",
            danaNomor: "082351544347",
            danaNama: "Agus Digital",
            qrisUrl: "",
            bonusTitle: "Dapatkan Bonus Eksklusif!",
            bonusDescription: "Bantu bagikan toko ini ke sosial media kamu untuk mendapatkan Produk Digital Gratis secara instan.",
            bonusUrl: "https://drive.google.com/drive/folders/ID_FOLDER_ATAU_FILE",
            visitorCount: 0,
            shareCount: 0
        };

        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        
        const formatWANumber = (num) => {
            if (!num) return "";
            let formatted = num.replace(/\D/g, '');
            if (formatted.startsWith('0')) {
                formatted = '62' + formatted.substring(1);
            }
            return formatted;
        };

        function App() {
            // State Utama
            const [isLoading, setIsLoading] = useState(true);
            const [creator, setCreator] = useState(DEFAULT_CREATOR);
            const [links, setLinks] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [products, setProducts] = useState([]);

            // State Navigasi & Admin
            const [viewMode, setViewMode] = useState('store'); 
            const [adminTab, setAdminTab] = useState('overview'); 
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            
            // State Form Login Admin
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            // State Toko & Detail Produk
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedDetailProduct, setSelectedDetailProduct] = useState(null); 
            const [checkoutProduct, setCheckoutProduct] = useState(null); 
            const [checkoutStep, setCheckoutStep] = useState(1);
            const [buyerName, setBuyerName] = useState('');
            const [buyerEmail, setBuyerEmail] = useState('');
            const [buyerPhone, setBuyerPhone] = useState('');
            const [selectedPayment, setSelectedPayment] = useState('bank');
            const [toastMessage, setToastMessage] = useState(null);

            // State Modal Edit
            const [editProduct, setEditProduct] = useState(null);
            const [editLink, setEditLink] = useState(null);
            
            // State Fitur Bonus & Verifikasi Share
            const [isBonusUnlocked, setIsBonusUnlocked] = useState(false);
            const [showShareModal, setShowShareModal] = useState(false);

            // Fungsi Notifikasi
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Caption Viral Berantai
            const getViralCaption = () => {
                const storeUrl = window.location.href;
                return `🎁 *GRATIS! Akses Produk Digital Eksklusif dari ${creator.name}* 🚀\n\nSaya baru saja mengklaim bonus produk digital secara GRATIS!\n\nKamu juga bisa dapatkan sekarang:\n1. Klik link toko: ${storeUrl}\n2. Bagikan pesan ini ke teman/sosmed kamu\n3. Langsung unduh bonusnya!\n\n⚡ *Bantu bagikan ke yang lain agar semua bisa dapat bonus gratisnya!*`;
            };

            // Fetch Data saat komponen dimuat
            useEffect(() => {
                async function fetchAllData() {
                    setIsLoading(true);
                    try {
                        const { data: { session } } = await supabaseClient.auth.getSession();
                        if (session) {
                            setIsAdminUnlocked(true);
                        }

                        const { data: creatorData } = await supabaseClient.from('creator').select('*').eq('id', 1).single();
                        
                        if (creatorData) {
                            if (!localStorage.getItem('hasVisited')) {
                                const newVisitorCount = (creatorData.visitorCount || 0) + 1;
                                await supabaseClient.from('creator')
                                    .update({ visitorCount: newVisitorCount })
                                    .eq('id', 1);
                                setCreator({ ...creatorData, visitorCount: newVisitorCount });
                                localStorage.setItem('hasVisited', 'true');
                            } else {
                                setCreator(creatorData);
                            }
                        }

                        const { data: prodData } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
                        if (prodData) setProducts(prodData);

                        const { data: linkData } = await supabaseClient.from('links').select('*');
                        if (linkData) setLinks(linkData);

                        const { data: txData } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                        if (txData) setTransactions(txData);
                    } catch (error) {
                        console.error("Terjadi kesalahan saat memuat data:", error);
                        showToast("⚠️ Gagal memuat data dari server, menampilkan data default.");
                    } finally {
                        setIsLoading(false);
                    }
                }
                fetchAllData();
            }, []);

            // Login Admin
            const handleLoginAdmin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showToast("❌ Login Gagal: " + error.message);
                } else {
                    setIsAdminUnlocked(true);
                    setViewMode('admin');
                    setEmail('');
                    setPassword('');
                    showToast("🔓 Akses Admin Diberikan!");
                }
                setIsLoading(false);
            };

            // Logout Admin
            const handleLogoutAdmin = async () => {
                await supabaseClient.auth.signOut();
                setIsAdminUnlocked(false);
                setViewMode('store');
                showToast("🔒 Anda telah keluar.");
            };

            // Simpan Profil
            const handleSaveCreator = async (e) => {
                e.preventDefault();
                const creatorToSave = { ...creator, id: 1, whatsapp: formatWANumber(creator.whatsapp) };
                const { error } = await supabaseClient.from('creator').upsert(creatorToSave);
                if (!error) {
                    setCreator(creatorToSave);
                    showToast("✅ Pengaturan Profil & Rekening Berhasil Disimpan!");
                } else {
                    console.error("Error Profil:", error);
                    showToast("❌ Gagal: " + error.message);
                }
            };

            // Simpan Produk
            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (editProduct.id && !editProduct.id.toString().startsWith('prod-')) {
                    const { error } = await supabaseClient.from('products').update(editProduct).eq('id', editProduct.id);
                    if (!error) {
                        setProducts(products.map(p => p.id === editProduct.id ? editProduct : p));
                        showToast("✅ Produk Diperbarui!");
                    } else {
                        showToast("❌ Gagal Update Produk: " + error.message);
                    }
                } else {
                    const newProduct = { ...editProduct, salesCount: 0, rating: 5.0 };
                    delete newProduct.id;
                    const { data, error } = await supabaseClient.from('products').insert([newProduct]).select();
                    if (!error && data) {
                        setProducts([data[0], ...products]);
                        showToast("🎉 Produk Baru Diterbitkan!");
                    } else {
                        showToast("❌ Gagal Tambah Produk: " + error.message);
                    }
                }
                setEditProduct(null);
            };

            // Hapus Produk
            const handleDeleteProduct = async (id) => {
                if (confirm("Hapus produk ini secara permanen?")) {
                    const { error } = await supabaseClient.from('products').delete().eq('id', id);
                    if (!error) {
                        setProducts(products.filter(p => p.id !== id));
                        showToast("🗑️ Produk Dihapus.");
                    }
                }
            };

            // Simpan Tautan (Link Bio)
            const handleSaveLink = async (e) => {
                e.preventDefault();
                if (editLink.id) {
                    const { error } = await supabaseClient.from('links').update(editLink).eq('id', editLink.id);
                    if (!error) {
                        setLinks(links.map(l => l.id === editLink.id ? editLink : l));
                        showToast("✅ Tautan Diperbarui!");
                    } else {
                        showToast("❌ Gagal Update Link: " + error.message);
                    }
                } else {
                    const newLink = { ...editLink, id: `link-${Date.now()}` };
                    const { error } = await supabaseClient.from('links').insert([newLink]);
                    if (!error) {
                        setLinks([...links, newLink]);
                        showToast("🎉 Tautan Baru Dibuat!");
                    } else {
                        showToast("❌ Gagal Tambah Link: " + error.message);
                    }
                }
                setEditLink(null);
            };

            // Hapus Tautan
            const handleDeleteLink = async (id) => {
                if (confirm("Hapus tautan ini?")) {
                    const { error } = await supabaseClient.from('links').delete().eq('id', id);
                    if (!error) {
                        setLinks(links.filter(l => l.id !== id));
                        showToast("🗑️ Tautan Dihapus.");
                    }
                }
            };

            // Transaksi Checkout
            const saveTransactionToDB = async (status, paymentMethod) => {
                const newTx = {
                    id: `INV-${Date.now().toString().slice(-6)}`,
                    buyerName: buyerName,
                    buyerEmail: buyerEmail,
                    buyerPhone: buyerPhone || "-",
                    productTitle: checkoutProduct.title,
                    amount: checkoutProduct.price,
                    paymentMethod: paymentMethod,
                    date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
                    status: status,
                    downloadUrl: checkoutProduct.downloadUrl
                };

                await supabaseClient.from('transactions').insert([newTx]);
                setTransactions([newTx, ...transactions]);

                const updatedSales = (checkoutProduct.salesCount || 0) + 1;
                await supabaseClient.from('products').update({ salesCount: updatedSales }).eq('id', checkoutProduct.id);
                setProducts(products.map(p => p.id === checkoutProduct.id ? { ...p, salesCount: updatedSales } : p));
                
                return newTx;
            };

            const handleCheckoutWhatsApp = async () => {
                const paymentMethodStr = selectedPayment === 'bank' ? 'BANK BRI' : 'DANA';
                await saveTransactionToDB("Menunggu Konfirmasi", paymentMethodStr);
                
                const adminWA = formatWANumber(creator.whatsapp);
                const text = `Halo Admin ${creator.name}, saya telah melunasi pembayaran: \n\n*Produk:* ${checkoutProduct.title}\n*Total:* ${formatIDR(checkoutProduct.price)}\n*Metode:* ${paymentMethodStr}\n*Nama:* ${buyerName}\n*Email:* ${buyerEmail}\n\nMohon kirimkan aksesnya, terima kasih!`;
                window.open(`https://wa.me/${adminWA}?text=${encodeURIComponent(text)}`, '_blank');
                setCheckoutProduct(null);
            };
            
            // Konfirmasi Pesanan Admin
            const handleCompleteOrder = async (txId) => {
                const { error } = await supabaseClient
                    .from('transactions')
                    .update({ status: 'Selesai' })
                    .eq('id', txId);
                
                if (!error) {
                    setTransactions(transactions.map(tx => 
                        tx.id === txId ? { ...tx, status: 'Selesai' } : tx
                    ));
                    showToast("✅ Status pesanan berhasil diperbarui menjadi Selesai!");
                } else {
                    showToast("❌ Gagal memperbarui status pesanan.");
                }
            }; 
            
            // Trigger Buka Aplikasi Social Media & Buka Modal Konfirmasi
            const handleShareViral = async (platform) => {
                const storeUrl = window.location.href;
                const captionText = getViralCaption();
                
                try {
                    if (platform === 'wa') {
                        window.open(`https://wa.me/?text=${encodeURIComponent(captionText)}`, '_blank');
                    } else if (platform === 'fb') {
                        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(storeUrl)}`, '_blank');
                    } else if (platform === 'ig') {
                        await navigator.clipboard.writeText(captionText);
                        showToast("✅ Caption disalin! Silakan tempel di Story/Bio IG.");
                        setTimeout(() => window.open(`https://instagram.com`, '_blank'), 1000);
                    } else if (platform === 'copy') {
                        await navigator.clipboard.writeText(captionText);
                        showToast("✅ Teks viral & link berhasil disalin!");
                    }

                    setShowShareModal(true);
                } catch (err) {
                    showToast("❌ Gagal menyalin pesan.");
                }
            };

            // Eksekusi Konfirmasi Share (Membuka Akses Bonus)
            const handleConfirmShare = async () => {
                const newShareCount = (creator.shareCount || 0) + 1;
                await supabaseClient.from('creator')
                    .update({ shareCount: newShareCount })
                    .eq('id', 1);
                
                setCreator(prev => ({ ...prev, shareCount: newShareCount }));
                setIsBonusUnlocked(true);
                setShowShareModal(false);
                showToast("🎉 Terima kasih! Bonus Eksklusif berhasil dibuka.");
            };

            const totalRevenue = useMemo(() => transactions.reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [transactions]);
            
            const filteredProducts = useMemo(() => {
                let result = products;
                if (selectedCategory !== 'Semua') {
                    result = result.filter(p => p.category === selectedCategory);
                }
                if (searchQuery.trim() !== '') {
                    result = result.filter(p => 
                        p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        (p.description && p.description.toLowerCase().includes(searchQuery.toLowerCase()))
                    );
                }
                return result;
            }, [products, selectedCategory, searchQuery]);

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950">
                        <div className="flex flex-col items-center gap-4">
                            <div className="loader ease-linear rounded-full border-4 border-t-4 border-slate-800 h-12 w-12 mb-4"></div>
                            <p className="text-slate-400 font-medium text-sm animate-pulse">Memuat data platform...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    {/* HEADER */}
                    <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 py-3 px-4 shadow-xl">
                        <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">
                                    {creator.name.charAt(0).toUpperCase()}
                                </div>
                                <span className="font-bold text-sm text-white">{creator.name} Platform</span>
                            </div>

                            <div className="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
                                <button onClick={() => setViewMode('store')} className={`px-4 py-1.5 rounded-lg text-xs font-semibold ${viewMode === 'store' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                    <i className="fa-solid fa-store mr-1.5"></i>Toko
                                </button>
                                <button onClick={() => { if(isAdminUnlocked) setViewMode('admin'); else setViewMode('pin_prompt'); }} className={`px-4 py-1.5 rounded-lg text-xs font-semibold ${viewMode === 'admin' || viewMode === 'pin_prompt' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                    <i className="fa-solid fa-lock mr-1.5"></i>Admin
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* TOAST MESSAGE */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-800 text-white border border-indigo-500/50 px-5 py-3 rounded-xl shadow-2xl text-xs font-semibold transform transition-all duration-300 translate-y-0 opacity-100 flex items-center gap-2">
                            <i className="fa-solid fa-bell text-indigo-400"></i>
                            {toastMessage}
                        </div>
                    )}

                    <main className="flex-grow">
                        {/* VIEW: LOGIN ADMIN */}
                        {viewMode === 'pin_prompt' && (
                            <div className="max-w-sm mx-auto my-20 px-4">
                                <form onSubmit={handleLoginAdmin} className="glass-card p-6 rounded-2xl text-center space-y-4">
                                    <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
                                        <i className="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <h2 className="text-base font-bold text-white">Login Admin</h2>
                                    <p className="text-xs text-slate-400">Masukkan email dan sandi Supabase Anda</p>
                                    
                                    <input type="email" placeholder="Email Admin" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-indigo-500" required />
                                    <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-indigo-500" required />
                                    
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-xs py-3 rounded-xl transition">Buka Dashboard</button>
                                </form>
                            </div>
                        )}

                        {/* VIEW: STOREFRONT */}
                        {viewMode === 'store' && (
                            <div className="max-w-md mx-auto min-h-screen pb-20 px-4 pt-6">
                                <div className="text-center flex flex-col items-center mb-6">
                                    <img src={creator.avatar} className="w-24 h-24 rounded-full object-cover ring-4 ring-indigo-500/40 p-1 bg-slate-900 mb-3 shadow-lg shadow-indigo-500/20" alt="Creator Avatar" />
                                    <h1 className="text-xl font-bold text-white flex items-center gap-1.5">{creator.name} {creator.verified && <i className="fa-solid fa-circle-check text-indigo-400 text-sm"></i>}</h1>
                                    <p className="text-xs text-indigo-400 font-medium mb-3">@{creator.username}</p>
                                    <p className="text-xs text-slate-300 leading-relaxed max-w-xs mb-4">{creator.bio}</p>
                                    <div className="flex gap-3">
                                        {creator.instagram && <a href={creator.instagram} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-pink-400 hover:-translate-y-1 transition"><i className="fa-brands fa-instagram"></i></a>}
                                        {creator.tiktok && <a href={creator.tiktok} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:-translate-y-1 transition"><i className="fa-brands fa-tiktok"></i></a>}
                                        {creator.youtube && <a href={creator.youtube} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-red-400 hover:-translate-y-1 transition"><i className="fa-brands fa-youtube"></i></a>}
                                        {creator.whatsapp && <a href={`https://wa.me/${formatWANumber(creator.whatsapp)}`} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-emerald-400 hover:-translate-y-1 transition"><i className="fa-brands fa-whatsapp"></i></a>}
                                    </div>
                                    
                                    <div className="flex gap-4 mt-5 pt-4 border-t border-slate-800/80 w-full justify-center text-xs text-slate-400 font-medium">
                                        <div className="flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                                            <i className="fa-solid fa-eye text-indigo-400"></i> {creator.visitorCount || 0} Pengunjung
                                        </div>
                                        <div className="flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                                            <i className="fa-solid fa-share-nodes text-pink-400"></i> {creator.shareCount || 0} Dibagikan
                                        </div>
                                    </div>
                                </div>

                                {/* AREA BONUS SPESIAL */}
                                <div className="mb-8 glass-card p-4 rounded-2xl border border-indigo-500/40 bg-indigo-950/30 text-center relative overflow-hidden shadow-[0_0_15px_rgba(99,102,241,0.15)]">

                                                                        <button 
                                                                            onClick={() => handleCompleteOrder(tx.id)}
                                                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-[10px] whitespace-nowrap flex items-center transition"
                                                                        >
                                                                            <i className="fa-solid fa-check mr-1"></i> Tandai Selesai
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="text-center py-6 text-slate-500 text-xs italic">Belum ada riwayat pesanan.</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL KONFIRMASI SHARE VIRAL */}
                    {showShareModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl text-center">
                                <div className="w-12 h-12 bg-pink-500/20 text-pink-400 rounded-full flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-paper-plane"></i>
                                </div>
                                <h3 className="font-bold text-base text-white">Langkah Terakhir: Konfirmasi Share</h3>
                                <p className="text-xs text-slate-300">
                                    Pastikan Anda telah membagikan pesan di bawah ini ke sosial media Anda agar orang lain juga ikut mengklaim produk digital gratis!
                                </p>
                                
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-left text-[11px] text-slate-300 relative">
                                    <pre className="whitespace-pre-wrap font-sans leading-relaxed">{getViralCaption()}</pre>
                                    <button 
                                        onClick={async () => {
                                            await navigator.clipboard.writeText(getViralCaption());
                                            showToast("📋 Caption viral berhasil disalin!");
                                        }}
                                        className="mt-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[10px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1"
                                    >
                                        <i className="fa-solid fa-copy"></i> Salin Caption
                                    </button>
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setShowShareModal(false)} className="w-1/3 bg-slate-800 hover:bg-slate-700 text-xs py-2.5 rounded-xl transition">Batal</button>
                                    <button onClick={handleConfirmShare} className="w-2/3 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 font-bold text-xs py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">
                                        <i className="fa-solid fa-check mr-1"></i> Saya Sudah Membagikan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DETAIL PRODUK */}
                    {selectedDetailProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto relative">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 sticky top-0 bg-slate-900 z-10 pt-2">
                                    <span className="text-xs font-bold uppercase text-indigo-400 tracking-wider"><i className="fa-solid fa-book-open mr-1.5"></i> Detail Produk</span>
                                    <button onClick={() => setSelectedDetailProduct(null)} className="text-slate-400 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <div className="space-y-3">
                                    <img src={selectedDetailProduct.coverUrl} className="w-full h-48 object-cover rounded-xl border border-slate-800" alt={selectedDetailProduct.title} />
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full font-bold">{selectedDetailProduct.category}</span>
                                        <span className="text-lg font-extrabold text-emerald-400">{formatIDR(selectedDetailProduct.price)}</span>
                                    </div>
                                    <h2 className="text-base font-bold text-white">{selectedDetailProduct.title}</h2>
                                    
                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs">
                                        <h4 className="font-semibold text-slate-300 mb-1"><i className="fa-solid fa-circle-info text-indigo-400 mr-1"></i> Penjelasan Produk</h4>
                                        <p className="text-slate-400 leading-relaxed">{selectedDetailProduct.description || 'Tidak ada deskripsi singkat.'}</p>
                                    </div>

                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs">
                                        <h4 className="font-semibold text-slate-300 mb-2"><i className="fa-solid fa-list-check text-emerald-400 mr-1"></i> Isi & Materi Pembelajaran</h4>
                                        <div className="text-slate-300 whitespace-pre-line leading-relaxed bg-slate-900/80 p-3 rounded-lg border border-slate-800/80 font-sans">
                                            {selectedDetailProduct.details || "• Bab 1: Pengenalan & Konsep Dasar\n• Bab 2: Langkah Strategis & Implementasi\n• Bab 3: Studi Kasus & Template Praktis\n• Bab 4: Panduan Optimasi Akhir\n• Bonus: Modul Tambahan & Resources"}
                                        </div>
                                    </div>

                                    <div className="bg-indigo-950/40 border border-indigo-500/30 p-3.5 rounded-xl flex items-center justify-between">
                                        <div>
                                            <span className="text-[10px] text-indigo-300 block uppercase font-bold">Keranjang Pembelian</span>
                                            <span className="text-xs text-slate-300">1 Item: <strong>{selectedDetailProduct.title}</strong></span>
                                        </div>
                                        <span className="text-sm font-extrabold text-emerald-400">{formatIDR(selectedDetailProduct.price)}</span>
                                    </div>

                                    <button 
                                        onClick={() => {
                                            setCheckoutProduct(selectedDetailProduct);
                                            setCheckoutStep(1);
                                            setSelectedDetailProduct(null);
                                        }} 
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-cart-shopping"></i> Lanjut ke Pembelian
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CHECKOUT & PEMBELIAN */}
                    {checkoutProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="font-bold text-sm text-white truncate max-w-[250px]">Beli: {checkoutProduct.title}</h3>
                                    <button onClick={() => setCheckoutProduct(null)} className="text-slate-400 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                {checkoutStep === 1 && (
                                    <div className="space-y-3">
                                        <div className="bg-indigo-950/30 border border-indigo-500/20 p-2.5 rounded-xl text-xs text-indigo-300">
                                            Isi data pembeli di bawah ini untuk menerima akses e-book/produk digital Anda.
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-300 mb-1">Nama Lengkap *</label>
                                            <input type="text" placeholder="Masukkan nama lengkap" value={buyerName} onChange={e => setBuyerName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" required />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-300 mb-1">Email Aktif *</label>
                                            <input type="email" placeholder="contoh@email.com" value={buyerEmail} onChange={e => setBuyerEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" required />
                                        </div>
                                        <button onClick={() => { if(!buyerName || !buyerEmail) return showToast("⚠️ Isi nama dan email pembeli terlebih dahulu!"); setCheckoutStep(2); }} className="w-full bg-indigo-600 font-bold text-xs py-3 rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-500/20">Lanjut ke Pembayaran</button>
                                    </div>
                                )}

                                {checkoutStep === 2 && (
                                    <div className="space-y-3 text-xs">
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-indigo-500/50 transition">
                                            <input type="radio" checked={selectedPayment === 'bank'} onChange={() => setSelectedPayment('bank')} className="accent-indigo-500" />
                                            <div><strong>Transfer Bank BRI</strong></div>
                                        </label>
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-indigo-500/50 transition">
                                            <input type="radio" checked={selectedPayment === 'dana'} onChange={() => setSelectedPayment('dana')} className="accent-indigo-500" />
                                            <div><strong>Transfer DANA</strong></div>
                                        </label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCheckoutStep(1)} className="w-1/3 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl transition">Kembali</button>
                                            <button onClick={() => setCheckoutStep(3)} className="w-2/3 bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl transition">Lihat Rekening Pembayaran</button>
                                        </div>
                                    </div>
                                )}

                                {checkoutStep === 3 && (
                                    <div className="text-center space-y-4 text-xs">
                                        <div className="bg-amber-500/10 p-2.5 rounded-xl text-amber-300 font-bold border border-amber-500/20">Total Tagihan: {formatIDR(checkoutProduct.price)}</div>
                                        
                                        {selectedPayment === 'bank' ? (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left shadow-inner">
                                                <div className="text-[10px] text-slate-400">Transfer Bank BRI:</div>
                                                <div className="font-mono text-lg font-bold text-indigo-400 tracking-wider">{creator.bankBriNorek}</div>
                                                <div>a/n {creator.bankBriNama}</div>
                                            </div>
                                        ) : (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left shadow-inner">
                                                <div className="text-[10px] text-slate-400">Transfer DANA:</div>
                                                <div className="font-mono text-lg font-bold text-blue-400 tracking-wider">{creator.danaNomor}</div>
                                                <div>a/n {creator.danaNama}</div>
                                            </div>
                                        )}

                                       <button onClick={handleCheckoutWhatsApp} className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                                            <i className="fa-brands fa-whatsapp mr-1"></i> Konfirmasi Pembayaran (WhatsApp)
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT PRODUK */}
                    {editProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveProduct} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Produk Digital</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Produk</label>
                                    <input type="text" required value={editProduct.title} onChange={e => setEditProduct({...editProduct, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-slate-300 mb-1">Kategori</label>
                                        <select value={editProduct.category} onChange={e => setEditProduct({...editProduct, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500">
                                            <option value="E-Book">E-Book</option>
                                            <option value="Template">Template</option>
                                            <option value="Kursus/Video">Kursus/Video</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1">Harga (IDR)</label>
                                        <input type="number" required value={editProduct.price} onChange={e => setEditProduct({...editProduct, price: parseFloat(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Link Akses File (Drive/Notion)</label>
                                    <input type="url" required value={editProduct.downloadUrl} onChange={e => setEditProduct({...editProduct, downloadUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Cover Gambar</label>
                                    <input type="url" value={editProduct.coverUrl} onChange={e => setEditProduct({...editProduct, coverUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Deskripsi Singkat</label>
                                    <textarea rows="2" value={editProduct.description} onChange={e => setEditProduct({...editProduct, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Penjelasan Detail & Isi E-Book</label>
                                    <textarea rows="4" placeholder="• Bab 1: ...&#10;• Bab 2: ..." value={editProduct.details || ''} onChange={e => setEditProduct({...editProduct, details: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditProduct(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-indigo-600 hover:bg-indigo-500 transition font-bold py-2 rounded-xl">Simpan Produk</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL EDIT LINK BIO */}
                    {editLink && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveLink} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Tautan Bio</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Tautan</label>
                                    <input type="text" required value={editLink.title} onChange={e => setEditLink({...editLink, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Tujuan</label>
                                    <input type="url" required value={editLink.url} onChange={e => setEditLink({...editLink, url: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Teks Badge (Opsional)</label>
                                    <input type="text" value={editLink.badge} onChange={e => setEditLink({...editLink, badge: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" placeholder="Misal: BARU" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditLink(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-purple-600 hover:bg-purple-500 transition font-bold py-2 rounded-xl">Simpan Tautan</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
