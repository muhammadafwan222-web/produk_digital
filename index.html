            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);

            // Checkout State
            const [checkoutProduct, setCheckoutProduct] = useState(null);
            const [checkoutStep, setCheckoutStep] = useState(1); // 1: Info, 2: Payment Selector, 3: Processing/Pay, 4: Success

            const [buyerName, setBuyerName] = useState('');

                tempInput.value = link;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast("✅ Link toko berhasil disalin ke clipboard!");
            };

            const handleBuyClick = (product) => {
                setCheckoutProduct(product);
                setCheckoutStep(1);
                setTimeLeft(900);
            };

                    buyerName: buyerName || "Pembeli Baru",
                    buyerEmail: buyerEmail || "pembeli@gmail.com",

                    productTitle: checkoutProduct.title,
                    amount: checkoutProduct.price,
                    paymentMethod: selectedPayment.toUpperCase(),
                    date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    status: "Lunas & Terkirim",
                    downloadUrl: checkoutProduct.downloadUrl,
                    fileType: checkoutProduct.fileType
                };

                // Add to transactions
                setTransactions([newTx, ...transactions]);
                
                // Update product sales count
                setProducts(products.map(p => {
                    if (p.id === checkoutProduct.id) {
                        return { ...p, salesCount: p.salesCount + 1 };

                    return p;
                }));

                setCheckoutStep(4); // Move to Success Screen
                
                // Show automatic simulated email delivery alert after a brief delay
                setTimeout(() => {
                    setIsEmailSimModalOpen(true);
                }, 800);
            };

            const handleCreateProduct = (e) => {
                e.preventDefault();
                if (!newProd.title || !newProd.price || !newProd.downloadUrl) {
                    showToast("❌ Harap isi semua bidang wajib!");
                    return;

                    id: `prod-${Date.now()}`,
                    title: newProd.title,
                    category: newProd.category,
                    price: parseFloat(newProd.price),

                                        </a>

                                        </div>

                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Harga (IDR) *</label>
                                            <input
                                                type="number"
                                                required
                                                placeholder="99000"
                                                value={newProd.price}
                                                onChange={e => setNewProd({ ...newProd, price: e.target.value })}
                                                className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-xs text-white outline-none transition"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-300 mb-1">
                                            Link Unduh / Akses File Digital * <span className="text-[10px] text-indigo-400">(Google Drive, Notion, Canva, dll)</span>
                                        </label>
                                        <input
                                            type="url"
                                            required
                                            placeholder="https://drive.google.com/file/d/..."
                                            value={newProd.downloadUrl}
                                            onChange={e => setNewProd({ ...newProd, downloadUrl: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-xs text-white outline-none transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-300 mb-1">URL Gambar Cover (Opsional)</label>
                                        <input
                                            type="url"
                                            placeholder="https://images.unsplash.com/..."
                                            value={newProd.coverUrl}
                                            onChange={e => setNewProd({ ...newProd, coverUrl: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-xs text-white outline-none transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-300 mb-1">Deskripsi Singkat Produk</label>
                                        <textarea
                                            rows="3"
                                            placeholder="Jelaskan manfaat dan isi file produk digital ini..."
                                            value={newProd.description}
                                            onChange={e => setNewProd({ ...newProd, description: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-xs text-white outline-none transition"
                                        ></textarea>
                                    </div>

                                    <div className="pt-2 flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsAddProductOpen(false)}
                                            className="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs py-2.5 rounded-xl transition"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition"
                                        >
                                            Terbitkan Produk
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SIMULATED EMAIL NOTIFICATION MODAL */}
                    {isEmailSimModalOpen && lastCompletedTx && (
                        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl w-full max-w-sm p-5 shadow-2xl animate-bounce-short text-left space-y-3">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                    <div className="flex items-center gap-2 text-xs font-bold text-indigo-400">
                                        <i className="fa-solid fa-paper-plane"></i>
                                        <span>Pengiriman Email Otomatis</span>
                                    </div>
                                    <button onClick={() => setIsEmailSimModalOpen(false)} className="text-slate-400 text-xs">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="text-xs text-slate-300 space-y-1">
                                    <p><strong className="text-slate-400">Kepada:</strong> {lastCompletedTx.buyerEmail}</p>
                                    <p><strong className="text-slate-400">Subjek:</strong> [Akses Produk] {lastCompletedTx.productTitle}</p>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300 leading-relaxed">
                                    Halo <strong>{lastCompletedTx.buyerName}</strong>,<br/>
                                    Pembayaran sebesar <strong>{formatIDR(lastCompletedTx.amount)}</strong> untuk transaksi <strong>{lastCompletedTx.id}</strong> telah diterima lunas.<br/><br/>
                                    Silakan akses/unduh produk digital kamu melalui tombol di bawah:
                                    <a
                                        href={lastCompletedTx.downloadUrl}
                                        target="_blank"
                                        className="mt-2 block text-center bg-indigo-600 text-white font-bold py-1.5 rounded-lg text-xs hover:bg-indigo-500 transition"
                                    >
                                        Buka Link Akses Digital
                                    </a>
                                </div>

                                <button
                                    onClick={() => setIsEmailSimModalOpen(false)}
                                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2 rounded-lg font-semibold transition"
                                >
                                    Tutup Notifikasi Email
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
