        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        
        const formatWANumber = (num) => {
            if (!num) return "";
            let formatted = num.replace(/\D/g, '');
            if (formatted.startsWith('0')) {
                formatted = '62' + formatted.substring(1);
            }
            return formatted;
        };

        // ===== BLOG ENGINE: Blogger/Blogspot XML compatible =====
        const escapeHtml = (value = '') => String(value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

        const slugify = (text = '') => String(text).toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-')
            .replace(/-+/g, '-').slice(0, 90);

        const plainTextFromHtml = (html = '') => {
            const el = document.createElement('div');
            el.innerHTML = html;
            return (el.textContent || el.innerText || '').replace(/\s+/g, ' ').trim();
        };

        const getFirstImage = (html = '') => {
            const m = String(html).match(/<img[^>]+src=["']([^"']+)["']/i);
            return m ? m[1] : '';
        };

        const sanitizeHtml = (html = '') => {
            const doc = new DOMParser().parseFromString(`<div id="safe-root">${html}</div>`, 'text/html');
            doc.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form,input,textarea,button').forEach(n => n.remove());
            doc.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    const n = attr.name.toLowerCase();
                    const v = attr.value || '';
                    if (n.startsWith('on') || n === 'srcdoc' || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(v))) {
                        el.removeAttribute(attr.name);
                    }
                });
                if (el.tagName === 'A') {
                    const href = el.getAttribute('href') || '';
                    if (href && !/^(https?:|mailto:|tel:|\/|#)/i.test(href)) el.removeAttribute('href');
                    el.setAttribute('target','_blank');
                    el.setAttribute('rel','noopener noreferrer nofollow');
                }
            });
            return doc.querySelector('#safe-root')?.innerHTML || '';
        };

        const extractBloggerEntries = (xmlText) => {
            const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
            const parserError = xml.querySelector('parsererror');
            if (parserError) throw new Error('File XML tidak valid.');
            const entries = [...xml.getElementsByTagName('entry')];
            const posts = [];
            entries.forEach((entry, index) => {
                const title = entry.getElementsByTagName('title')[0]?.textContent?.trim() || '';
                const contentNode = entry.getElementsByTagName('content')[0];
                const content = contentNode?.textContent || '';
                const typeNode = [...entry.getElementsByTagName('category')].find(c => (c.getAttribute('scheme') || '').includes('kind') && c.getAttribute('term')?.includes('#post'));
                const hasPostCategory = !!typeNode;
                if (!title && !content) return;
                if (entries.length > 0 && !hasPostCategory && !content) return;
                const legacyId = entry.getElementsByTagName('id')[0]?.textContent?.trim() || `xml-${index}`;
                const published = entry.getElementsByTagName('published')[0]?.textContent?.trim() || entry.getElementsByTagName('updated')[0]?.textContent?.trim() || new Date().toISOString();
                const updated = entry.getElementsByTagName('updated')[0]?.textContent?.trim() || published;
                const author = entry.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent?.trim() || 'Admin';
                const labels = [...entry.getElementsByTagName('category')].map(c => c.getAttribute('term')).filter(Boolean).filter(term => !term.includes('#'));
                const clean = sanitizeHtml(content);
                posts.push({
                    legacy_id: legacyId,
                    title: title || 'Tanpa Judul',
                    slug: slugify(title) || `artikel-${index + 1}`,
                    content_html: clean,
                    excerpt: plainTextFromHtml(clean).slice(0, 220),
                    cover_url: getFirstImage(clean),
                    author_name: author,
                    published_at: new Date(published).toISOString(),
                    updated_at: new Date(updated).toISOString(),
                    status: (() => {
                        const draftNode = entry.getElementsByTagName('app:draft')[0] || entry.getElementsByTagName('draft')[0];
                        return draftNode?.textContent?.trim().toLowerCase() === 'yes' ? 'draft' : 'published';
                    })(),
                    labels,
                });
            });
            return posts;
        };

        function App() {
            // State Utama

            const [creator, setCreator] = useState(DEFAULT_CREATOR);

            // State Form Login Admin
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            // State Toko & Detail Produk
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedDetailProduct, setSelectedDetailProduct] = useState(null);

            const [checkoutStep, setCheckoutStep] = useState(1);
            const [buyerName, setBuyerName] = useState('');
            const [buyerEmail, setBuyerEmail] = useState('');
            const [buyerPhone, setBuyerPhone] = useState('');
            const [selectedPayment, setSelectedPayment] = useState('bank');
            const [toastMessage, setToastMessage] = useState(null);

            // State Modal Edit
            const [editProduct, setEditProduct] = useState(null);
            const [editLink, setEditLink] = useState(null);
            
            // State Fitur Bonus & Verifikasi Share
            const [isBonusUnlocked, setIsBonusUnlocked] = useState(false);
            const [showShareModal, setShowShareModal] = useState(false);

            // Fungsi Notifikasi
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Caption Viral Berantai
            const getViralCaption = () => {
                const storeUrl = window.location.href;
                return `🎁 *GRATIS! Akses Produk Digital Eksklusif dari ${creator.name}* 🚀\n\nSaya baru saja mengklaim bonus produk digital secara GRATIS!\n\nKamu juga bisa dapatkan sekarang:\n1. Klik link toko: ${storeUrl}\n2. Bagikan pesan ini ke teman/sosmed kamu\n3. Langsung unduh bonusnya!\n\n⚡ *Bantu bagikan ke yang lain agar semua bisa dapat bonus gratisnya!*`;
            };

            // Fetch Data saat komponen dimuat
            useEffect(() => {
                async function fetchAllData() {
                    setIsLoading(true);
                    try {
                        const { data: { session } } = await supabaseClient.auth.getSession();
                        if (session) {
                            setIsAdminUnlocked(true);
                        }

                        const { data: creatorData } = await supabaseClient.from('creator').select('*').eq('id', 1).single();
                        
                        if (creatorData) {
                            // PERBAIKAN: Menggunakan sessionStorage agar pengunjung valid bertambah jika membuka sesi baru
                            if (!sessionStorage.getItem('hasVisitedThisSession')) {
                                // Ambil angka pengunjung paling terbaru di DB untuk mencegah bentrok

                        const { data: linkData } = await supabaseClient.from('links').select('*');
                        if (linkData) setLinks(linkData);

                        const { data: txData } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                        if (txData) setTransactions(txData);

                        const { data: blogData } = await supabaseClient.from('blog_posts')

                    } finally {
                        setIsLoading(false);
                    }
                }
                fetchAllData();
            }, []);

            // URL hash membuat artikel mudah dibagikan seperti permalink Blogspot.
            useEffect(() => {
                const openFromHash = () => {
                    const hash = window.location.hash.replace(/^#/, '');

            useEffect(() => {
                if (adminTab === 'blog' && isAdminUnlocked) {

                        .then(({data}) => setPendingComments(data || []));

            }, [adminTab, isAdminUnlocked]);

            const moderateComment = async (commentId, approved) => {

            // Login Admin
            const handleLoginAdmin = async (e) => {

                await supabaseClient.from('transactions').insert([newTx]);

                await supabaseClient.from('products').update({ salesCount: updatedSales }).eq('id', checkoutProduct.id);

                        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(storeUrl)}`, '_blank');
                    } else if (platform === 'ig') {
                        await navigator.clipboard.writeText(captionText);

                        setTimeout(() => window.open(`https://instagram.com`, '_blank'), 1000);

                    const imported = extractBloggerEntries(text);
                    if (!imported.length) throw new Error('Tidak menemukan posting artikel dalam XML.');
                    const used = new Set();
                    const posts = imported.map((p, i) => {
                        let s = p.slug || `artikel-${i+1}`;
                        while (used.has(s)) s = `${p.slug}-${i+1}`;
                        used.add(s);
                        return {...p, slug:s};

                    const { error } = await supabaseClient.from('blog_posts').upsert(posts, { onConflict:'legacy_id' });

                    const { data: fresh } = await supabaseClient.from('blog_posts').select('*').eq('status','published').order('published_at',{ascending:false});

                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveLink} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Tautan Bio</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Tautan</label>
                                    <input type="text" required value={editLink.title} onChange={e => setEditLink({...editLink, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Tujuan</label>
                                    <input type="url" required value={editLink.url} onChange={e => setEditLink({...editLink, url: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Teks Badge (Opsional)</label>
                                    <input type="text" value={editLink.badge} onChange={e => setEditLink({...editLink, badge: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" placeholder="Misal: BARU" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditLink(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-purple-600 hover:bg-purple-500 transition font-bold py-2 rounded-xl">Simpan Tautan</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
