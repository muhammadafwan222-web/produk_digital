/* ============== GOOGLE SHEETS FUNCTIONS ============== */
const syncToGoogleSheets=async(action='sync_all',payload={})=>{
if(!gsConfig.webAppUrl){showToast('❌ URL Google Apps Script belum diisi.');return{ok:false,error:'URL kosong'};}
setGsStatus(s=>({...s,syncing:true,error:''}));
try{
await fetch(gsConfig.webAppUrl,{
method:'POST',mode:'no-cors',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify({action,payload,timestamp:new Date().toISOString(),source:'share-to-share-app'})
});
setGsStatus(s=>({...s,syncing:false,lastSync:new Date().toISOString()}));
LS.set('sts_gs_config',gsConfig);
return{ok:true};
}catch(e){
setGsStatus(s=>({...s,syncing:false,error:String(e.message||e)}));
return{ok:false,error:String(e.message||e)};
}
};

const syncLeadToSheets=async(lead)=>{
if(!gsConfig.enabled||!gsConfig.webAppUrl)return;
try{
await syncToGoogleSheets('save_lead',{
id:lead.id,name:lead.name||'',email:lead.email||'',
whatsapp:lead.whatsapp||'',source:lead.source||'manual',
tags:lead.tags||'',status:lead.status||'aktif',
created_at:lead.created_at||new Date().toISOString()
});
}catch(e){console.warn('GS sync failed:',e);}
};

const importFromGoogleSheets=async()=>{
if(!gsConfig.webAppUrl)return showToast('❌ URL Apps Script belum diisi.');
showToast('🔄 Mengambil data dari Google Sheets...');
try{
const res=await fetch(gsConfig.webAppUrl+'?action=get_leads',{method:'GET'});
const text=await res.text();
let data;
try{data=JSON.parse(text);}catch{data=[];}
if(!Array.isArray(data)||!data.length)return showToast('ℹ️ Tidak ada data di Google Sheets.');
let added=0,updated=0;
for(const row of data){
const r=await saveSubscriber({
name:row.name||'',email:row.email||'',whatsapp:row.whatsapp||'',
source:row.source||'google-sheets',tags:row.tags||'',status:row.status||'aktif'
});
if(r?.ok)r.duplicate?updated++:added++;
}
showToast(`✅ Import selesai: ${added} baru, ${updated} diperbarui.`);
}catch(e){showToast('❌ Gagal import: '+(e.message||e));}
};

const persistLocalSubs=(list)=>{LS.set(KEY_SUBS,list.slice(0,5000));};
const saveSubscriber=async(raw)=>{
const payload=normalizeSubscriber(raw);
if(!payload.email&&!payload.whatsapp)return{ok:false,reason:'Email & WhatsApp kosong'};
const list=subsRef.current||[];
const existing=list.find(s=>(payload.email&&String(s.email||'').toLowerCase()===payload.email)||(payload.whatsapp&&String(s.whatsapp||'')===payload.whatsapp));
if(existing){
const merged={...existing,...payload,id:existing.id,name:payload.name||existing.name,tags:payload.tags||existing.tags};
const{error}=await supabaseClient.from('subscribers').update(merged).eq('id',existing.id);
let next;
if(error){const local=LS.get(KEY_SUBS,list).map(s=>s.id===existing.id?merged:s);LS.set(KEY_SUBS,local);next=local;}
else next=list.map(s=>s.id===existing.id?merged:s);
subsRef.current=next;setSubscribers(next);
syncLeadToSheets(merged);
return{ok:true,record:merged,duplicate:true};
}
const row={...payload,id:'sub-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),created_at:nowISO()};
const{data,error}=await supabaseClient.from('subscribers').insert([row]).select();
let saved=row,next;
if(!error&&data&&data[0]){saved=data[0];next=[saved,...list];}
else{const local=LS.get(KEY_SUBS,list);next=[row,...local];LS.set(KEY_SUBS,next);}
subsRef.current=next;setSubscribers(next);
syncLeadToSheets(saved);
return{ok:true,record:saved,duplicate:false};
};

/* ============== BROADCAST ============== */
const buildMessage=(tpl,lead,ctx={})=>{
const prod=ctx.product||productsRef.current.find(p=>String(p.id)===String(ctx.productId||composeRef.current.productId||settingsRef.current.defaultProductId));
const bonusUrl=ctx.bonusUrl||creatorRef.current.bonusUrl||storeUrl();
const link=ctx.link||composeRef.current.link||(prod?storeUrl():(settingsRef.current.defaultLink||storeUrl()));
return String(tpl||'')
.replace(/\{\{nama\}\}/gi,lead?.name||'Kak')
.replace(/\{\{email\}\}/gi,lead?.email||'')
.replace(/\{\{wa\}\}/gi,lead?.whatsapp||'')
.replace(/\{\{toko\}\}/gi,creatorRef.current.name||'')
.replace(/\{\{tanggal\}\}/gi,new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}))
.replace(/\{\{produk\}\}/gi,ctx.productTitle||prod?.title||'Produk Digital Terbaru')
.replace(/\{\{harga\}\}/gi,ctx.price?formatIDR(ctx.price):(prod?formatIDR(prod.price):'Hubungi admin'))
.replace(/\{\{bonus_link\}\}/gi,bonusUrl)
.replace(/\{\{bonus\}\}/gi,settingsRef.current.leadBonusText?`🎁 ${settingsRef.current.leadBonusText}: ${bonusUrl}`:'')
.replace(/\{\{link\}\}/gi,link)
.replace(/\{\{footer\}\}/gi,settingsRef.current.waFooter||'');
};
const sendWhatsAppTo=(lead,message)=>{
const num=formatWANumber(lead.whatsapp);
if(!num)return{status:'gagal',note:'Nomor WA kosong'};
const url=`https://wa.me/${num}?text=${encodeURIComponent(message)}`;
if(composeRef.current.sendMode==='link')return{status:'link siap',url};
const w=window.open(url,'_blank','noopener,noreferrer');
return w?{status:'terkirim',url}:{status:'gagal',note:'Popup diblokir browser',url};
};
const sendEmailTo=async(lead,subject,message)=>{
const to=lead.email;
if(!to)return{status:'gagal',note:'Email kosong'};
const cfg=settingsRef.current;
if(cfg.emailjsPublicKey&&cfg.emailjsServiceId&&cfg.emailjsTemplateId&&window.emailjs){
try{
if(!window.emailjs.__inited){window.emailjs.init({publicKey:cfg.emailjsPublicKey});window.emailjs.__inited=true;}
await window.emailjs.send(cfg.emailjsServiceId,cfg.emailjsTemplateId,{to_email:to,to_name:lead.name||'',from_name:creatorRef.current.name||'',subject,message,store_name:creatorRef.current.name||''});
return{status:'terkirim'};
}catch(e){return{status:'gagal',note:String(e?.text||e?.message||e).slice(0,120)};}
}
const mailto=`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
if(composeRef.current.sendMode==='link')return{status:'link siap',url:mailto};
const w=window.open(mailto,'_blank');
return w?{status:'terkirim',note:'via aplikasi email'}:{status:'gagal',note:'Popup diblokir',url:mailto};
};

const row={id:'log-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),created_at:nowISO(),...entry};
setBroadcastLogs(prev=>{const n=[row,...prev].slice(0,600);LS.set(KEY_LOGS,n);return n;});
await supabaseClient.from('broadcast_logs').insert([row]);
};
const getTargets=(opts={})=>{
const channel=opts.channel||composeRef.current.channel;
const src=opts.targetSource??composeRef.current.targetSource;
const stat=opts.targetStatus??composeRef.current.targetStatus;
const tag=String((opts.targetTag??composeRef.current.targetTag)||'').trim().toLowerCase();
const onlyIds=opts.onlyIds;
return(subsRef.current||[]).filter(s=>{
if(onlyIds&&!onlyIds.includes(s.id))return false;
if(stat!=='Semua'&&(s.status||'aktif')!==stat)return false;
if(src!=='Semua'&&(s.source||'')!==src)return false;
if(tag&&!String(s.tags||'').toLowerCase().includes(tag))return false;
if(channel==='wa'&&!s.whatsapp)return false;
if(channel==='email'&&!s.email)return false;
if(channel==='both'&&!s.whatsapp&&!s.email)return false;
return true;
});
};
const runBroadcast=async(opts={})=>{
if(sendingRef.current){showToast('⚠️ Sedang ada pengiriman berjalan.');return;}
const channel=opts.channel||compose.channel;
const targets=opts.targets||getTargets(opts);
if(!targets.length){showToast('❌ Tidak ada target yang memenuhi filter.');return;}
const tpl=opts.template||compose.message||settings.messageTemplate;
const subjectTpl=opts.subject||compose.subject||settings.emailSubject;
const campaign=opts.campaignName||compose.campaignName||`Kampanye ${new Date().toLocaleDateString('id-ID')}`;
const ctx=opts.context||{productId:compose.productId,link:compose.link};
const delay=Math.max(1,Number(opts.delaySeconds||compose.delaySeconds||settings.delaySeconds||4))*1000;
sendingRef.current=true;cancelRef.current=false;setSending(true);
setSendProgress({done:0,total:targets.length,ok:0,fail:0,current:''});
let ok=0,fail=0;
const touched=[];
for(let i=0;i<targets.length;i++){
if(cancelRef.current)break;
const lead=targets[i];
const message=buildMessage(tpl,lead,ctx);
const subject=buildMessage(subjectTpl,lead,ctx);
setSendProgress(p=>({...p,current:`${lead.name||lead.email||lead.whatsapp}`,done:i}));
const results=[];
if(channel==='wa'||channel==='both'){if(lead.whatsapp)results.push({ch:'WhatsApp',...sendWhatsAppTo(lead,message)});}
if(channel==='email'||channel==='both'){if(lead.email)results.push({ch:'Email',...(await sendEmailTo(lead,subject,message))});}
const allOk=results.length>0&&results.every(r=>r.status!=='gagal');
const anyFail=results.some(r=>r.status==='gagal');
if(allOk)ok++;else if(anyFail)fail++;
const statusLabel=allOk?'terkirim':(anyFail?'gagal':'dilewati');
touched.push({...lead,last_campaign:campaign,last_status:statusLabel,last_sent_at:nowISO()});
await pushLog({name:lead.name||'',email:lead.email||'',whatsapp:lead.whatsapp||'',channel,campaign,status:statusLabel,note:results.map(r=>`${r.ch}: ${r.status}${r.note?` (${r.note})`:''}`).join(' | '),message:message.slice(0,600)});
if(i<targets.length-1&&!cancelRef.current)await sleep(channel!=='email'&&composeRef.current.sendMode==='auto'?delay:Math.min(delay,600));
}
let merged=subsRef.current.map(s=>{const t=touched.find(x=>x.id===s.id);return t?{...s,last_campaign:t.last_campaign,last_status:t.last_status,last_sent_at:t.last_sent_at}:s;});
subsRef.current=merged;setSubscribers(merged);persistLocalSubs(merged);
if(touched.length)await supabaseClient.from('subscribers').upsert(touched.map(t=>({id:t.id,last_campaign:t.last_campaign,last_status:t.last_status,last_sent_at:t.last_sent_at})),{onConflict:'id'});
setSendProgress({done:targets.length,total:targets.length,ok,fail,current:cancelRef.current?'Dihentikan':'Selesai'});
setLastResult({total:targets.length,ok,fail,campaign,at:nowISO(),stopped:cancelRef.current});
sendingRef.current=false;setSending(false);
showToast(cancelRef.current?`⏹️ Dihentikan. ${ok} terkirim, ${fail} gagal.`:`✅ Broadcast selesai: ${ok} terkirim, ${fail} gagal dari ${targets.length} target.`);
};
const sendWelcome=async(lead)=>{
if(!settingsRef.current.autoBroadcastLead)return;
const ctx={bonusUrl:creatorRef.current.bonusUrl||storeUrl(),link:settingsRef.current.defaultLink||storeUrl()};
const ch=(lead.email&&lead.whatsapp)?'both':(lead.whatsapp?'wa':'email');
const message=buildMessage(settingsRef.current.welcomeMessage,lead,ctx);
const subject=buildMessage(settingsRef.current.welcomeSubject,lead,ctx);
const results=[];
if(ch!=='email')results.push({ch:'WhatsApp',...sendWhatsAppTo(lead,message)});
if(ch!=='wa')results.push({ch:'Email',...(await sendEmailTo(lead,subject,message))});
const okAll=results.length&&results.every(r=>r.status!=='gagal');
await updateSubscriber({...lead,last_campaign:'Pesan Selamat Datang',last_status:okAll?'terkirim':'gagal',last_sent_at:nowISO()});
await pushLog({name:lead.name||'',email:lead.email||'',whatsapp:lead.whatsapp||'',channel:ch,campaign:'Pesan Selamat Datang',status:okAll?'terkirim':'gagal',note:results.map(r=>`${r.ch}: ${r.status}${r.note?` (${r.note})`:''}`).join(' | '),message:message.slice(0,600)});
};
const triggerAutoBroadcast=async(kind,ctx)=>{

else if(/\.(csv|txt|tsv)$/i.test(file.name)){const txt=await file.text();wb=XLSX.read(txt,{type:'string'});}
else throw new Error('Format file harus .xlsx / .xls / .csv');
const ws=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
if(!rows.length)throw new Error('Sheet pertama kosong.');
const cols=Object.keys(rows[0]);
const find=(keys)=>cols.find(c=>{const n=String(c).toLowerCase().replace(/[\s_\-.]/g,'');return keys.some(k=>n.includes(k));})||'';
setImportColumns(cols);setImportRows(rows);setImportPreview(rows.slice(0,6));
setImportMap({
name:find(['nama','name','fullname','kontak']),
email:find(['email','surel','mail']),
whatsapp:find(['whatsapp','wa','phone','ponsel','hp','telepon','telp','mobile','nomor','number']),
tags:find(['tag','label','kategori']),
source:find(['source','sumber','asal'])
});
setImportOpen(true);
}catch(e){setImportError(e.message||'Gagal membaca file.');setImportOpen(true);}
};

function LeadFormInline({onSuccess,submitLabel='Kirim & Ambil Bonus'}){
const [f,setF]=useState({name:'',email:'',whatsapp:''});
const [busy,setBusy]=useState(false);
const [err,setErr]=useState('');
const submit=async(e)=>{
e.preventDefault();setErr('');
if(!f.name.trim())return setErr('Nama wajib diisi.');
const em=f.email.trim().toLowerCase();
const wa=formatWANumber(f.whatsapp);
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return setErr('Format email belum benar.');
if(wa.length<9)return setErr('Nomor WhatsApp belum benar.');
setBusy(true);
try{await onSuccess({name:f.name.trim(),email:em,whatsapp:wa});setF({name:'',email:'',whatsapp:''});}
catch(e){setErr('Gagal menyimpan data.');}
setBusy(false);
};
return(
<form onSubmit={submit} class="space-y-2">
<input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Nama lengkap" class="input-premium"/>
<input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="Email aktif" class="input-premium"/>
<input value={f.whatsapp} onChange={e=>setF({...f,whatsapp:e.target.value})} placeholder="Nomor WhatsApp (08xx)" class="input-premium"/>
{err&&<div class="text-[10px] text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-lg px-2.5 py-2"><i class="fa-solid fa-circle-exclamation mr-1"></i>{err}</div>}
<button disabled={busy} class="w-full btn-premium py-3 rounded-xl text-xs font-bold disabled:opacity-60">
{busy?<><i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...</>:<><i class="fa-solid fa-paper-plane mr-2"></i>{submitLabel}</>}
</button>
</form>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
