<script>
window.__fatal = function (msg) {
  console.error(msg);
  alert('Debug: ' + msg);
};

(function () {
  window.__appBooted = false;

  function transformBabelTags() {
    if (!window.Babel || typeof window.Babel.transform !== 'function') {
      window.__fatal('Babel belum siap.');
      return;
    }

    const tags = document.querySelectorAll('script[type="text/babel"]');
    tags.forEach((s) => {
      try {
        const out = window.Babel.transform(s.textContent, { presets: ['react'] }).code;
        const ns = document.createElement('script');
        ns.textContent = out;
        s.parentNode.insertBefore(ns, s);
        s.parentNode.removeChild(s);
      } catch (e) {
        window.__fatal('Babel transform gagal: ' + e.message);
      }
    });
  }

  const ITEMS = [
    { name: 'Tailwind', url: 'https://cdn.tailwindcss.com', check: () => !!window.tailwind, cfg: true },
    { name: 'React', url: 'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js', check: () => !!window.React },
    { name: 'ReactDOM', url: 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js', check: () => !!window.ReactDOM },
    { name: 'Supabase', url: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', check: () => !!window.supabase },
    { name: 'SheetJS', url: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', check: () => !!window.XLSX },
    { name: 'EmailJS', url: 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js', check: () => !!window.emailjs },
    { name: 'Babel', url: 'https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js', check: () => !!window.Babel }
  ];

  function load(i) {
    if (i >= ITEMS.length) {
      setTimeout(() => {
        if (!window.__appBooted) transformBabelTags();
      }, 50);
      document.dispatchEvent(new Event('cdn-ready'));
      return;
    }

    const item = ITEMS[i];
    const s = document.createElement('script');
    s.src = item.url;

    s.onload = function () {
      if (item.cfg && window.tailwind && window.__tailwindConfig) {
        try {
          window.tailwind.config = window.__tailwindConfig;
        } catch (e) {}
      }

      if (item.check()) {
        if (item.name === 'Babel') {
          setTimeout(() => {
            if (!window.__appBooted) transformBabelTags();
          }, 0);
        }
        load(i + 1);
      } else {
        window.__fatal(item.name + ' gagal init.');
        load(i + 1);
      }
    };

    s.onerror = function () {
      window.__fatal('CDN gagal dimuat: ' + item.name);
      load(i + 1);
    };

    document.head.appendChild(s);
  }

  load(0);
})();
</script>

<script type="text/babel" data-presets="react">
window.__appBooted = true;

const { useState, useEffect, useMemo } = React;

/* ================= KONFIG SUPABASE ================= */
const SUPABASE_URL = 'https://cjwbrmolzxnhvigolcfk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqd2JybW9senhuaHZpZ29sY2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODQzMjYsImV4cCI6MjEwNTE2MDMyNn0.mbsRC05ibE0cbQrm2WpCbwOltcjy2aF1aguWRru9JSY';

const offlineBuilder = () => {
  const res = { data: null, error: { message: 'SUPABASE_OFFLINE', code: 'OFFLINE' } };
  const b = {
    then: (f, g) => Promise.resolve(res).then(f, g),
    catch: (g) => Promise.resolve(res).catch(g)
  };

  ['select','insert','update','delete','upsert','eq','neq','gt','lt','in','not','order','limit','single','maybeSingle']
    .forEach(m => { b[m] = () => b; });

  return b;
};

const supabaseClient = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : {
      auth: {
        getSession: () => Promise.resolve({ data: { session: null } }),
        signInWithPassword: () => Promise.resolve({ data: null, error: { message: 'Supabase offline' } }),
        signOut: () => Promise.resolve({ error: null })
      },
      from: () => offlineBuilder(),
      rpc: () => offlineBuilder()
    };

/* ================= DEFAULT DATA ================= */
const DEFAULT_CREATOR = {
  id: 1,
  name: 'Produk Digital',
  username: 'agusdigital',
  verified: true,
  avatar: '',
  bio: 'Berbagi template, e-book, kursus, dan produk digital premium untuk bisnis digital & creator economy.',
  whatsapp: '6282351544347',
  instagram: 'https://instagram.com',
  tiktok: 'https://tiktok.com',
  youtube: 'https://youtube.com',
  bonusTitle: 'Dapatkan Bonus Eksklusif!',
  bonusDescription: 'Bagikan halaman ini ke sosial media kamu untuk membuka bonus produk digital gratis secara instan.',
  bonusUrl: 'https://drive.google.com/drive/folders/ID_FOLDER_ATAU_FILE',
  visitorCount: 0,
  shareCount: 0
};

const LS = {
  get(k, d) {
    try {
      const v = JSON.parse(localStorage.getItem(k));
      return v == null ? d : v;
    } catch (e) {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
  }
};

const formatIDR = (v) =>
  new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(Number(v || 0));

const formatWANumber = (num) => {
  if (!num) return '';
  let f = String(num).replace(/\D/g, '');
  if (f.startsWith('0')) f = '62' + f.substring(1);
  if (f.startsWith('620')) f = '62' + f.substring(3);
  return f;
};

const storeUrl = () => window.location.origin + window.location.pathname;

function App() {
  const [loading, setLoading] = useState(true);
  const [creator, setCreator] = useState(DEFAULT_CREATOR);
  const [products, setProducts] = useState([]);
  const [links, setLinks] = useState([]);
  const [subscribers, setSubscribers] = useState([]);
  const [category, setCategory] = useState('Semua');
  const [search, setSearch] = useState('');
  const [toast, setToast] = useState('');
  const [selectedProduct, setSelectedProduct] = useState(null);

  const [shareOpen, setShareOpen] = useState(false);
  const [shareClicked, setShareClicked] = useState(false);
  const [bonusUnlocked, setBonusUnlocked] = useState(false);

  const [leadOpen, setLeadOpen] = useState(false);
  const [leadBusy, setLeadBusy] = useState(false);
  const [leadForm, setLeadForm] = useState({ name: '', email: '', whatsapp: '' });

  const [refCode, setRefCode] = useState('');

  const showToast = (m) => {
    setToast(m);
    setTimeout(() => setToast(null), 3500);
  };

  /* ================= REFERRAL / SHARE TO SHARE ================= */
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const incomingRef = params.get('ref');

    if (incomingRef) {
      localStorage.setItem('sts_referred_by', incomingRef);
      const visits = Number(localStorage.getItem('sts_ref_visits') || '0') + 1;
      localStorage.setItem('sts_ref_visits', String(visits));
    }

    let myRef = localStorage.getItem('sts_my_ref');
    if (!myRef) {
      myRef = 'STS-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      localStorage.setItem('sts_my_ref', myRef);
    }

    setRefCode(myRef);
  }, []);

  const shareLink = useMemo(() => {
    return storeUrl() + '?ref=' + encodeURIComponent(refCode || 'STS');
  }, [refCode]);

  /* ================= LOAD DATA ================= */
  useEffect(() => {
    async function fetchData() {
      setLoading(true);

      try {
        const sess = await supabaseClient.auth.getSession();

        const { data: creatorData } = await supabaseClient
          .from('creator')
          .select('*')
          .eq('id', 1)
          .single();

        if (creatorData) {
          if (!sessionStorage.getItem('sts_visited')) {
            const count = (creatorData.visitorCount || 0) + 1;
            await supabaseClient
              .from('creator')
              .update({ visitorCount: count })
              .eq('id', 1);

            setCreator({ ...DEFAULT_CREATOR, ...creatorData, visitorCount: count });
            sessionStorage.setItem('sts_visited', '1');
          } else {
            setCreator({ ...DEFAULT_CREATOR, ...creatorData });
          }
        }

        const { data: productData } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (Array.isArray(productData)) setProducts(productData);

        const { data: linkData } = await supabaseClient
          .from('links')
          .select('*');

        if (Array.isArray(linkData)) setLinks(linkData);

        const { data: subData, error: subErr } = await supabaseClient
          .from('subscribers')
          .select('*')
          .order('created_at', { ascending: false });

        if (!subErr && Array.isArray(subData)) {
          setSubscribers(subData);
        } else {
          setSubscribers(LS.get('sts_subscribers', []));
        }
      } catch (e) {
        console.error(e);
        setSubscribers(LS.get('sts_subscribers', []));
      } finally {
        setLoading(false);
      }
    }

    fetchData();
  }, []);

  /* ================= DERIVED ================= */
  const categories = useMemo(() => {
    const set = new Set(products.map(p => p.category).filter(Boolean));
    return ['Semua', ...Array.from(set)];
  }, [products]);

  const filteredProducts = useMemo(() => {
    let list = products;

    if (category !== 'Semua') {
      list = list.filter(p => p.category === category);
    }

    const q = search.trim().toLowerCase();
    if (q) {
      list = list.filter(p =>
        String(p.title || '').toLowerCase().includes(q) ||
        String(p.description || '').toLowerCase().includes(q)
      );
    }

    return list;
  }, [products, category, search]);

  const shareCaption = useMemo(() => {
    return `🚀 GRATIS! Akses Produk Digital Eksklusif dari ${creator.name}

Saya baru saja menemukan platform produk digital keren ini.
Ada e-book, template, kursus, dan bonus digital gratis.

Ambil bonusnya di sini:
${shareLink}

✨ Bagikan juga ke teman kamu supaya bisa dapat bonusnya!`;
  }, [creator.name, shareLink]);

  /* ================= SHARE ACTIONS ================= */
  const copyText = async (text, label) => {
    try {
      await navigator.clipboard.writeText(text);
      showToast('✅ ' + label + ' berhasil disalin!');
    } catch (e) {
      showToast('❌ Gagal menyalin.');
    }
  };

  const openShare = (platform) => {
    let url = '';

    if (platform === 'wa') {
      url = 'https://wa.me/?text=' + encodeURIComponent(shareCaption);
    }

    if (platform === 'telegram') {
      url = 'https://t.me/share/url?url=' + encodeURIComponent(shareLink) + '&text=' + encodeURIComponent(shareCaption);
    }

    if (platform === 'facebook') {
      url = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareLink);
    }

    if (platform === 'x') {
      url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareCaption);
    }

    if (platform === 'copy-link') {
      copyText(shareLink, 'Link share');
      setShareClicked(true);
      return;
    }

    if (platform === 'copy-caption') {
      copyText(shareCaption, 'Caption viral');
      setShareClicked(true);
      return;
    }

    if (url) {
      window.open(url, '_blank', 'noopener,noreferrer');
      setShareClicked(true);
    }
  };

  const confirmShare = async () => {
    const newCount = (creator.shareCount || 0) + 1;

    setCreator(prev => ({ ...prev, shareCount: newCount }));
    setBonusUnlocked(true);
    setShareOpen(false);
    showToast('🎉 Terima kasih! Bonus eksklusif berhasil dibuka.');

    try {
      await supabaseClient
        .from('creator')
        .update({ shareCount: newCount })
        .eq('id', 1);
    } catch (e) {
      console.warn(e);
    }
  };

  /* ================= LEAD FORM ================= */
  const submitLead = async (e) => {
    e.preventDefault();

    const name = leadForm.name.trim();
    const email = leadForm.email.trim().toLowerCase();
    const whatsapp = formatWANumber(leadForm.whatsapp);

    if (!name) return showToast('❌ Nama wajib diisi.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('❌ Format email belum benar.');
    if (whatsapp.length < 9) return showToast('❌ Nomor WhatsApp belum benar.');

    setLeadBusy(true);

    const row = {
      id: 'sub-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      name,
      email,
      whatsapp,
      source: 'shareto-share',
      tags: 'lead',
      status: 'aktif',
      created_at: new Date().toISOString()
    };

    try {
      const { error } = await supabaseClient
        .from('subscribers')
        .insert([row]);

      if (error) throw error;

      setSubscribers(prev => [row, ...prev]);
      setBonusUnlocked(true);
      setLeadOpen(false);
      setLeadForm({ name: '', email: '', whatsapp: '' });
      showToast('🎉 Data tersimpan! Bonus & update otomatis siap dikirim.');
    } catch (e) {
      const local = LS.get('sts_subscribers', []);
      const next = [row, ...local];
      LS.set('sts_subscribers', next);
      setSubscribers(next);
      setBonusUnlocked(true);
      setLeadOpen(false);
      setLeadForm({ name: '', email: '', whatsapp: '' });
      showToast('✅ Data tersimpan di perangkat. Bonus dibuka.');
    } finally {
      setLeadBusy(false);
    }
  };

  const buyProduct = (product) => {
    const wa = formatWANumber(creator.whatsapp);
    const text = `Halo ${creator.name}, saya ingin membeli produk:

*${product.title}*
Harga: ${formatIDR(product.price)}

Saya tahu dari halaman:
${storeUrl()}`;

    window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank');
  };

  /* ================= LOADING ================= */
  if (loading) {
    return (
      <div class="min-h-screen flex items-center justify-center">
        <div class="text-center space-y-4">
          <div class="loader-ring mx-auto"></div>
          <p class="text-sm text-slate-400">Menyiapkan storefront & mesin share...</p>
        </div>
      </div>
    );
  }

  return (
    <div class="min-h-screen flex flex-col relative">
      {/* HEADER */}
      <header class="sticky top-0 z-40 border-b border-white/5 bg-[#030014]/75 backdrop-blur-xl">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
              <i class="fa-solid fa-rocket text-white"></i>
            </div>
            <div>
              <div class="font-display font-bold text-sm leading-none">{creator.name}</div>
              <div class="text-[10px] text-slate-400">@{creator.username} · ShareToShare Engine</div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button
              onClick={() => setLeadOpen(true)}
              class="hidden sm:inline-flex btn-ghost px-4 py-2.5 rounded-xl text-xs font-bold"
            >
              <i class="fa-solid fa-envelope-open-text mr-2 text-cyan-300"></i>
              Daftar Gratis
            </button>

            <button
              onClick={() => setShareOpen(true)}
              class="btn-premium px-4 py-2.5 rounded-xl text-xs font-bold text-white"
            >
              <i class="fa-solid fa-share-nodes mr-2"></i>
              Share & Dapatkan Bonus
            </button>
          </div>
        </div>
      </header>

      <main class="flex-1">
        {/* HERO */}
        <section class="max-w-6xl mx-auto px-4 pt-12 pb-8">
          <div class="grid lg:grid-cols-[1.15fr_.85fr] gap-8 items-center">
            <div class="space-y-6">
              <div class="inline-flex items-center gap-2 px-3 py-2 rounded-full badge-neon text-[10px] font-extrabold uppercase tracking-widest">
                <i class="fa-solid fa-bolt text-amber-300"></i>
                Viral Share Engine
              </div>

              <h1 class="font-display text-4xl md:text-6xl font-extrabold leading-[1.08] text-gradient">
                Bagikan, Dapatkan Followers, Produk Digital & Bonus Otomatis.
              </h1>

              <p class="text-slate-300/90 text-sm md:text-base leading-relaxed max-w-xl">
                Platform storefront modern untuk produk digital, link in bio, lead magnet, dan distribusi viral.
                Setiap pengunjung dapat link share sendiri, lalu bonus terbuka saat mereka membagikan.
              </p>

              <div class="flex flex-wrap gap-3">
                <button
                  onClick={() => setShareOpen(true)}
                  class="btn-premium px-6 py-3.5 rounded-2xl text-sm font-extrabold text-white"
                >
                  <i class="fa-solid fa-fire mr-2"></i>
                  Mulai Share Sekarang
                </button>

                <button
                  onClick={() => document.getElementById('products').scrollIntoView({ behavior: 'smooth' })}
                  class="btn-ghost px-6 py-3.5 rounded-2xl text-sm font-extrabold"
                >
                  <i class="fa-solid fa-box-open mr-2 text-indigo-300"></i>
                  Lihat Produk
                </button>
              </div>

              <div class="grid grid-cols-3 gap-3 max-w-md pt-2">
                <div class="glass-soft rounded-2xl p-4 text-center">
                  <div class="text-xl font-extrabold text-white">{creator.visitorCount || 0}</div>
                  <div class="text-[10px] text-slate-400">Pengunjung</div>
                </div>

                <div class="glass-soft rounded-2xl p-4 text-center">
                  <div class="text-xl font-extrabold text-white">{creator.shareCount || 0}</div>
                  <div class="text-[10px] text-slate-400">Dibagikan</div>
                </div>

                <div class="glass-soft rounded-2xl p-4 text-center">
                  <div class="text-xl font-extrabold text-white">{subscribers.length}</div>
                  <div class="text-[10px] text-slate-400">Terdaftar</div>
                </div>
              </div>
            </div>

            {/* SHARE CARD */}
            <div class="glass rounded-[28px] p-6 relative overflow-hidden">
              <div class="absolute -top-20 -right-20 w-52 h-52 rounded-full bg-cyan-400/15 blur-3xl"></div>
              <div class="absolute -bottom-24 -left-16 w-56 h-56 rounded-full bg-indigo-500/15 blur-3xl"></div>

              <div class="relative">
                <div class="flex items-center justify-between gap-3 mb-5">
                  <div>
                    <div class="text-[10px] uppercase tracking-[0.2em] text-cyan-300 font-black">Share To Share</div>
                    <h3 class="font-display text-xl font-extrabold mt-1">{creator.bonusTitle}</h3>
                  </div>
                  <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-fuchsia-500 to-indigo-500 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-gift"></i>
                  </div>
                </div>

                <p class="text-xs text-slate-300 leading-relaxed mb-5">
                  {creator.bonusDescription}
                </p>

                <div class="space-y-4 mb-6">
                  <div class="share-step" data-step="1">
                    <div class="text-sm font-bold">Daftar / ikuti halaman</div>
                    <div class="text-[11px] text-slate-400 mt-1">Masukkan email & WhatsApp agar update otomatis masuk.</div>
                  </div>

                  <div class="share-step" data-step="2">
                    <div class="text-sm font-bold">Bagikan link unik kamu</div>
                    <div class="text-[11px] text-slate-400 mt-1">Link referral otomatis dibuat untuk setiap pengunjung.</div>
                  </div>

                  <div class="share-step" data-step="3">
                    <div class="text-sm font-bold">Bonus terbuka instan</div>
                    <div class="text-[11px] text-slate-400 mt-1">Setelah share dikonfirmasi, akses bonus langsung muncul.</div>
                  </div>
                </div>

                <div class="glass-soft rounded-2xl p-3 mb-4">
                  <div class="text-[9px] uppercase tracking-widest text-slate-400 mb-2">Link Share Kamu</div>
                  <div class="flex items-center gap-2">
                    <input
                      readOnly
                      value={shareLink}
                      class="flex-1 bg-transparent text-[11px] text-cyan-200 outline-none truncate"
                    />
                    <button
                      onClick={() => openShare('copy-link')}
                      class="btn-ghost px-3 py-2 rounded-xl text-[10px] font-bold"
                    >
                      Salin
                    </button>
                  </div>
                </div>

                {bonusUnlocked ? (
                  <a
                    href={creator.bonusUrl || '#'}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="block w-full text-center btn-premium rounded-2xl px-5 py-4 text-sm font-black text-white"
                  >
                    <i class="fa-solid fa-unlock mr-2"></i>
                    Akses Bonus Sekarang
                  </a>
                ) : (
                  <button
                    onClick={() => setShareOpen(true)}
                    class="w-full btn-premium rounded-2xl px-5 py-4 text-sm font-black text-white"
                  >
                    <i class="fa-solid fa-share-nodes mr-2"></i>
                    Bagikan & Buka Bonus
                  </button>
                )}
              </div>
            </div>
          </div>
        </section>

        <div class="divider-glow max-w-6xl mx-auto"></div>

        {/* LINKS */}
        {links.length > 0 && (
          <section class="max-w-6xl mx-auto px-4 py-8">
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {links.map(link => (
                <a
                  key={link.id}
                  href={link.url}
                  target="_blank"
                  rel="noreferrer"
                  class="glass card-hover rounded-2xl px-4 py-4 flex items-center justify-between gap-3 no-underline text-white"
                >
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-cyan-300">
                      <i class="fa-solid fa-link"></i>
                    </div>
                    <div class="min-w-0">
                      <div class="text-sm font-bold truncate">{link.title}</div>
                      <div class="text-[10px] text-slate-400 truncate">{link.url}</div>
                    </div>
                  </div>
                  <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i>
                </a>
              ))}
            </div>
          </section>
        )}

        {/* PRODUCTS */}
        <section id="products" class="max-w-6xl mx-auto px-4 py-10">
          <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-7">
            <div>
              <div class="text-[10px] uppercase tracking-[0.22em] text-indigo-300 font-black mb-2">
                Digital Products
              </div>
              <h2 class="font-display text-3xl font-extrabold">Produk Digital Premium</h2>
              <p class="text-sm text-slate-400 mt-2">
                E-book, template, kursus, aset desain, dan produk digital lainnya.
              </p>
            </div>

            <div class="w-full lg:w-80">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Cari produk digital..."
                  class="input-premium pl-11"
                />
              </div>
            </div>
          </div>

          <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-3 mb-6">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setCategory(cat)}
                class={
                  'px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition ' +
                  (category === cat
                    ? 'bg-gradient-to-r from-indigo-500 to-cyan-500 text-white shadow-lg shadow-indigo-500/25'
                    : 'glass-soft text-slate-300 hover:text-white')
                }
              >
                {cat}
              </button>
            ))}
          </div>

          {filteredProducts.length > 0 ? (
            <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">
              {filteredProducts.map(product => (
                <div
                  key={product.id}
                  class="glass card-hover rounded-[24px] overflow-hidden cursor-pointer"
                  onClick={() => setSelectedProduct(product)}
                >
                  <div class="h-44 bg-slate-900 relative overflow-hidden">
                    {product.coverUrl ? (
                      <img
                        src={product.coverUrl}
                        alt={product.title}
                        class="w-full h-full object-cover"
                      />
                    ) : (
                      <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-950/60 via-slate-900 to-cyan-950/40">
                        <i class="fa-solid fa-box-open text-4xl text-slate-600"></i>
                      </div>
                    )}

                    <div class="absolute top-3 left-3 badge-neon px-2.5 py-1 rounded-full text-[9px] font-black uppercase tracking-wider">
                      {product.category}
                    </div>
                  </div>

                  <div class="p-5">
                    <h3 class="font-display font-bold text-sm leading-snug mb-2">{product.title}</h3>
                    <p class="text-xs text-slate-400 line-clamp-2 mb-5">
                      {product.description || 'Produk digital premium siap pakai.'}
                    </p>

                    <div class="flex items-center justify-between gap-3 pt-4 border-t border-white/5">
                      <div>
                        <div class="text-[9px] uppercase text-slate-500">Harga</div>
                        <div class="text-lg font-extrabold text-emerald-300">{formatIDR(product.price)}</div>
                      </div>

                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          setSelectedProduct(product);
                        }}
                        class="btn-ghost px-4 py-2.5 rounded-xl text-xs font-bold"
                      >
                        Detail
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div class="glass rounded-[28px] p-14 text-center">
              <i class="fa-solid fa-box-open text-5xl text-slate-700 mb-4"></i>
              <p class="text-sm text-slate-400">
                Belum ada produk ditampilkan. Tambahkan produk dari database Supabase Anda.
              </p>
            </div>
          )}
        </section>

        {/* CTA BAWAH */}
        <section class="max-w-6xl mx-auto px-4 pb-16">
          <div class="glass rounded-[32px] p-8 md:p-12 relative overflow-hidden">
            <div class="absolute -top-24 -right-20 w-64 h-64 bg-indigo-500/15 blur-3xl rounded-full"></div>
            <div class="absolute -bottom-24 -left-20 w-64 h-64 bg-cyan-400/10 blur-3xl rounded-full"></div>

            <div class="relative grid lg:grid-cols-[1fr_auto] gap-8 items-center">
              <div>
                <h2 class="font-display text-3xl md:text-4xl font-extrabold leading-tight">
                  Jadikan halaman ini mesin pertumbuhan otomatis.
                </h2>
                <p class="text-sm text-slate-300 mt-3 max-w-2xl leading-relaxed">
                  Setiap pengunjung bisa menjadi distributor. Mereka membagikan link, Anda mendapatkan traffic,
                  leads, followers, dan potensi penjualan baru.
                </p>
              </div>

              <div class="flex flex-col gap-3">
                <button
                  onClick={() => setShareOpen(true)}
                  class="btn-premium px-7 py-4 rounded-2xl text-sm font-black text-white"
                >
                  <i class="fa-solid fa-bullhorn mr-2"></i>
                  Aktifkan Share
                </button>

                <button
                  onClick={() => setLeadOpen(true)}
                  class="btn-ghost px-7 py-4 rounded-2xl text-sm font-black"
                >
                  <i class="fa-solid fa-user-plus mr-2 text-cyan-300"></i>
                  Kumpulkan Leads
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      {/* FOOTER */}
      <footer class="border-t border-white/5 py-7">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
          <div class="text-xs text-slate-500">
            © {new Date().getFullYear()} {creator.name}. Powered by ShareToShare Engine.
          </div>

          <div class="flex items-center gap-3">
            {creator.instagram && (
              <a href={creator.instagram} target="_blank" rel="noreferrer" class="btn-ghost w-9 h-9 rounded-xl flex items-center justify-center text-slate-300">
                <i class="fa-brands fa-instagram"></i>
              </a>
            )}
            {creator.tiktok && (
              <a href={creator.tiktok} target="_blank" rel="noreferrer" class="btn-ghost w-9 h-9 rounded-xl flex items-center justify-center text-slate-300">
                <i class="fa-brands fa-tiktok"></i>
              </a>
            )}
            {creator.youtube && (
              <a href={creator.youtube} target="_blank" rel="noreferrer" class="btn-ghost w-9 h-9 rounded-xl flex items-center justify-center text-slate-300">
                <i class="fa-brands fa-youtube"></i>
              </a>
            )}
            {creator.whatsapp && (
              <a href={'https://wa.me/' + formatWANumber(creator.whatsapp)} target="_blank" rel="noreferrer" class="btn-ghost w-9 h-9 rounded-xl flex items-center justify-center text-emerald-300">
                <i class="fa-brands fa-whatsapp"></i>
              </a>
            )}
          </div>
        </div>
      </footer>

      {/* TOAST */}
      {toast && (
        <div class="fixed bottom-6 right-6 z-[90] glass border-indigo-400/30 px-5 py-3.5 rounded-2xl text-xs font-bold flex items-center gap-3">
          <i class="fa-solid fa-bell text-cyan-300"></i>
          {toast}
        </div>
      )}

      {/* PRODUCT DETAIL MODAL */}
      {selectedProduct && (
        <div class="modal-overlay" onClick={() => setSelectedProduct(null)}>
          <div
            class="glass w-full max-w-2xl rounded-[30px] overflow-hidden max-h-[90vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            {selectedProduct.coverUrl && (
              <img src={selectedProduct.coverUrl} class="w-full h-56 object-cover" alt="" />
            )}

            <div class="p-6 md:p-8 space-y-5">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="badge-neon inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mb-3">
                    {selectedProduct.category}
                  </div>
                  <h3 class="font-display text-2xl font-extrabold">{selectedProduct.title}</h3>
                </div>

                <button
                  onClick={() => setSelectedProduct(null)}
                  class="btn-ghost w-10 h-10 rounded-xl flex items-center justify-center"
                >
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <p class="text-sm text-slate-300 leading-relaxed">
                {selectedProduct.description || 'Deskripsi produk belum tersedia.'}
              </p>

              <div class="glass-soft rounded-2xl p-5">
                <div class="text-[10px] uppercase tracking-widest text-slate-400 mb-2">Detail Produk</div>
                <div class="text-sm text-slate-200 whitespace-pre-line leading-relaxed">
                  {selectedProduct.details || '• Materi digital siap pakai\n• Bisa diakses setelah pembelian\n• Update mengikuti versi terbaru'}
                </div>
              </div>

              <div class="flex items-center justify-between gap-4 pt-2">
                <div>
                  <div class="text-[10px] uppercase text-slate-500">Harga</div>
                  <div class="text-2xl font-extrabold text-emerald-300">{formatIDR(selectedProduct.price)}</div>
                </div>

                <button
                  onClick={() => buyProduct(selectedProduct)}
                  class="btn-premium px-6 py-4 rounded-2xl text-sm font-black text-white"
                >
                  <i class="fa-brands fa-whatsapp mr-2"></i>
                  Beli via WhatsApp
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* SHARE MODAL */}
      {shareOpen && (
        <div class="modal-overlay" onClick={() => setShareOpen(false)}>
          <div
            class="glass w-full max-w-lg rounded-[30px] p-6 md:p-8 space-y-5"
            onClick={(e) => e.stopPropagation()}
          >
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-[10px] uppercase tracking-[0.22em] text-cyan-300 font-black">
                  Share To Share
                </div>
                <h3 class="font-display text-2xl font-extrabold mt-1">
                  Bagikan & Buka Bonus
                </h3>
              </div>

              <button
                onClick={() => setShareOpen(false)}
                class="btn-ghost w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <p class="text-xs text-slate-300 leading-relaxed">
              Salin link unik kamu atau langsung bagikan ke sosial media. Setelah kamu membagikan,
              klik konfirmasi dan bonus akan terbuka.
            </p>

            <div class="glass-soft rounded-2xl p-4">
              <div class="text-[9px] uppercase tracking-widest text-slate-400 mb-2">Link Unik Kamu</div>
              <div class="flex items-center gap-2">
                <input
                  readOnly
                  value={shareLink}
                  class="flex-1 bg-transparent text-xs text-cyan-200 outline-none truncate"
                />
                <button
                  onClick={() => openShare('copy-link')}
                  class="btn-ghost px-3 py-2 rounded-xl text-[10px] font-bold"
                >
                  Salin
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onClick={() => openShare('wa')} class="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold">
                <i class="fa-brands fa-whatsapp text-emerald-400 mr-2"></i>
                WhatsApp
              </button>

              <button onClick={() => openShare('telegram')} class="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold">
                <i class="fa-brands fa-telegram text-sky-400 mr-2"></i>
                Telegram
              </button>

              <button onClick={() => openShare('facebook')} class="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold">
                <i class="fa-brands fa-facebook text-blue-400 mr-2"></i>
                Facebook
              </button>

              <button onClick={() => openShare('x')} class="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold">
                <i class="fa-brands fa-x-twitter text-white mr-2"></i>
                X / Twitter
              </button>

              <button onClick={() => openShare('copy-caption')} class="btn-ghost rounded-2xl px-4 py-3.5 text-xs font-bold col-span-2">
                <i class="fa-solid fa-copy text-indigo-300 mr-2"></i>
                Salin Caption Viral
              </button>
            </div>

            {shareClicked && !bonusUnlocked && (
              <button
                onClick={confirmShare}
                class="w-full btn-premium rounded-2xl px-5 py-4 text-sm font-black text-white"
              >
                <i class="fa-solid fa-circle-check mr-2"></i>
                Saya Sudah Membagikan — Buka Bonus
              </button>
            )}

            {bonusUnlocked && (
              <a
                href={creator.bonusUrl || '#'}
                target="_blank"
                rel="noopener noreferrer"
                class="block w-full text-center btn-premium rounded-2xl px-5 py-4 text-sm font-black text-white no-underline"
              >
                <i class="fa-solid fa-gift mr-2"></i>
                Bonus Sudah Terbuka — Akses Sekarang
              </a>
            )}
          </div>
        </div>
      )}

      {/* LEAD MODAL */}
      {leadOpen && (
        <div class="modal-overlay" onClick={() => setLeadOpen(false)}>
          <form
            onSubmit={submitLead}
            onClick={(e) => e.stopPropagation()}
            class="glass w-full max-w-md rounded-[30px] p-6 md:p-8 space-y-4"
          >
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-[10px] uppercase tracking-[0.22em] text-emerald-300 font-black">
                  Lead Magnet
                </div>
                <h3 class="font-display text-2xl font-extrabold mt-1">
                  Dapatkan Update & Bonus
                </h3>
              </div>

              <button
                type="button"
                onClick={() => setLeadOpen(false)}
                class="btn-ghost w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <p class="text-xs text-slate-300 leading-relaxed">
              Masukkan nama, email, dan WhatsApp. Produk baru, artikel baru, promo, dan bonus
              dapat dikirim otomatis ke kontak kamu.
            </p>

            <input
              value={leadForm.name}
              onChange={(e) => setLeadForm({ ...leadForm, name: e.target.value })}
              placeholder="Nama lengkap"
              class="input-premium"
            />

            <input
              type="email"
              value={leadForm.email}
              onChange={(e) => setLeadForm({ ...leadForm, email: e.target.value })}
              placeholder="Email aktif"
              class="input-premium"
            />

            <input
              value={leadForm.whatsapp}
              onChange={(e) => setLeadForm({ ...leadForm, whatsapp: e.target.value })}
              placeholder="Nomor WhatsApp (08xx)"
              class="input-premium"
            />

            <button
              type="submit"
              disabled={leadBusy}
              class="w-full btn-premium rounded-2xl px-5 py-4 text-sm font-black text-white disabled:opacity-60"
            >
              {leadBusy ? (
                <span>
                  <i class="fa-solid fa-spinner fa-spin mr-2"></i>
                  Menyimpan...
                </span>
              ) : (
                <span>
                  <i class="fa-solid fa-paper-plane mr-2"></i>
                  Daftar & Ambil Bonus
                </span>
              )}
            </button>

            <p class="text-[9px] text-slate-500 leading-relaxed">
              Dengan mendaftar, kamu menyetujui menerima informasi produk, promo, dan penawaran
              melalui email & WhatsApp. Data tidak dibagikan ke pihak lain.
            </p>
          </form>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
