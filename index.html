<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agust Digital - Link in Bio & Digital Storefront</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff', 100: '#e5edff', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 900: '#312e81',
                        },
                        emerald: {
                            400: '#34d399', 500: '#10b981', 600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card-hover:hover { background: rgba(30, 41, 59, 0.9); border-color: rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // === INISIALISASI SUPABASE ===
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://cjwbrmolzxnhvigolcfk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqd2JybW9senhuaHZpZ29sY2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODQzMjYsImV4cCI6MjEwNTE2MDMyNn0.mbsRC05ibE0cbQrm2WpCbwOltcjy2aF1aguWRru9JSY'; 
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const DEFAULT_CREATOR = {
            id: 1,
            name: "Agust Digital",
            username: "Agustdigital",
            verified: true,
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300",
            bio: "Berbagi template, e-book, dan kursus praktis untuk optimasi bisnis digital & creator economy.",
            whatsapp: "6282351544347",
            instagram: "https://instagram.com",
            tiktok: "https://tiktok.com",
            youtube: "https://youtube.com",
            bankBriNorek: "8801288293019",
            bankBriNama: "Agust Tommy",
            danaNomor: "082351544347",
            danaNama: "Agus Digital",
            qrisUrl: ""
        };

        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);

        function App() {
            const [creator, setCreator] = useState(DEFAULT_CREATOR);
            const [links, setLinks] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [products, setProducts] = useState([]);

            const [viewMode, setViewMode] = useState('store'); 
            const [adminTab, setAdminTab] = useState('overview'); 
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [checkoutProduct, setCheckoutProduct] = useState(null);
            const [checkoutStep, setCheckoutStep] = useState(1);
            const [buyerName, setBuyerName] = useState('');
            const [buyerEmail, setBuyerEmail] = useState('');
            const [buyerPhone, setBuyerPhone] = useState('');
            const [selectedPayment, setSelectedPayment] = useState('bank');
            const [toastMessage, setToastMessage] = useState(null);

            const [editProduct, setEditProduct] = useState(null);
            const [editLink, setEditLink] = useState(null);
            
            const [isBonusUnlocked, setIsBonusUnlocked] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            useEffect(() => {
                async function fetchAllData() {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        setIsAdminUnlocked(true);
                    }

                    const { data: creatorData } = await supabaseClient.from('creator').select('*').eq('id', 1).single();
                    if (creatorData) setCreator(creatorData);

                    const { data: prodData } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
                    if (prodData) setProducts(prodData);

                    const { data: linkData } = await supabaseClient.from('links').select('*');
                    if (linkData) setLinks(linkData);

                    const { data: txData } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                    if (txData) setTransactions(txData);
                }
                fetchAllData();
            }, []);

            const handleLoginAdmin = async (e) => {
                e.preventDefault();
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showToast("❌ Login Gagal: " + error.message);
                } else {
                    setIsAdminUnlocked(true);
                    setViewMode('admin');
                    setEmail('');
                    setPassword('');
                    showToast("🔓 Akses Admin Diberikan!");
                }
            };

            const handleLogoutAdmin = async () => {
                await supabaseClient.auth.signOut();
                setIsAdminUnlocked(false);
                setViewMode('store');
                showToast("🔒 Anda telah keluar.");
            };

            const handleSaveCreator = async (e) => {
                e.preventDefault();
                const creatorToSave = { ...creator, id: 1 };
                const { error } = await supabaseClient.from('creator').upsert(creatorToSave);
                if (!error) {
                    showToast("✅ Pengaturan Profil & Rekening Berhasil Disimpan!");
                } else {
                    showToast("❌ Gagal menyimpan profil.");
                }
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (editProduct.id && !editProduct.id.toString().startsWith('prod-')) {
                    const { error } = await supabaseClient.from('products').update(editProduct).eq('id', editProduct.id);
                    if (!error) {
                        setProducts(products.map(p => p.id === editProduct.id ? editProduct : p));
                        showToast("✅ Produk Diperbarui!");
                    }
                } else {
                    const newProduct = { ...editProduct, salesCount: 0, rating: 5.0 };
                    delete newProduct.id;
                    const { data, error } = await supabaseClient.from('products').insert([newProduct]).select();
                    if (!error && data) {
                        setProducts([data[0], ...products]);
                        showToast("🎉 Produk Baru Diterbitkan!");
                    }
                }
                setEditProduct(null);
            };

            const handleDeleteProduct = async (id) => {
                if (confirm("Hapus produk ini secara permanen?")) {
                    const { error } = await supabaseClient.from('products').delete().eq('id', id);
                    if (!error) {
                        setProducts(products.filter(p => p.id !== id));
                        showToast("🗑️ Produk Dihapus.");
                    }
                }
            };

            const handleSaveLink = async (e) => {
                e.preventDefault();
                if (editLink.id) {
                    const { error } = await supabaseClient.from('links').update(editLink).eq('id', editLink.id);
                    if (!error) {
                        setLinks(links.map(l => l.id === editLink.id ? editLink : l));
                        showToast("✅ Tautan Diperbarui!");
                    }
                } else {
                    const newLink = { ...editLink, id: `link-${Date.now()}` };
                    const { error } = await supabaseClient.from('links').insert([newLink]);
                    if (!error) {
                        setLinks([...links, newLink]);
                        showToast("🎉 Tautan Baru Dibuat!");
                    }
                }
                setEditLink(null);
            };

            const handleDeleteLink = async (id) => {
                if (confirm("Hapus tautan ini?")) {
                    const { error } = await supabaseClient.from('links').delete().eq('id', id);
                    if (!error) {
                        setLinks(links.filter(l => l.id !== id));
                        showToast("🗑️ Tautan Dihapus.");
                    }
                }
            };

            const saveTransactionToDB = async (status, paymentMethod) => {
                const newTx = {
                    id: `INV-${Date.now().toString().slice(-6)}`,
                    buyerName: buyerName,
                    buyerEmail: buyerEmail,
                    buyerPhone: buyerPhone || "-",
                    productTitle: checkoutProduct.title,
                    amount: checkoutProduct.price,
                    paymentMethod: paymentMethod,
                    date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
                    status: status,
                    downloadUrl: checkoutProduct.downloadUrl
                };

                await supabaseClient.from('transactions').insert([newTx]);
                setTransactions([newTx, ...transactions]);

                const updatedSales = (checkoutProduct.salesCount || 0) + 1;
                await supabaseClient.from('products').update({ salesCount: updatedSales }).eq('id', checkoutProduct.id);
                setProducts(products.map(p => p.id === checkoutProduct.id ? { ...p, salesCount: updatedSales } : p));
                
                return newTx;
            };

            const handleCheckoutWhatsApp = async () => {
                const paymentMethodStr = selectedPayment === 'bank' ? 'BANK BRI' : 'DANA';
                await saveTransactionToDB("Menunggu Konfirmasi", paymentMethodStr);
                
                const text = `Halo Admin ${creator.name}, saya telah melunasi pembayaran: \n\n*Produk:* ${checkoutProduct.title}\n*Total:* ${formatIDR(checkoutProduct.price)}\n*Metode:* ${paymentMethodStr}\n*Nama:* ${buyerName}\n*Email:* ${buyerEmail}\n\nMohon kirimkan aksesnya, terima kasih!`;
                window.open(`https://wa.me/${creator.whatsapp}?text=${encodeURIComponent(text)}`, '_blank');
                setCheckoutProduct(null);
            };
            
            const handleCompleteOrder = async (txId) => {
                const { error } = await supabaseClient
                    .from('transactions')
                    .update({ status: 'Selesai' })
                    .eq('id', txId);
                
                if (!error) {
                    setTransactions(transactions.map(tx => 
                        tx.id === txId ? { ...tx, status: 'Selesai' } : tx
                    ));
                    showToast("✅ Status pesanan berhasil diperbarui menjadi Selesai!");
                } else {
                    showToast("❌ Gagal memperbarui status pesanan.");
                }
            }; 
            
            // === FUNGSI SHARE VIRAL (MEGA PROFESIONAL) ===
            const handleShareViral = (platform) => {
                const storeUrl = window.location.href;
                const text = `Halo! Kunjungi platform kreator keren dari ${creator.name} untuk e-book & produk digital terbaik. Cek di sini: ${storeUrl}`;
                
                if (platform === 'wa') {
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                } else if (platform === 'fb') {
                    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(storeUrl)}`, '_blank');
                } else if (platform === 'ig') {
                    navigator.clipboard.writeText(storeUrl);
                    alert("Link toko berhasil disalin! Silakan bagikan ke Story atau Bio Instagram Anda.");
                    window.open(`https://instagram.com`, '_blank');
                } else if (platform === 'copy') {
                    navigator.clipboard.writeText(storeUrl);
                    alert("Link toko berhasil disalin! Silakan paste di bio atau postingan media sosial Anda.");
                }
                
                setTimeout(() => {
                    setIsBonusUnlocked(true);
                    showToast("🎉 Terima kasih telah membagikan! Bonus Eksklusif berhasil dibuka.");
                }, 1500);
            };

            const totalRevenue = useMemo(() => transactions.reduce((sum, tx) => sum + Number(tx.amount || 0), 0), [transactions]);
            const filteredProducts = useMemo(() => selectedCategory === 'Semua' ? products : products.filter(p => p.category === selectedCategory), [products, selectedCategory]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 py-3 px-4 shadow-xl">
                        <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">M</div>
                                <span className="font-bold text-sm text-white">{creator.name} Platform</span>
                            </div>

                            <div className="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
                                <button onClick={() => setViewMode('store')} className={`px-4 py-1.5 rounded-lg text-xs font-semibold ${viewMode === 'store' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-store mr-1.5"></i>Toko (Pengunjung)
                                </button>
                                <button onClick={() => { if(isAdminUnlocked) setViewMode('admin'); else setViewMode('pin_prompt'); }} className={`px-4 py-1.5 rounded-lg text-xs font-semibold ${viewMode === 'admin' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-lock mr-1.5"></i>Kelola Admin
                                </button>
                            </div>
                        </div>
                    </header>

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-800 text-white border border-indigo-500/50 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold">
                            {toastMessage}
                        </div>
                    )}

                    <main className="flex-grow">
                        {viewMode === 'pin_prompt' && (
                            <div className="max-w-sm mx-auto my-20 px-4">
                                <form onSubmit={handleLoginAdmin} className="glass-card p-6 rounded-2xl text-center space-y-4">
                                    <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h2 className="text-base font-bold text-white">Login Admin</h2>
                                    <p className="text-xs text-slate-400">Masukkan kredensial Supabase Anda</p>
                                    
                                    <input 
                                        type="email" 
                                        placeholder="Email Admin" 
                                        value={email} 
                                        onChange={e => setEmail(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-indigo-500" 
                                        required
                                    />
                                    <input 
                                        type="password" 
                                        placeholder="Password" 
                                        value={password} 
                                        onChange={e => setPassword(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-indigo-500" 
                                        required
                                    />
                                    
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-xs py-3 rounded-xl">Buka Dashboard</button>
                                </form>
                            </div>
                        )}

                        {viewMode === 'store' && (
                            <div className="max-w-md mx-auto min-h-screen pb-20 px-4 pt-6">
                                <div className="text-center flex flex-col items-center mb-6">
                                    <img src={creator.avatar} className="w-24 h-24 rounded-full object-cover ring-4 ring-indigo-500/40 p-1 bg-slate-900 mb-3" />
                                    <h1 className="text-xl font-bold text-white flex items-center gap-1.5">{creator.name} {creator.verified && <i className="fa-solid fa-circle-check text-indigo-400 text-sm"></i>}</h1>
                                    <p className="text-xs text-indigo-400 font-medium mb-3">@{creator.username}</p>
                                    <p className="text-xs text-slate-300 leading-relaxed max-w-xs mb-4">{creator.bio}</p>
                                    <div className="flex gap-3">
                                        {creator.instagram && <a href={creator.instagram} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-pink-400"><i className="fa-brands fa-instagram"></i></a>}
                                        {creator.tiktok && <a href={creator.tiktok} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-cyan-400"><i className="fa-brands fa-tiktok"></i></a>}
                                        {creator.youtube && <a href={creator.youtube} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-red-400"><i className="fa-brands fa-youtube"></i></a>}
                                        {creator.whatsapp && <a href={`https://wa.me/${creator.whatsapp}`} target="_blank" className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-emerald-400"><i className="fa-brands fa-whatsapp"></i></a>}
                                    </div>
                                </div>

                                {/* === AREA BONUS SPESIAL (MEGA PROFESIONAL UI) === */}
                                <div className="mb-8 glass-card p-4 rounded-2xl border border-indigo-500/40 bg-indigo-950/30 text-center relative overflow-hidden shadow-[0_0_15px_rgba(99,102,241,0.15)]">
                                    <div className="absolute top-0 right-0 bg-gradient-to-r from-pink-500 to-indigo-600 text-[9px] font-bold px-3 py-1 rounded-bl-xl uppercase shadow-lg text-white tracking-wider">Bonus Spesial</div>
                                    <h3 className="font-bold text-white text-sm mb-1 mt-1"><i className="fa-solid fa-gift text-pink-400 mr-1.5"></i> Dapatkan Bonus Eksklusif!</h3>
                                    <p className="text-xs text-slate-300 mb-4">Bantu bagikan toko ini ke sosial media kamu untuk mendapatkan <strong>Produk Digital Gratis</strong> secara instan.</p>
                                    
                                    {!isBonusUnlocked ? (
                                        <div className="flex flex-wrap gap-2 justify-center mt-2">
                                            <button onClick={() => handleShareViral('wa')} className="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] px-3 py-2 rounded-xl font-bold transition flex items-center shadow-lg shadow-emerald-500/20">
                                                <i className="fa-brands fa-whatsapp mr-1.5 text-sm"></i> WhatsApp
                                            </button>
                                            <button onClick={() => handleShareViral('ig')} className="bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white text-[11px] px-3 py-2 rounded-xl font-bold transition flex items-center shadow-lg shadow-pink-500/20">
                                                <i className="fa-brands fa-instagram mr-1.5 text-sm"></i> Instagram
                                            </button>
                                            <button onClick={() => handleShareViral('fb')} className="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-3 py-2 rounded-xl font-bold transition flex items-center shadow-lg shadow-blue-500/20">
                                                <i className="fa-brands fa-facebook mr-1.5 text-sm"></i> Facebook
                                            </button>
                                            <button onClick={() => handleShareViral('copy')} className="bg-slate-700 hover:bg-slate-600 text-white text-[11px] px-3 py-2 rounded-xl font-bold transition flex items-center w-full sm:w-auto justify-center">
                                                <i className="fa-solid fa-link mr-1.5 text-sm"></i> Salin Link
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="bg-slate-900 border border-emerald-500/40 p-5 rounded-xl inline-block w-full shadow-[0_0_20px_rgba(16,185,129,0.15)] mt-1 transition-all duration-500 transform scale-100">
                                            <span className="text-[11px] text-emerald-400 block mb-3 font-extrabold uppercase tracking-widest animate-pulse">🎉 Bonus Berhasil Dibuka 🎉</span>
                                            
                                            {/* GANTI LINK "https://drive.google.com/..." DI BAWAH INI DENGAN LINK PRODUK GRATIS ANDA */}
                                            <a href="https://drive.google.com/drive/folders/ID_FOLDER_ATAU_FILE" target="_blank" rel="noopener noreferrer" className="inline-block w-full sm:w-auto bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white text-xs font-bold px-6 py-3 rounded-xl shadow-lg transition-transform hover:-translate-y-0.5">
                                                <i className="fa-solid fa-cloud-arrow-down mr-2 text-sm"></i> Unduh Produk Gratis
                                            </a>
                                            
                                            <p className="text-[10px] text-slate-400 mt-3 font-medium">Klik tombol di atas untuk menyimpan hadiah spesial Anda!</p>
                                        </div>
                                    )}
                                </div>
                                {/* === AKHIR AREA BONUS === */}

                                <div className="space-y-2.5 mb-8">
                                    {links.map(link => (
                                        <a key={link.id} href={link.url} target="_blank" className={`glass-card p-3.5 rounded-xl flex items-center justify-between transition hover:border-indigo-500/50 ${link.highlight ? 'border-indigo-500/50 bg-indigo-950/30' : ''}`}>
                                            <span className="text-xs font-semibold text-slate-100">{link.title}</span>
                                            {link.badge && <span className="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full">{link.badge}</span>}
                                        </a>
                                    ))}
                                </div>

                                <div className="mb-4 flex items-center justify-between">
                                    <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400"><i className="fa-solid fa-box-open text-indigo-400 mr-1.5"></i> Produk Digital</h2>
                                    <div className="flex gap-1 overflow-x-auto text-xs pb-1">
                                        {['Semua', 'E-Book', 'Template', 'Kursus/Video'].map(cat => (
                                            <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-2.5 py-1 rounded-lg whitespace-nowrap ${selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>{cat}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {filteredProducts.map(product => (
                                        <div key={product.id} className="glass-card rounded-2xl overflow-hidden flex flex-col hover:border-indigo-500/40 transition">
                                            <div className="h-44 w-full bg-slate-900 relative">
                                                <img src={product.coverUrl} className="w-full h-full object-cover" />
                                                <span className="absolute top-3 left-3 bg-slate-900/80 text-indigo-300 text-[10px] px-2.5 py-1 rounded-full font-bold uppercase backdrop-blur-md">{product.category}</span>
                                            </div>
                                            <div className="p-4 flex flex-col flex-grow">
                                                <h3 className="font-bold text-slate-100 text-sm mb-1">{product.title}</h3>
                                                <p className="text-xs text-slate-400 mb-4 line-clamp-2">{product.description}</p>
                                                <div className="pt-3 border-t border-slate-800 flex items-center justify-between">
                                                    <div>
                                                        <span className="text-[10px] text-slate-500 uppercase block">Harga</span>
                                                        <span className="text-base font-extrabold text-emerald-400">{formatIDR(product.price)}</span>
                                                    </div>
                                                    <button onClick={() => { setCheckoutProduct(product); setCheckoutStep(1); }} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg transition hover:-translate-y-0.5">Beli Sekarang</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {viewMode === 'admin' && (
                            <div className="max-w-5xl mx-auto px-4 py-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-6 rounded-2xl">
                                    <div>
                                        <h1 className="text-xl font-extrabold text-white">Panel Kelola Toko & Pengaturan Admin</h1>
                                        <p className="text-xs text-slate-400 mt-1">Atur profil toko, nomor rekening/DANA, produk digital, dan tautan bio kamu.</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditProduct({ title: '', category: 'E-Book', price: '', description: '', downloadUrl: '', coverUrl: '' })} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2.5 rounded-xl">
                                            <i className="fa-solid fa-plus mr-1"></i> Tambah Produk
                                        </button>
                                        <button onClick={() => setEditLink({ title: '', url: '', badge: '', highlight: false })} className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-3 py-2.5 rounded-xl">
                                            <i className="fa-solid fa-link mr-1"></i> Tambah Link Bio
                                        </button>
                                        <button onClick={handleLogoutAdmin} className="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
                                            <i className="fa-solid fa-right-from-bracket mr-1.5"></i> Keluar
                                        </button>
                                    </div>
                                </div>

                                <div className="flex gap-2 border-b border-slate-800 pb-2 overflow-x-auto text-xs font-semibold">
                                    <button onClick={() => setAdminTab('overview')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${adminTab === 'overview' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Ringkasan & Stats</button>
                                    <button onClick={() => setAdminTab('profile')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${adminTab === 'profile' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Profil & Pembayaran</button>
                                    <button onClick={() => setAdminTab('products')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${adminTab === 'products' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Kelola Produk ({products.length})</button>
                                    <button onClick={() => setAdminTab('links')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${adminTab === 'links' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Tautan Bio ({links.length})</button>
                                    <button onClick={() => setAdminTab('orders')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${adminTab === 'orders' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Riwayat Pesanan</button>
                                </div>

                                {adminTab === 'overview' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="glass-card p-5 rounded-2xl">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Total Omset Penjualan</span>
                                            <p className="text-2xl font-extrabold text-emerald-400 mt-2">{formatIDR(totalRevenue)}</p>
                                        </div>
                                        <div className="glass-card p-5 rounded-2xl">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Transaksi Berhasil</span>
                                            <p className="text-2xl font-extrabold text-white mt-2">{transactions.length} Pesanan</p>
                                        </div>
                                        <div className="glass-card p-5 rounded-2xl">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Produk Aktif</span>
                                            <p className="text-2xl font-extrabold text-white mt-2">{products.length} Item</p>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'profile' && (
                                    <form onSubmit={handleSaveCreator} className="glass-card p-6 rounded-2xl space-y-4 max-w-2xl">
                                        <h3 className="font-bold text-sm text-indigo-400 uppercase border-b border-slate-800 pb-2">Informasi Profil Toko</h3>
                                        <div className="grid grid-cols-2 gap-3 text-xs">
                                            <div>
                                                <label className="block text-slate-300 mb-1">Nama Toko/Kreator</label>
                                                <input type="text" value={creator.name} onChange={e => setCreator({...creator, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                            <div>
                                                <label className="block text-slate-300 mb-1">Username (@)</label>
                                                <input type="text" value={creator.username} onChange={e => setCreator({...creator, username: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                        </div>
                                        <div className="text-xs">
                                            <label className="block text-slate-300 mb-1">URL Avatar / Foto Profil</label>
                                            <input type="url" value={creator.avatar} onChange={e => setCreator({...creator, avatar: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                        </div>
                                        <div className="text-xs">
                                            <label className="block text-slate-300 mb-1">Bio Singkat</label>
                                            <textarea rows="2" value={creator.bio} onChange={e => setCreator({...creator, bio: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                        </div>

                                        <h3 className="font-bold text-sm text-emerald-400 uppercase border-b border-slate-800 pb-2 pt-2">Pengaturan Pembayaran & Kontak WhatsApp</h3>
                                        <div className="grid grid-cols-1 gap-3 text-xs">
                                            <div>
                                                <label className="block text-slate-300 mb-1">Nomor WhatsApp Admin (628...)</label>
                                                <input type="text" value={creator.whatsapp} onChange={e => setCreator({...creator, whatsapp: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 text-xs">
                                            <div>
                                                <label className="block text-slate-300 mb-1">No. Rekening BRI</label>
                                                <input type="text" value={creator.bankBriNorek} onChange={e => setCreator({...creator, bankBriNorek: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                            <div>
                                                <label className="block text-slate-300 mb-1">Atas Nama BRI</label>
                                                <input type="text" value={creator.bankBriNama} onChange={e => setCreator({...creator, bankBriNama: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 text-xs">
                                            <div>
                                                <label className="block text-slate-300 mb-1">No. HP Akun DANA</label>
                                                <input type="text" value={creator.danaNomor} onChange={e => setCreator({...creator, danaNomor: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                            <div>
                                                <label className="block text-slate-300 mb-1">Atas Nama DANA</label>
                                                <input type="text" value={creator.danaNama} onChange={e => setCreator({...creator, danaNama: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-xs py-3 rounded-xl mt-4">Simpan Perubahan Profil & Rekening</button>
                                    </form>
                                )}

                                {adminTab === 'products' && (
                                    <div className="space-y-3">
                                        {products.map(p => (
                                            <div key={p.id} className="glass-card p-4 rounded-xl flex items-center justify-between text-xs">
                                                <div className="flex items-center gap-3">
                                                    <img src={p.coverUrl} className="w-12 h-12 rounded-lg object-cover" />
                                                    <div>
                                                        <div className="font-bold text-white text-sm">{p.title}</div>
                                                        <div className="text-emerald-400 font-semibold">{formatIDR(p.price)} &bull; {p.category}</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setEditProduct(p)} className="bg-slate-800 hover:bg-slate-700 text-indigo-300 px-3 py-1.5 rounded-lg">Edit</button>
                                                    <button onClick={() => handleDeleteProduct(p.id)} className="bg-slate-800 hover:bg-slate-700 text-red-400 px-3 py-1.5 rounded-lg">Hapus</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {adminTab === 'links' && (
                                    <div className="space-y-3">
                                        {links.map(l => (
                                            <div key={l.id} className="glass-card p-4 rounded-xl flex items-center justify-between text-xs">
                                                <div>
                                                    <div className="font-bold text-white">{l.title}</div>
                                                    <div className="text-slate-400 text-[10px]">{l.url}</div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setEditLink(l)} className="bg-slate-800 text-indigo-300 px-3 py-1.5 rounded-lg">Edit</button>
                                                    <button onClick={() => handleDeleteLink(l.id)} className="bg-slate-800 text-red-400 px-3 py-1.5 rounded-lg">Hapus</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {adminTab === 'orders' && (
                                    <div className="glass-card rounded-2xl p-4 overflow-x-auto">
                                        <table className="w-full text-xs text-left">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-slate-400">
                                                    <th className="p-2 whitespace-nowrap">Invoice</th>
                                                    <th className="p-2 whitespace-nowrap">Pembeli</th>
                                                    <th className="p-2 whitespace-nowrap">Produk</th>
                                                    <th className="p-2 whitespace-nowrap">Metode</th>
                                                    <th className="p-2 whitespace-nowrap">Total</th>
                                                    <th className="p-2 whitespace-nowrap">Status</th>
                                                    <th className="p-2 whitespace-nowrap">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/60">
                                                {transactions.map(tx => (
                                                    <tr key={tx.id}>
                                                        <td className="p-2 font-mono text-indigo-300">{tx.id}</td>
                                                        <td className="p-2"><strong>{tx.buyerName}</strong><br/><span className="text-[10px] text-slate-400">{tx.buyerEmail}</span></td>
                                                        <td className="p-2 min-w-[150px]">{tx.productTitle}</td>
                                                        <td className="p-2">{tx.paymentMethod}</td>
                                                        <td className="p-2 font-bold text-emerald-400">{formatIDR(tx.amount)}</td>
                                                        
                                                        <td className={`p-2 font-semibold ${tx.status === 'Selesai' ? 'text-emerald-400' : 'text-amber-400'}`}>
                                                            {tx.status}
                                                        </td>
                                                        
                                                        <td className="p-2">
                                                            <div className="flex gap-2">
                                                                <a 
                                                                    href={`https://mail.google.com/mail/?view=cm&fs=1&to=${tx.buyerEmail}&su=${encodeURIComponent('Akses Pesanan: ' + tx.productTitle)}&body=${encodeURIComponent('Halo ' + tx.buyerName + ',\n\nTerima kasih sudah berbelanja. Berikut adalah link akses produk digital Anda:\n' + tx.downloadUrl + '\n\nSalam Hangat.')}`} 
                                                                    target="_blank" 
                                                                    rel="noopener noreferrer" 
                                                                    className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-[10px] whitespace-nowrap flex items-center"
                                                                >
                                                                    <i className="fa-solid fa-envelope mr-1"></i> Kirim Link
                                                                </a>
                                                                
                                                                {tx.status !== 'Selesai' && (
                                                                    <button 
                                                                        onClick={() => handleCompleteOrder(tx.id)}
                                                                        className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-[10px] whitespace-nowrap flex items-center"
                                                                    >
                                                                        <i className="fa-solid fa-check mr-1"></i> Tandai Selesai
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {checkoutProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="font-bold text-sm text-white">Beli {checkoutProduct.title}</h3>
                                    <button onClick={() => setCheckoutProduct(null)} className="text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                                </div>

                                {checkoutStep === 1 && (
                                    <div className="space-y-3">
                                        <input type="text" placeholder="Nama Lengkap *" value={buyerName} onChange={e => setBuyerName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" />
                                        <input type="email" placeholder="Email Aktif *" value={buyerEmail} onChange={e => setBuyerEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-indigo-500" />
                                        <button onClick={() => { if(!buyerName || !buyerEmail) return showToast("Isi data pembeli!"); setCheckoutStep(2); }} className="w-full bg-indigo-600 font-bold text-xs py-3 rounded-xl">Lanjut ke Pembayaran</button>
                                    </div>
                                )}

                                {checkoutStep === 2 && (
                                    <div className="space-y-3 text-xs">
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer">
                                            <input type="radio" checked={selectedPayment === 'bank'} onChange={() => setSelectedPayment('bank')} className="accent-indigo-500" />
                                            <div><strong>Transfer Bank BRI</strong></div>
                                        </label>
                                        <label className="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer">
                                            <input type="radio" checked={selectedPayment === 'dana'} onChange={() => setSelectedPayment('dana')} className="accent-indigo-500" />
                                            <div><strong>Transfer DANA</strong></div>
                                        </label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCheckoutStep(1)} className="w-1/3 bg-slate-800 py-2.5 rounded-xl">Kembali</button>
                                            <button onClick={() => setCheckoutStep(3)} className="w-2/3 bg-indigo-600 font-bold py-2.5 rounded-xl">Lihat No. Rekening</button>
                                        </div>
                                    </div>
                                )}

                                {checkoutStep === 3 && (
                                    <div className="text-center space-y-4 text-xs">
                                        <div className="bg-amber-500/10 p-2.5 rounded-xl text-amber-300 font-bold">Total: {formatIDR(checkoutProduct.price)}</div>
                                        
                                        {selectedPayment === 'bank' ? (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left">
                                                <div className="text-[10px] text-slate-400">Transfer Bank BRI:</div>
                                                <div className="font-mono text-lg font-bold text-indigo-400">{creator.bankBriNorek}</div>
                                                <div>a/n {creator.bankBriNama}</div>
                                            </div>
                                        ) : (
                                            <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left">
                                                <div className="text-[10px] text-slate-400">Transfer DANA:</div>
                                                <div className="font-mono text-lg font-bold text-blue-400">{creator.danaNomor}</div>
                                                <div>a/n {creator.danaNama}</div>
                                            </div>
                                        )}

                                       <button onClick={handleCheckoutWhatsApp} className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-3 rounded-xl">
                                            <i className="fa-brands fa-whatsapp mr-1"></i> Konfirmasi Pembayaran via WhatsApp
                                        </button>
                                    </div>
                                )}

                                {checkoutStep === 4 && (
                                    <div className="text-center space-y-4">
                                        <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mx-auto"><i className="fa-solid fa-check"></i></div>
                                        <h4 className="font-bold text-white text-sm">Pembayaran Berhasil!</h4>
                                        <a href={checkoutProduct.downloadUrl} target="_blank" className="block w-full bg-emerald-500 text-slate-950 font-bold text-xs py-3 rounded-xl">Unduh Produk Digital</a>
                                        <button onClick={() => setCheckoutProduct(null)} className="w-full bg-slate-800 text-xs py-2 rounded-xl">Selesai</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {editProduct && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveProduct} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Produk Digital</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Produk</label>
                                    <input type="text" required value={editProduct.title} onChange={e => setEditProduct({...editProduct, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-slate-300 mb-1">Kategori</label>
                                        <select value={editProduct.category} onChange={e => setEditProduct({...editProduct, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500">
                                            <option value="E-Book">E-Book</option>
                                            <option value="Template">Template</option>
                                            <option value="Kursus/Video">Kursus/Video</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1">Harga (IDR)</label>
                                        <input type="number" required value={editProduct.price} onChange={e => setEditProduct({...editProduct, price: parseFloat(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Link Akses File (Drive/Notion)</label>
                                    <input type="url" required value={editProduct.downloadUrl} onChange={e => setEditProduct({...editProduct, downloadUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Cover Gambar</label>
                                    <input type="url" value={editProduct.coverUrl} onChange={e => setEditProduct({...editProduct, coverUrl: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Deskripsi</label>
                                    <textarea rows="2" value={editProduct.description} onChange={e => setEditProduct({...editProduct, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500"></textarea>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditProduct(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-indigo-600 hover:bg-indigo-500 transition font-bold py-2 rounded-xl">Simpan Produk</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editLink && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveLink} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 text-xs">
                                <h3 className="font-bold text-white text-sm border-b border-slate-800 pb-2">Kelola Tautan Bio</h3>
                                <div>
                                    <label className="block text-slate-300 mb-1">Judul Tautan</label>
                                    <input type="text" required value={editLink.title} onChange={e => setEditLink({...editLink, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">URL Tujuan</label>
                                    <input type="url" required value={editLink.url} onChange={e => setEditLink({...editLink, url: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="block text-slate-300 mb-1">Teks Badge (Opsional)</label>
                                    <input type="text" value={editLink.badge} onChange={e => setEditLink({...editLink, badge: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-indigo-500" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setEditLink(null)} className="w-1/3 bg-slate-800 hover:bg-slate-700 transition py-2 rounded-xl">Batal</button>
                                    <button type="submit" className="w-2/3 bg-purple-600 hover:bg-purple-500 transition font-bold py-2 rounded-xl">Simpan Tautan</button>
                                </div>
                            </form>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
