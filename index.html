const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
const formatWA = (num) => { if(!num) return ""; let f = num.replace(/\D/g,''); if(f.startsWith('0')) f = '62' + f.substring(1); return f; };
const slugify = (text) => String(text).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-').slice(0, 90);
const plainText = (html) => { const el = document.createElement('div'); el.innerHTML = html; return (el.textContent || '').replace(/\s+/g, ' ').trim(); };
const getFirstImg = (html) => { const m = String(html).match(/<img[^>]+src=["']([^"']+)["']/i); return m ? m[1] : ''; };

const sanitizeHtml = (html) => {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,style,link,meta,form,input,textarea,button').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      const n = attr.name.toLowerCase();
      if (n.startsWith('on') || (n === 'href' && /^\s*javascript:/i.test(attr.value))) el.removeAttribute(attr.name);
    });
    if (el.tagName === 'A') { el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer nofollow'); }
  });
  return doc.body.innerHTML;
};

const extractBloggerXML = (xmlText) => {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('Format XML tidak valid.');
  const entries = [...xml.getElementsByTagName('entry')];
  return entries.map((entry, i) => {
    const title = entry.getElementsByTagName('title')[0]?.textContent?.trim() || 'Tanpa Judul';
    const contentNode = entry.getElementsByTagName('content')[0];
    const content = contentNode?.textContent || '';
    const published = entry.getElementsByTagName('published')[0]?.textContent || new Date().toISOString();
    const author = entry.getElementsByTagName('author')[0]?.getElementsByTagName('name')[0]?.textContent?.trim() || 'Admin';
    const labels = [...entry.getElementsByTagName('category')].map(c => c.getAttribute('term')).filter(t => t && !t.includes('#'));
    return {
      legacy_id: entry.getElementsByTagName('id')[0]?.textContent?.trim() || `xml-${i}`,
      title, slug: slugify(title) || `post-${i+1}`, content_html: sanitizeHtml(content),
      excerpt: plainText(content).slice(0, 220), cover_url: getFirstImg(content),
      author_name: author, published_at: new Date(published).toISOString(), updated_at: new Date().toISOString(),
      status: 'published', labels
    };
  }).filter(p => p.title !== 'Tanpa Judul' || p.content_html);
};

const Toast = ({ message, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
  if (!message) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] animate-slide-up">
      <div className="glass px-5 py-3 rounded-2xl border border-white/10 shadow-2xl flex items-center gap-3 text-sm font-medium text-white">
        <i className="fa-solid fa-circle-check text-emerald-400"></i> {message}
      </div>
    </div>
  );
};

function App() {
  const [loading, setLoading] = useState(true);

  const [blogPosts, setBlogPosts] = useState([]);
  const [affiliateLinks, setAffiliateLinks] = useState(DEFAULT_AFFILIATE);
  const [transactions, setTransactions] = useState([]);
  
  const [view, setView] = useState('store'); 
  const [adminTab, setAdminTab] = useState('overview');
  const [isAdmin, setIsAdmin] = useState(false);
  const [loginEmail, setLoginEmail] = useState('');
  const [loginPass, setLoginPass] = useState('');

  // === PENAMBAHAN STATE YANG HILANG ===
  const [selectedCat, setSelectedCat] = useState('Semua');
  const [searchQ, setSearchQ] = useState('');
  // ===================================

  const [selectedProduct, setSelectedProduct] = useState(null);
  const [checkout, setCheckout] = useState(null);
  const [checkoutStep, setCheckoutStep] = useState(1);
  const [buyer, setBuyer] = useState({ name: '', email: '', phone: '' });
  const [payMethod, setPayMethod] = useState('bank');

  const [selectedPost, setSelectedPost] = useState(null);
  const [blogSearch, setBlogSearch] = useState('');
  const [blogCat, setBlogCat] = useState('Semua');
  
  const [showBonus, setShowBonus] = useState(false);
  const [bonusUnlocked, setBonusUnlocked] = useState(false);
  const [toast, setToast] = useState('');

  const showToast = (msg) => setToast(msg);

  useEffect(() => {
    (async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) setIsAdmin(true);

        const { data: cData } = await supabaseClient.from('creator').select('*').eq('id', 1).maybeSingle();
        if (cData) {
          if (!sessionStorage.getItem('visited')) {
            await supabaseClient.from('creator').update({ visitorCount: (cData.visitorCount || 0) + 1 }).eq('id', 1);
            cData.visitorCount = (cData.visitorCount || 0) + 1;
            sessionStorage.setItem('visited', '1');
          }
          setCreator(cData);
        }

        const { data: pData } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
        if (pData) setProducts(pData);

        const { data: lData } = await supabaseClient.from('links').select('*');
        if (lData) setLinks(lData);

        const { data: bData } = await supabaseClient.from('blog_posts').select('*').order('published_at', { ascending: false });
        if (bData) setBlogPosts(bData);

        const { data: aData } = await supabaseClient.from('affiliate_settings').select('*').order('sort_order');
        if (aData && aData.length) setAffiliateLinks(aData);

        const { data: tData } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
        if (tData) setTransactions(tData);
      } catch (err) {
        console.error("Fetch error:", err);

  }, []);

  useEffect(() => {

      const desc = plainText(selectedPost.excerpt || selectedPost.content_html).slice(0, 155);

      updateMeta('og-title', document.title);
      updateMeta('og-description', creator.bio);
      updateMeta('og-image', creator.avatar);
    }
  }, [view, selectedPost, creator]);

  const handleLogin = async (e) => {

  const handleLogout = async () => {

  };

  const getViralText = () => {
    const url = window.location.href;

  const handleShare = async (platform) => {
    const text = getViralText();

      if (platform === 'wa') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');

      setShowBonus(true);
    } catch (e) { showToast("❌ Gagal membagikan"); }
  };

  const confirmBonus = async () => {
    try {
      const newCount = (creator.shareCount || 0) + 1;
      await supabaseClient.from('creator').update({ shareCount: newCount }).eq('id', 1);
      setCreator(prev => ({ ...prev, shareCount: newCount }));

      showToast("🎉 Bonus Berhasil Dibuka!");
    } catch (e) { showToast("⚠️ Gagal mencatat share"); }
  };

  const createShareCard = async (post) => {
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1350;
    const ctx = canvas.getContext('2d');
    
    const bg = ctx.createLinearGradient(0, 0, 1080, 1350);
    bg.addColorStop(0, '#0f172a'); bg.addColorStop(0.5, '#1e1b4b'); bg.addColorStop(1, '#064e3b');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1350);

    if (post.cover_url) {
      try {
        const img = await new Promise((res, rej) => {
          const i = new Image(); i.crossOrigin = 'anonymous';
          i.onload = () => res(i); i.onerror = rej; i.src = post.cover_url;
          setTimeout(rej, 3000);
        });
        ctx.globalAlpha = 0.4;
        ctx.drawImage(img, 0, 0, 1080, 800);
        ctx.globalAlpha = 1.0;
      } catch (e) { }
    }

    const overlay = ctx.createLinearGradient(0, 400, 0, 1350);
    overlay.addColorStop(0, 'rgba(15,23,42,0)'); overlay.addColorStop(1, 'rgba(15,23,42,0.95)');
    ctx.fillStyle = overlay; ctx.fillRect(0, 0, 1080, 1350);

    ctx.fillStyle = '#a5f3fc'; ctx.font = 'bold 28px Inter';
    ctx.fillText(creator.name.toUpperCase(), 80, 100);

    ctx.fillStyle = '#ffffff'; ctx.font = '900 72px Inter';
    const words = post.title.split(' '); let line = ''; let y = 900;
    for (let n = 0; n < words.length; n++) {
      const test = line + words[n] + ' ';
      if (ctx.measureText(test).width > 920 && n > 0) {
        ctx.fillText(line, 80, y); line = words[n] + ' '; y += 85;
        if (y > 1100) { ctx.fillText(line + '...', 80, y); break; }
      } else { line = test; }
    }
    if (y <= 1100) ctx.fillText(line, 80, y);

    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.roundRect(80, 1200, 920, 80, 40); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px Inter'; ctx.textAlign = 'center';
    ctx.fillText('Baca Selengkapnya di Website', 540, 1252);
    
    return canvas;
  };

                          <td className="p-3 text-slate-400">{new Date(p.published_at).toLocaleDateString('id-ID')}</td>
                          <td className="p-3">
                            <button onClick={() => { if(confirm("Hapus artikel?")) { supabaseClient.from('blog_posts').delete().eq('id', p.id).then(() => { setBlogPosts(prev => prev.filter(x => x.id !== p.id)); showToast("Dihapus"); }); } }} className="text-red-400 hover:text-red-300">Hapus</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {adminTab === 'orders' && (
              <div className="glass rounded-2xl overflow-x-auto">
                <table className="w-full text-xs text-left">
                  <thead className="bg-slate-900/50 text-slate-400 uppercase">
                    <tr><th className="p-3">Invoice</th><th className="p-3">Pembeli</th><th className="p-3">Produk</th><th className="p-3">Total</th><th className="p-3">Status</th></tr>
                  </thead>
                  <tbody>
                    {transactions.map(tx => (
                      <tr key={tx.id} className="border-t border-white/5">
                        <td className="p-3 font-mono text-indigo-300">{tx.id}</td>
                        <td className="p-3 text-white">{tx.buyerName}</td>
                        <td className="p-3 text-slate-300">{tx.productTitle}</td>
                        <td className="p-3 font-bold text-emerald-400">{formatIDR(tx.amount)}</td>
                        <td className="p-3"><span className={`px-2 py-1 rounded-lg text-[10px] font-bold ${tx.status === 'Selesai' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}`}>{tx.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </main>

      {selectedProduct && !selectedProduct.isNew && (
        <div className="fixed inset-0 z-[60] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setSelectedProduct(null)}>
          <div className="glass w-full max-w-lg rounded-3xl overflow-hidden max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <img src={selectedProduct.coverUrl} className="w-full h-56 object-cover" alt="" />
            <div className="p-6">
              <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-lg font-bold uppercase">{selectedProduct.category}</span>
              <h2 className="text-xl font-bold text-white mt-3 mb-2">{selectedProduct.title}</h2>
              <p className="text-2xl font-extrabold text-emerald-400 mb-4">{formatIDR(selectedProduct.price)}</p>
              <p className="text-sm text-slate-300 mb-6">{selectedProduct.description}</p>
              <button onClick={() => { setCheckout(selectedProduct); setCheckoutStep(1); setSelectedProduct(null); }} className="w-full btn-primary text-white font-bold py-3 rounded-xl">
                <i className="fa-solid fa-cart-shopping mr-2"></i>Beli Sekarang
              </button>
            </div>
          </div>
        </div>
      )}

      {checkout && (
        <div className="fixed inset-0 z-[70] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
          <div className="glass w-full max-w-md rounded-3xl p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-6">
              <h3 className="text-lg font-bold text-white">Checkout</h3>
              <button onClick={() => setCheckout(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            {checkoutStep === 1 && (
              <div className="space-y-4">
                <input type="text" placeholder="Nama Lengkap" value={buyer.name} onChange={e => setBuyer({...buyer, name: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-indigo-500" />
                <input type="email" placeholder="Email Aktif" value={buyer.email} onChange={e => setBuyer({...buyer, email: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-indigo-500" />
                <button onClick={() => { if(!buyer.name || !buyer.email) return showToast("⚠️ Isi nama & email!"); setCheckoutStep(2); }} className="w-full btn-primary text-white font-bold py-3 rounded-xl">Lanjut Pembayaran</button>
              </div>
            )}

            {checkoutStep === 2 && (
              <div className="space-y-4">
                <label className={`glass p-4 rounded-xl flex items-center gap-3 cursor-pointer transition ${payMethod === 'bank' ? 'border-indigo-500' : ''}`} onClick={() => setPayMethod('bank')}>
                  <input type="radio" checked={payMethod === 'bank'} onChange={() => setPayMethod('bank')} className="accent-indigo-500" />
                  <div><p className="text-sm font-bold text-white">Transfer Bank BRI</p><p className="text-xs text-slate-400">{creator.bankBriNorek} (a/n {creator.bankBriNama})</p></div>
                </label>
                <label className={`glass p-4 rounded-xl flex items-center gap-3 cursor-pointer transition ${payMethod === 'dana' ? 'border-indigo-500' : ''}`} onClick={() => setPayMethod('dana')}>
                  <input type="radio" checked={payMethod === 'dana'} onChange={() => setPayMethod('dana')} className="accent-indigo-500" />
                  <div><p className="text-sm font-bold text-white">Transfer DANA</p><p className="text-xs text-slate-400">{creator.danaNomor} (a/n {creator.danaNama})</p></div>
                </label>
                <button onClick={() => setCheckoutStep(3)} className="w-full btn-primary text-white font-bold py-3 rounded-xl">Konfirmasi via WhatsApp</button>
              </div>
            )}

            {checkoutStep === 3 && (
              <div className="text-center space-y-4">
                <div className="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                  <p className="text-xs text-amber-300 mb-1">Total Tagihan</p>
                  <p className="text-2xl font-extrabold text-white">{formatIDR(checkout.price)}</p>
                </div>
                <p className="text-xs text-slate-400">Silakan lakukan pembayaran sesuai metode yang dipilih, lalu klik tombol di bawah untuk konfirmasi ke Admin.</p>
                <button onClick={handleCheckoutWA} className="w-full btn-success text-white font-bold py-3 rounded-xl">
                  <i className="fa-brands fa-whatsapp mr-2"></i>Konfirmasi Pembayaran
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {showBonus && (
        <div className="fixed inset-0 z-[80] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
          <div className="glass w-full max-w-sm rounded-3xl p-6 text-center">
            <div className="w-16 h-16 bg-pink-500/20 text-pink-400 rounded-full flex items-center justify-center mx-auto text-2xl mb-4">
              <i className="fa-solid fa-paper-plane"></i>
            </div>
            <h3 className="text-lg font-bold text-white mb-2">Langkah Terakhir!</h3>
            <p className="text-xs text-slate-400 mb-6">Pastikan Anda telah membagikan link toko ini untuk membuka akses bonus eksklusif.</p>
            <div className="flex gap-3">
              <button onClick={() => setShowBonus(false)} className="flex-1 glass text-slate-300 font-bold py-3 rounded-xl text-sm">Batal</button>
              <button onClick={confirmBonus} className="flex-1 btn-success text-white font-bold py-3 rounded-xl text-sm">Saya Sudah Share</button>
            </div>
          </div>
        </div>
      )}

      <Toast message={toast} onClose={() => setToast('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
